[i18n.ko]
name = "무작위 던전"
tag = "솔로 · 협동"
text = "런마다 투기장이 새로 짜입니다. 잠긴 문, 열쇠를 든 우두머리, 숨겨진 상자, 함정, 떨어지는 바위. 지금은 모든 런이 문과 열쇠가 있는 유일한 지역인 얼음왕관 성채에서 진행됩니다."
rules = [
