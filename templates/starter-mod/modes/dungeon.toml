    "런은 순위표에 기록되지 않습니다",
]
rewards = ["골드", "상자", "경험치"]

# Icecrown Citadel's enemies are built for a hero at the end of the campaign (the zone's health
# factor is 39.63), and the mode opens it to a hero that has not got that far: health and hit are
# factors on the campaign's numbers. TUNE
[horde]
enemy_health = 0.6
enemy_damage = 0.75

[dungeon]
enabled = true
start_zone = "icc"
locks = [1, 2]
chests = [1, 2]
traps = [1, 3]
rockfalls = [0, 1]
key_seconds = 90.0
chest_reveal = 6.0

[dungeon.trap]
hit = 0.15
warn = 1.2
rearm = 20.0
reveal = 8.0
knock = 4.0

[dungeon.rockfall]
first = 20.0
every = 25.0
count = 3
radius = 6.0
warn = 2.0
hit = 0.12
spell = 0
knock = 3.0
lasts = 0.0
tick = 1.0
burn = 0.0
color = "8a7a60"
