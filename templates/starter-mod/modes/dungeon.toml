# Random Dungeon: each arena is laid out anew, with locked doors, key bosses, chests, traps and
# rockfalls. For now only Icecrown Citadel carries the doors and keys (see docs/HOWTO-CONTENT.md),
# so every run starts there: `start_zone` picks the zone for the hero and locks the menu's picker.

name = "Random Dungeon"
extends = "standard"

[card]
order = 4
icon = "INV_Misc_Key_14"
color = [0.55, 0.45, 0.25]
tag = "SOLO · CO-OP"
text = "Every run lays out its arenas anew: locked doors, bosses that carry the keys, hidden chests, traps and falling rocks. For now every run is played in Icecrown Citadel, the only zone with doors and keys."
rules = [
    "Doors open only with the key a boss carries",
    "Chests and traps lie hidden in the arena",
    "Runs stay off the leaderboards",
]
rewards = [
    ["INV_Misc_Coin_01", "Gold"],
    ["INV_Box_02", "Chests"],
    ["INV_Misc_Book_11", "Experience"],
]

[i18n.de]
name = "Zufallsverlies"
tag = "SOLO · KOOP"
text = "Jeder Lauf legt seine Arenen neu an: verschlossene Türen, Bosse mit den Schlüsseln, versteckte Truhen, Fallen und fallende Felsen. Vorerst spielt jeder Lauf in der Eiskronenzitadelle, der einzigen Zone mit Türen und Schlüsseln."
rules = [
    "Türen öffnen sich nur mit dem Schlüssel eines Bosses",
    "Truhen und Fallen liegen versteckt in der Arena",
    "Läufe zählen nicht für die Ranglisten",
]
rewards = ["Gold", "Truhen", "Erfahrung"]

[i18n.fr]
name = "Donjon aléatoire"
tag = "SOLO · COOP"
text = "Chaque partie redessine ses arènes : portes verrouillées, boss porteurs de clés, coffres cachés, pièges et chutes de pierres. Pour l'instant, chaque partie se joue dans la citadelle de la Couronne de glace, la seule zone avec des portes et des clés."
rules = [
    "Les portes ne s'ouvrent qu'avec la clé d'un boss",
    "Coffres et pièges sont cachés dans l'arène",
    "Les parties restent hors des classements",
]
rewards = ["Or", "Coffres", "Expérience"]

[i18n.es]
name = "Mazmorra aleatoria"
tag = "SOLO · COOP"
text = "Cada partida dispone sus arenas de nuevo: puertas cerradas, jefes con las llaves, cofres ocultos, trampas y desprendimientos. Por ahora cada partida se juega en la Ciudadela de la Corona de Hielo, la única zona con puertas y llaves."
