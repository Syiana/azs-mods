# Hub: a place to meet, not a run. Up to sixteen heroes stand around in Dalaran, show their
# looks and emote; nothing comes at them, nothing is earned, nothing ends. See docs/PLAN-HUB.md.

name = "Hub"
extends = "standard"

[card]
order = 4
icon = "INV_Misc_Note_02"
color = [0.3, 0.7, 0.45]
tag = "SOCIAL · 1-16"
text = "A quiet square in Dalaran, the city of the Kirin Tor, to meet friends: no horde, no clock, no end. Show your wings and horns, emote, and just hang out."
rules = [
    "Up to sixteen heroes",
    "No enemies, no death, no end",
    "Nothing is earned or recorded",
]
rewards = []

