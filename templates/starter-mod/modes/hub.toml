[hub]
enabled = true
# Dalaran (`places.rs`), the floating city; `hubs open … place=elwynn` meets in Elwynn instead.
place = "dalaran"
# Heroes roam this far from the place's centre, no pillars; the terrain ships this far out.
roam = 400.0

[coop]
max_heroes = 16

[difficulty]
max_tier = 0

# Off as well, though a hub's clock never runs: nothing timed should ever start.
[rift_bar]
enabled = false

[rifts]
enabled = false

[vault]
enabled = false

[lairs]
first_seconds = []

[cursed_chest]
enabled = false

[caches]
enabled = false

[runes]
enabled = false

[magnets]
enabled = false

[events]
enabled = false
