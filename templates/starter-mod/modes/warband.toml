# Warband: the campaign for up to ten heroes, a raid in two groups. The horde grows with every
# hero by the standard co-op factors; the lobby takes ten.

name = "Warband"
extends = "standard"

[card]
order = 2
icon = "INV_Banner_02"
color = [0.75, 0.2, 0.15]
tag = "CO-OP · 2-10"
text = "The campaign's zones for a whole warband: up to ten heroes in one run, two groups of five against a horde that grows with every one of you."
rules = [
    "Up to ten heroes, shown as a raid",
    "Enemies and spawns grow with every hero",
    "Runs stay off the leaderboards",
]
rewards = [
    ["INV_Misc_Coin_01", "Gold"],
    ["INV_Box_02", "Chests"],
    ["INV_Misc_Book_11", "Experience"],
]

[i18n.de]
name = "Kriegsschar"
