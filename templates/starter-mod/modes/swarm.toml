# Swarm: more and weaker enemies, faster levels. An example of a mode on top of the standard.

name = "Swarm"
extends = "standard"

[card]
order = 1
icon = "Ability_Hunter_Pet_Wasp"
color = [0.45, 0.7, 0.2]
tag = "SOLO · CO-OP"
text = "The campaign's zones, but the horde comes thick and frail: far more enemies, each one weaker, and levels come faster."
rules = [
    "Enemies spawn 60% faster",
    "Enemies have 30% less health",
    "More experience from orbs",
    "Runs stay off the leaderboards",
]
rewards = [
    ["INV_Misc_Coin_01", "Gold"],
    ["INV_Box_02", "Chests"],
    ["INV_Misc_Book_11", "Experience"],
]

