[horde]
spawn_rate = 1.6
enemy_health = 0.7
# "Far more enemies": the standard's cap of 120 alive at once would hold the faster spawns
# back, so the swarm may field half as many again. TUNE
max_enemies = 180

[hero]
xp_gain = 1.6
