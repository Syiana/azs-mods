name = "Tägliche Herausforderung"
tag = "SOLO"
text = "Dieselbe Zone, derselbe Held und dieselben Affixe für alle, und dieselben Karten im Angebot. Übe so oft du willst; dein erster Lauf des Tages zählt für die Rangliste."
rules = [
    "Eine neue Herausforderung um Mitternacht (UTC)",
    "Held, Zone, Schwierigkeit und Affixe stehen fest",
    "Alle starten gleich: keine Ausrüstungsboni, Talente oder Vorteile",
