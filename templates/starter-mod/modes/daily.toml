[coop]
max_heroes = 1

[daily]
enabled = true
# Each world's first eight zones (Azeroth, Outland, Northrend), without the staged multi-arena
# finales (the zones with arenas in the packs: Black Temple, Azjol-Nerub, Pit of Saron, Icecrown
# Citadel). The Worker has the same list (web/cloud.js `DAILY_POOLS`): change them together.
zones = [
    "elwynn", "duskwood", "wsg", "ungoro", "ab", "feralas", "arena", "sm",
    "hellfire", "zangarmarsh", "terokkar", "nagrand", "eots", "bladesedge", "karazhan", "netherstorm",
    "borean", "fjord", "dragonblight", "grizzly", "zuldrak", "sholazar", "coldarra", "stormpeaks",
]
classes = []
tiers = [0, 1, 2]
# One of the three affixes a day.
mutator_count = 1
fair = true
