# Daily Challenge: the same zone, class, tier and affixes for everyone on a UTC day, one seed for
# everyone (the same card offers), every hero starting alike. The first run of the day counts on
# the day's board (web/cloud.js `daily_runs`); runs after it are practice.

name = "Daily Challenge"
extends = "standard"

[card]
order = 3
icon = "Spell_Holy_BorrowedTime"
color = [0.15, 0.62, 0.62]
tag = "SOLO"
text = "The same zone, hero and affixes for everyone today, and the same cards on offer. Practise as often as you like; your first run of the day counts on the board."
rules = [
    "A new challenge at midnight (UTC)",
    "Hero, zone, difficulty and affixes are set",
    "Everyone starts alike: no gear bonuses, talents or perks",
    "The first run of the day counts",
]
rewards = [
    ["INV_Misc_Coin_01", "Gold"],
    ["INV_Box_02", "Chests"],
    ["Achievement_Arena_2v2_7", "Daily board"],
]

