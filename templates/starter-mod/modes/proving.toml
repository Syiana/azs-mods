# Proving Grounds: a practice field with training dummies, where every spell, ring, trinket,
# amulet and legendary is free to pick, any number of legendaries at once. Nothing it gains goes
# home: no gold, gear, achievements or experience.

name = "Proving Grounds"
extends = "standard"

[card]
order = 5
icon = "Ability_Warrior_DefensiveStance"
color = [0.55, 0.42, 0.85]
tag = "SOLO · PRACTICE"
text = "A practice field with training dummies. Pick any spell, ring, trinket, amulet and legendary you like, as many legendaries as you want, call the horde when you are ready, or simulate a whole run with waves and bosses."
rules = [
    "Everything is free to pick, any time",
    "Any number of legendaries at once",
    "Training dummies; the horde comes when you call it",
    "You cannot fall; nothing is kept",
]
rewards = [
    ["INV_Misc_PocketWatch_01", "Practice"],
]

