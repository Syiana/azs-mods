# The standard run: every key a mode may set, with the values the game plays by.
# Other modes `extends = "standard"` and write down only what they change.
# See docs/PLAN-MODES.md.

name = "Campaign"

# The content packs a run loads (survivors-content/packs/): only their classes, zones, jewelry and
# mutators exist in it; a pack's requirements are listed too. And the mutators every run plays
# (packs/*/mutators/), beside a Heroic tier's affixes. See docs/PLAN-ARCHITECTURE.md 2.5.
# The kit's copy: the game's own file also lists "cata", a pack the kit does not carry.
packs = ["base", "tbc", "wotlk"]
mutators = []

# The hero menu's Game Modes window: icon, tint, tag, what it is, rules and rewards. A mode that
# extends this one writes its own card.
[card]
order = 0
icon = "INV_Misc_Map_01"
color = [0.85, 0.62, 0.12]
tag = "SOLO · CO-OP"
text = "The zone chain as you know it: hold out against the horde until the zone's boss arrives, slay it and open the next zone."
rules = [
    "Zone and difficulty from the hero menu",
    "Heroic tiers open zone by zone",
    "Weekly affixes from Heroic III",
]
rewards = [
    ["INV_Misc_Coin_01", "Gold"],
    ["INV_Box_02", "Chests"],
    ["INV_Misc_Book_11", "Experience"],
]

