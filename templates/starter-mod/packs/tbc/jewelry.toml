# The Burning Crusade's jewelry (`re/NUMBERS.md` 17.11), the port's own: eight trinkets and two legendary
# amulets, dropping in Outland only. Their worth is the strength of their proc
# (`game/tbc_jewelry.rs`). `TUNE`
#
# A trinket's `base` is set so that its first Common pick (1.5 x base) is worth, averaged over
# the time its proc is up, what the Classic trinket of the same stat is worth for good: Tsunami and
# the Brooch against Earthstrike (+19.5 % damage), Dragonspine and the Skull against the Talisman of
# Ephemeral Power (-10.5 % cooldowns), the Hourglass against Blackhand's Breadth (+29 % critical
# strike damage), Crusade against Earthstrike. The `ceiling` of a damage or cooldown proc is the
# cap it shares with the WotLK procs (+200 % damage, 50 % cooldowns, `jewelry/wotlk.rs`). A test
# in `game/tbc_jewelry.rs` plays the real procs and holds that average.
