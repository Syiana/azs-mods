[[set_bonus]]
key = "warlock_exotic_4"
tier = "exotic"
pieces = 4
scripted = true
text = { en = "Damage-over-time spells affect four additional targets and deal 20% more damage per unique damage-over-time effect you have on the target.", de = "Schaden-über-Zeit-Zauber belegen vier zusätzliche Ziele und verursachen pro eigenem einzigartigem Schaden-über-Zeit-Effekt auf dem Ziel 20% mehr Schaden.", fr = "Vos sorts de dégâts sur la durée touchent quatre cibles supplémentaires et infligent 20 % de dégâts supplémentaires par effet distinct de dégâts sur la durée que vous avez appliqué à la cible.", es = "Los hechizos de daño en el tiempo afectan a cuatro objetivos adicionales e infligen un 20 % más de daño por cada efecto distinto de daño en el tiempo que hayas aplicado al objetivo.", pt = "Seus feitiços de dano ao longo do tempo afetam quatro alvos adicionais e causam 20% a mais de dano por efeito distinto de dano ao longo do tempo que você aplicou ao alvo.", ru = "Ваши заклинания периодического урона поражают ещё четыре цели и наносят на 20% больше урона за каждый отдельный эффект периодического урона, который вы наложили на цель.", pl = "Twoje zaklęcia zadające obrażenia w czasie obejmują cztery dodatkowe cele i zadają o 20% więcej obrażeń za każdy odrębny efekt obrażeń w czasie, który nałożysz na cel.", tr = "Zamanla hasar büyülerin dört ek hedefi etkiler ve hedefteki sana ait her farklı zamanla hasar etkisi başına %20 daha fazla hasar verir.", it = "Gli incantesimi a danno periodico colpiscono quattro bersagli aggiuntivi e infliggono il 20% di danni in più per ogni tuo effetto distinto di danno periodico sul bersaglio.", ja = "継続ダメージ呪文が追加で4体の対象に効果を及ぼし、対象にかかっているあなたの異なる継続ダメージ効果1つにつきダメージが20%増加します。", zh = "持续伤害法术额外影响四个目标，你在目标身上每有一种不同的持续伤害效果，造成的伤害提高20%。", ko = "지속 피해 주문이 대상 4명에게 추가로 걸리며, 대상에게 건 서로 다른 지속 피해 효과마다 피해가 20% 증가합니다." }

[[set_bonus.part]]
mods = ["dot_targets"]
mods_v = 4.0
fixed = true

[[set_bonus]]
key = "warlock_exotic_8"
tier = "exotic"
pieces = 8
scripted = true
text = { en = "Soul Harvest: Enemies affected by Haunt drop souls on death. After collecting 15 souls, your next curse summons a Soul Reaper at the target for 10 sec. It jumps to more cursed enemies when its target dies, up to six jumps, dealing 200% Death Coil damage each.", de = "Seelenernte: Von Heimsuchung betroffene Gegner hinterlassen beim Tod Seelen. Nach 15 gesammelten Seelen ruft dein nächster Fluch 10 Sek. lang einen Seelenschnitter am Ziel. Stirbt sein Ziel, springt er zu weiteren verfluchten Gegnern. Er springt bis zu sechsmal und verursacht bei jedem Treffer 200% Todesmantel-Schaden.", fr = "Moisson d’âmes : les ennemis affectés par Hanter laissent des âmes en mourant. Après avoir ramassé 15 âmes, votre prochaine malédiction invoque un Faucheur d’âmes sur la cible pendant 10 s. À la mort de sa cible, il bondit sur d’autres ennemis maudits, jusqu’à six sauts, infligeant à chaque frappe 200 % des dégâts de Voile mortel.", es = "Cosecha de almas: los enemigos afectados por Poseer dejan almas al morir. Tras recoger 15 almas, tu siguiente maldición invoca a un Segador de Almas en el objetivo durante 10 s. Al morir su objetivo, salta a otros enemigos malditos, hasta seis saltos, con golpes de un 200 % del daño de Espiral de la muerte.", pt = "Colheita de Almas: inimigos afetados por Assombrar deixam almas ao morrer. Após coletar 15 almas, sua próxima maldição invoca um Ceifador de Almas no alvo por 10 s. Quando seu alvo morre, ele salta para outros inimigos amaldiçoados, até seis saltos, causando 200% do dano de Espiral da Morte cada.", ru = "Жатва душ: враги под действием «Блуждающего духа» оставляют души после смерти. Собрав 15 душ, следующим проклятием вы призовёте Жнеца душ к цели на 10 с. После смерти цели он прыгает к другим проклятым врагам, совершая до шести прыжков и нанося по 200% урона «Лика смерти».", pl = "Żniwa dusz: wrogowie pod wpływem Nawiedzenia zostawiają po śmierci dusze. Po zebraniu 15 dusz następna klątwa przyzywa Żniwiarza Dusz przy celu na 10 s. Gdy jego cel zginie, skacze do kolejnych przeklętych wrogów. Skacze do sześciu razy i zadaje ciosy po 200% obrażeń Zwoju śmierci.", tr = "Ruh Hasadı: Musallat etkisindeki düşmanlar öldüklerinde ruh bırakır. 15 ruh topladığında sonraki lanetin hedefte 10 sn boyunca bir Ruh Biçici çağırır. Hedefi ölünce diğer lanetli düşmanlara atlar ve her biri Ölüm Sarmalı hasarının %200'ünü veren en fazla altı sıçrama yapar.", it = "Raccolta d’Anime: i nemici colpiti da Infestazione lasciano anime alla morte. Raccolte 15 anime, la prossima maledizione evoca un Mietitore d’Anime sul bersaglio per 10 s. Alla morte del bersaglio, salta su altri nemici maledetti, fino a sei salti, con colpi da 200% dei danni di Spira della morte ciascuno.", ja = "ソウル・ハーヴェスト：ホーントの影響を受けた敵は死ぬと魂を落とします。魂を15個集めると、次の呪いが対象の位置にソウル・リーパーを10秒間召喚します。対象が死ぬと呪われた別の敵へ飛び移り（最大6回）、そのたびにデス・コイルの200%のダメージを与えます。", zh = "灵魂收获：受到鬼影缠身影响的敌人死亡时会掉落灵魂。收集15个灵魂后，你的下一个诅咒会在目标处召唤一个灵魂收割者，持续10秒。其目标死亡时，它会跳到更多被诅咒的敌人身上，最多跳跃六次，每次造成相当于死亡缠绕200%的伤害。", ko = "영혼 수확: 유령 출몰에 걸린 적이 죽으면 영혼을 떨어뜨립니다. 영혼을 15개 모으면 다음 저주가 대상 위치에 영혼 수확자를 10초 동안 소환합니다. 대상이 죽으면 저주에 걸린 다른 적에게 튀며, 최대 6번 튀고 매번 죽음의 고리 피해의 200%를 줍니다." }
