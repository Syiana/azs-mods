# The Eternal Grave Harvest, the death knight's Exotic set (the balance team's write-up, version 4 of
# 2026-11-16, `Todesritter_Set_Aenderungen`). The 4-piece: you start every run with Plague Strike in
# place of Icy Touch and also with Pestilence; Pestilence lasts 5 sec and every stack of it deals its
# whole hit every sec (`beat`, which also lays the ghouls' and the amulet's Pestilence so); and the
# ghouls this set raises (never a talent's: Master of Ghouls, Army of the Dead) deal {v}% more damage
# (100%, empowered 150%) and strike 2 more enemies. The 8-piece: an enemy that dies under your Pestilence
# (or by a tick of it) rises as a ghoul for 10 sec, up to 10 at once; the ghoul inherits {v2}% of your
# health and blow power (50%, empowered 75%), strikes 2 more enemies (4 with the 4-piece) and casts
# Pestilence with each blow at {v}% damage (200%, empowered 300%; times the 4-piece's boost) as a stack of
# yours; an enemy carries 3 stacks at most from every source, the strongest first (the 3 do not grow with
# the stars). What a ghoul's Pestilence slays rises as a ghoul too, while there is room.
# `visual` is the stock raise-dead look (spell 46584) the ghoul comes up in.

[[set_bonus]]
key = "deathknight_exotic_4"
tier = "exotic"
pieces = 4
mechanic = { kind = "pet_boost", spell = "pestilence", pet = "ghoul", damage = 1.0, targets = 2, empowers = true, beat = { secs = 5.0, every = 1.0 } }
text = { en = "The Eternal Grave Harvest: Start each run with Plague Strike instead of Icy Touch, and also with Pestilence. Your Pestilence lasts 5 sec, and each stack deals its full damage every sec. Ghouls raised by this set deal {v}% more damage and strike 2 additional targets.", de = "Die ewige Grabesernte: Du beginnst jeden Lauf mit Seuchenstoß statt Eisiger Berührung und zusätzlich mit Pestilenz. Deine Pestilenz hält 5 Sek. an, und jeder Stapel verursacht jede Sekunde ihren vollen Schaden. Von diesem Set erhobene Ghule verursachen {v}% mehr Schaden und treffen 2 zusätzliche Ziele.", fr = "La Moisson éternelle des tombes : commencez chaque partie avec Frappe de peste au lieu de Toucher de glace, et aussi avec Pestilence. Votre Pestilence dure 5 s, et chaque cumul inflige tous ses dégâts chaque seconde. Les goules levées par cet ensemble infligent {v}% de dégâts en plus et frappent 2 cibles de plus.", es = "La Cosecha Eterna de las Tumbas: Empiezas cada partida con Golpe de plaga en lugar de Toque helado, y también con Pestilencia. Tu Pestilencia dura 5 s y cada acumulación inflige todo su daño cada segundo. Los necrófagos alzados por este conjunto infligen un {v}% más de daño y golpean a 2 objetivos adicionales.", pt = "A Colheita Eterna dos Túmulos: Comece cada partida com Golpe de Praga em vez de Toque Gélido, e também com Pestilência. Sua Pestilência dura 5 s, e cada acúmulo causa todo o seu dano a cada segundo. Carniçais erguidos por este conjunto causam {v}% a mais de dano e atingem 2 alvos adicionais.", ru = "Вечная жатва могил: вы начинаете каждый забег с Удара чумы вместо Ледяного прикосновения, а также с Мора. Ваш Мор действует 5 с, и каждый заряд наносит весь свой урон каждую секунду. Вурдалаки, восставшие благодаря этому комплекту, наносят на {v}% больше урона и поражают 2 дополнительные цели.", it = "La Mietitura Eterna delle Tombe: inizi ogni partita con Colpo pestilente invece di Tocco gelido, e anche con Pestilenza. La tua Pestilenza dura 5 s e ogni cumulo infligge tutti i suoi danni ogni secondo. I ghoul risvegliati da questo set infliggono il {v}% di danni in più e colpiscono 2 bersagli aggiuntivi.", pl = "Wieczne Żniwa Grobów: zaczynasz każdy bieg z Ciosem zarazy zamiast Lodowego dotyku, a także z Pomorem. Twój Pomór trwa 5 s, a każdy ładunek zadaje pełne obrażenia co sekundę. Ghule wskrzeszone przez ten zestaw zadają o {v}% więcej obrażeń i trafiają 2 dodatkowe cele.", tr = "Ebedî Mezar Hasadı: Her koşuya Buzlu Dokunuş yerine Veba Darbesi ve ayrıca Salgın ile başlarsın. Salgın’ın 5 sn sürer ve her birikim tüm hasarını her saniye verir. Bu set tarafından diriltilen hortlaklar %{v} daha fazla hasar verir ve 2 ek hedefe vurur.", ja = "エターナル・グレイブ・ハーヴェスト：毎回の挑戦をアイシー・タッチの代わりにプレイグ・ストライクで、さらにペスティレンスも習得した状態で開始します。ペスティレンスは5秒間続き、各スタックが毎秒ダメージを全額与えます。このセットで蘇ったグールのダメージが{v}%増加し、追加で2体の対象に命中します。", zh = "永恒坟场收割：每次开局以瘟疫打击代替冰冷触摸，并额外获得传染。你的传染持续5秒，每层每秒造成全额伤害。由此套装复活的食尸鬼造成的伤害提高{v}%，并额外打击2个目标。", ko = "영원한 무덤 수확: 매 도전을 얼음 손길 대신 역병의 일격으로, 그리고 역병도 함께 가지고 시작합니다. 역병은 5초 동안 지속되며 각 중첩이 매초 전체 피해를 줍니다. 이 세트로 일어난 구울의 피해가 {v}% 증가하고 대상을 2명 더 공격합니다." }

# The run starts with Plague Strike in place of the class's first spell, Icy Touch, and with Pestilence as well
# (cards with no boosts, like the starter; as the shaman's Magmaweaver starts with Lava Burst instead of Lightning Bolt).
[[set_bonus.part]]
effects = [{ start_instead = "plague_strike" }, { start_with = "pestilence" }]
fixed = true

[[set_bonus]]
key = "deathknight_exotic_8"
tier = "exotic"
pieces = 8
mechanic = { kind = "pet_harvest", spell = "pestilence", pet = "ghoul", secs = 10.0, cap = 10, inherit = 0.5, damage = 2.0, targets = 2, stacks = 3, visual = 46584, empowers = true }
text = { en = "The Eternal Grave Harvest: Enemies slain while affected by your Pestilence rise as ghouls for 10 seconds, up to 10. They inherit {v2}% of your stats, strike 2 additional targets, and cast Pestilence at {v}% damage with your modifiers. Pestilence stacks up to 3 times per enemy, strongest first.", de = "Die ewige Grabesernte: Gegner, die unter deiner Pestilenz sterben, erheben sich 10 Sekunden lang als Ghule, bis zu 10 gleichzeitig. Sie übernehmen {v2}% deiner Werte, treffen 2 zusätzliche Ziele und wirken Pestilenz mit {v}% Schaden und deinen Modifikatoren. Pestilenz stapelt bis zu 3-mal pro Gegner, der stärkste Stapel zuerst.", fr = "La Moisson éternelle des tombes : les ennemis qui meurent sous votre Pestilence reviennent en goules pendant 10 secondes, jusqu’à 10 à la fois. Elles héritent de {v2}% de vos caractéristiques, frappent 2 cibles de plus et lancent Pestilence à {v}% de dégâts avec vos modificateurs. Pestilence s’empile jusqu’à 3 fois par ennemi, la plus forte en premier.", es = "La Cosecha Eterna de las Tumbas: Los enemigos que mueren bajo tu Pestilencia se alzan como necrófagos durante 10 segundos, hasta 10 a la vez. Heredan un {v2}% de tus estadísticas, golpean a 2 objetivos adicionales y lanzan Pestilencia con un {v}% de daño y tus modificadores. Pestilencia se acumula hasta 3 veces por enemigo, primero la más fuerte.", pt = "A Colheita Eterna dos Túmulos: Inimigos que morrem sob sua Pestilência se erguem como carniçais por 10 segundos, até 10 por vez. Eles herdam {v2}% dos seus atributos, atingem 2 alvos adicionais e lançam Pestilência com {v}% do dano e seus modificadores. Pestilência acumula até 3 vezes por inimigo, a mais forte primeiro.", ru = "Вечная жатва могил: враги, погибшие под действием вашего Мора, восстают вурдалаками на 10 секунд, до 10 одновременно. Они наследуют {v2}% ваших характеристик, поражают 2 дополнительные цели и применяют Мор с {v}% урона и вашими модификаторами. Мор накладывается до 3 раз на каждого врага, сильнейшие применения в приоритете.", it = "La Mietitura Eterna delle Tombe: i nemici morti sotto la tua Pestilenza risorgono come ghoul per 10 secondi, fino a 10 alla volta. Ereditano il {v2}% delle tue statistiche, colpiscono 2 bersagli aggiuntivi e lanciano Pestilenza al {v}% dei danni con i tuoi modificatori. Pestilenza si accumula fino a 3 volte per nemico, prima la più forte.", pl = "Wieczne Żniwa Grobów: wrogowie zabici pod wpływem twojego Pomoru powstają jako ghule na 10 sekund, do 10 naraz. Dziedziczą {v2}% twoich statystyk, trafiają 2 dodatkowe cele i rzucają Pomór z {v}% obrażeń oraz twoimi modyfikatorami. Pomór kumuluje się do 3 razy na wroga, najsilniejszy ładunek jako pierwszy.", tr = "Ebedî Mezar Hasadı: Salgın etkisindeyken ölen düşmanlar 10 saniyeliğine hortlak olarak kalkar. Aynı anda en fazla 10 hortlak olabilir. Niteliklerinin %{v2}’sini alır, 2 ek hedefe vurur ve Salgın’ı %{v} hasarla senin değiştiricilerinle kullanırlar. Salgın düşman başına en fazla 3 kez birikir, en güçlüsü önce gelir.", ja = "エターナル・グレイブ・ハーヴェスト：ペスティレンスの影響下で倒された敵が10秒間グールとして蘇ります（最大10体）。グールはあなたの能力値の{v2}%を引き継ぎ、追加で2体の対象に命中し、あなたの修正値付きで{v}%ダメージのペスティレンスを唱えます。ペスティレンスは敵1体につき最大3回まで重なり、最も強いものが優先されます。", zh = "永恒坟场收割：受到你的传染影响而被消灭的敌人会化为食尸鬼复活10秒，最多10个。它们继承你{v2}%的属性，额外打击2个目标，并以{v}%的伤害施放带有你的加成效果的传染。传染对每个敌人最多叠加3次，最强的层数优先。", ko = "영원한 무덤 수확: 역병에 걸린 채 처치된 적이 10초 동안 구울로 일어납니다(최대 10마리). 구울은 당신의 능력치의 {v2}%를 물려받고, 대상을 2명 더 공격하며, 당신의 보정치가 적용된 {v}% 피해의 역병을 시전합니다. 역병은 적 하나당 최대 3번 중첩되며, 가장 강한 중첩이 우선합니다." }
