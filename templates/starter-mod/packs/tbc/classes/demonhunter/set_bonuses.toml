# Shadow Seam (the demon hunter's Exotic set, the balance team's concept of 2026-11-15, the PDF "DH Exotic Mythic Konzept").
#
# 4 pieces: Chaos Nova's base cooldown 18 -> 5 s, and each Chaos Nova also goes off where the one
# before it was cast (`nova_echo`; the echo leaves no rift, and the first cast of a run has none).
[[set_bonus]]
key = "demonhunter_exotic_4"
tier = "exotic"
pieces = 4
mechanic = { kind = "nova_echo", spell = "chaos_nova", cooldown = 5.0 }
text = { en = "Shadow Seam: Chaos Nova's base cooldown drops from 18 to 5 sec. Each Chaos Nova also goes off at its previous cast location. The echo does not leave a rift.", de = "Schattennaht: Die Grundabklingzeit von Chaosnova sinkt von 18 auf 5 Sek. Chaosnova wird zusätzlich am vorherigen Zauberort ausgelöst. Das Echo hinterlässt keinen Riss.", fr = "Couture d’ombre : le temps de recharge de base de Nova du chaos passe de 18 à 5 s. Chaque Nova du chaos se déclenche aussi au lieu du lancer précédent. L’écho ne laisse pas de faille.", es = "Costura de las Sombras: el tiempo de reutilización base de Nova del caos baja de 18 a 5 s. Cada Nova del caos también se activa en el lugar del lanzamiento anterior. El eco no deja ninguna grieta.", pt = "Costura Sombria: a recarga base de Nova do Caos cai de 18 para 5 s. Cada Nova do Caos também é lançada no local da conjuração anterior. O eco não deixa fenda.", ru = "Теневой шов: базовое время восстановления «Кольца хаоса» сокращается с 18 до 5 с. «Кольцо хаоса» также срабатывает в месте предыдущего применения. Эхо не оставляет разлома.", pl = "Szew Cienia: podstawowy czas odnowienia Novy chaosu spada z 18 do 5 s. Każda Nova chaosu wybucha też w miejscu poprzedniego rzucenia. Echo nie pozostawia szczeliny.", tr = "Gölge Dikişi: Kaos Nova'nın temel bekleme süresi 18 saniyeden 5 saniyeye iner. Her Kaos Nova, önceki kullanım noktasında da patlar. Yankı yarık bırakmaz.", it = "Cucitura d’ombra: il tempo di recupero base di Nova del Caos scende da 18 a 5 s. Ogni Nova del Caos si attiva anche nel punto del lancio precedente. L’eco non lascia alcuna fenditura.", ja = "シャドウ・シーム：カオス・ノヴァの基本クールダウンが18秒から5秒に短縮されます。各カオス・ノヴァは前回唱えた位置でも発動します。この反響は裂け目を残しません。", zh = "暗影裂缝：混乱新星的基础冷却时间从18秒降至5秒。每次混乱新星还会在上一次施放的位置再触发一次。回响不会留下裂隙。", ko = "그림자 솔기: 혼돈의 회오리의 기본 재사용 대기시간이 18초에서 5초로 줄어듭니다. 혼돈의 회오리가 이전 시전 위치에서도 함께 터집니다. 메아리는 균열을 남기지 않습니다." }

# 8 pieces: Chaos Nova leaves a rift ({v} s: 8, 12 at 5 stars); the next Chaos Nova links it to the new
# place, at any distance, and a fel flame travels the seam in a fixed 6 s, leaving a burning trail until it
# arrives, for {v2}% (130, 195) of Chaos Nova's hit once per enemy that touches flame or trail
# (`nova_seam`). The rift is a Legion portal (display 28287), the flame and its trail a bonfire (22993);
# `fire` is the look of the Legion flame spell the flame plays as it sets out. `width` is the yards either
# side of the seam that count as touching it (ours).
[[set_bonus]]
key = "demonhunter_exotic_8"
tier = "exotic"
pieces = 8
mechanic = { kind = "nova_seam", spell = "chaos_nova", rift = 8.0, travel = 6.0, width = 1.5, damage = 1.3, empowers = true, fire = 66197, rift_marker = { entry = 990150, display = 28287, scale = 0.55 }, flame_marker = { entry = 990151, display = 22993, scale = 0.5 } }
text = { en = "Shadow Seam: Chaos Nova leaves a {v} sec rift. Your next Chaos Nova links the rift to your new location. Fel flame travels the seam over 6 sec, leaving a burning trail until it finishes. It deals {v2}% Chaos Nova damage once per enemy that touches the flame or trail.", de = "Schattennaht: Chaosnova hinterlässt einen Riss für {v} Sek. Eure nächste Chaosnova verbindet den Riss mit Eurer neuen Position. Teufelsflammen wandern in 6 Sek. die Naht entlang und hinterlassen eine brennende Spur, bis sie das Ende erreichen. Jeder Feind, der Flamme oder Spur berührt, erleidet einmalig {v2}% des Schadens von Chaosnova.", fr = "Couture d’ombre : Nova du chaos laisse une faille pendant {v} s. Votre prochaine Nova du chaos relie la faille à votre nouvelle position. Une flamme gangrenée parcourt la couture en 6 s et laisse une traînée brûlante jusqu’à son terme. Elle inflige {v2} % des dégâts de Nova du chaos une fois à chaque ennemi qui touche la flamme ou la traînée.", es = "Costura de las Sombras: Nova del caos deja una grieta durante {v} s. Tu siguiente Nova del caos une la grieta con tu nueva ubicación. Una llama vil recorre la costura en 6 s y deja un rastro ardiente hasta que termina. Inflige un {v2} % del daño de Nova del caos una vez a cada enemigo que toque la llama o el rastro.", pt = "Costura Sombria: Nova do Caos deixa uma fenda por {v} s. Sua próxima Nova do Caos liga a fenda à sua nova posição. Uma chama vil percorre a costura em 6 s e deixa um rastro em chamas até terminar. Causa {v2}% do dano de Nova do Caos uma vez a cada inimigo que tocar a chama ou o rastro.", ru = "Теневой шов: «Кольцо хаоса» оставляет разлом на {v} с. Следующее «Кольцо хаоса» соединяет разлом с вашей новой позицией. Пламя Скверны проходит по шву за 6 с, оставляя горящий след, пока не закончит путь. Оно один раз наносит каждому врагу, коснувшемуся пламени или следа, {v2}% урона «Кольца хаоса».", pl = "Szew Cienia: Nova chaosu pozostawia szczelinę na {v} s. Następna Nova chaosu łączy szczelinę z twoim nowym położeniem. Spaczony płomień pokonuje szew w 6 s, zostawiając płonący ślad, aż dotrze do końca. Zadaje każdemu wrogowi, który dotknie płomienia lub śladu, raz {v2}% obrażeń Novy chaosu.", tr = "Gölge Dikişi: Kaos Nova {v} saniyelik bir yarık bırakır. Sonraki Kaos Nova yarığı yeni konumuna bağlar. Bir fel alevi dikiş boyunca 6 saniyede ilerler ve bitene kadar yanan bir iz bırakır. Aleve veya ize dokunan her düşmana bir kez Kaos Nova hasarının %{v2}'ini verir.", it = "Cucitura d’ombra: Nova del Caos lascia una fenditura per {v} s. La successiva Nova del Caos collega la fenditura alla tua nuova posizione. Una fiamma vile percorre la cucitura in 6 s lasciando una scia ardente fino alla fine. Infligge il {v2}% dei danni di Nova del Caos una volta a ogni nemico che tocca la fiamma o la scia.", ja = "シャドウ・シーム：カオス・ノヴァが{v}秒間持続する裂け目を残します。次にカオス・ノヴァを唱えると、裂け目が新しい位置とつながります。フェルの炎が6秒かけて継ぎ目を伝い、終わるまで燃える跡を残します。炎または跡に触れた敵それぞれに1回ずつカオス・ノヴァの{v2}%のダメージを与えます。", zh = "暗影裂缝：混乱新星会留下一道持续{v}秒的裂隙。你的下一次混乱新星会将裂隙与你的新位置连接。邪能火焰在6秒内沿着裂缝蔓延，并留下燃烧的轨迹直至结束。接触火焰或轨迹的每个敌人会受到一次相当于混乱新星{v2}%的伤害。", ko = "그림자 솔기: 혼돈의 회오리가 {v}초 동안 균열을 남깁니다. 다음 혼돈의 회오리를 시전하면 균열이 새 위치와 이어집니다. 지옥 불꽃이 6초에 걸쳐 솔기를 따라 흐르며, 끝날 때까지 불타는 자취를 남깁니다. 불꽃이나 자취에 닿은 적마다 한 번씩 혼돈의 회오리 피해의 {v2}%를 줍니다." }
