# The druid's 8-piece set bonuses: one change to one of its spells per tier (docs/HOWTO-CONTENT.md "A set bonus").

[[set_bonus]]
key = "druid_exotic_8"
tier = "exotic"
pieces = 8
mechanic = { kind = "form_trap", spell = "thorns", radius = 2.0, secs = 5.0, root = 2.0, spreads = 3, cooldown = 10.0 }
marker = { entry = 990102, display = 864, scale = 0.18 }
text = { en = "Thornshift: Changing form leaves thorns for 5 seconds. The first enemy to enter is rooted for 2 seconds and grows new thorns for other enemies. Spreads up to 3 times, with a 10-second internal cooldown.", de = "Dornenwechsel: Ein Gestaltwechsel hinterlässt 5 Sekunden lang Dornen. Der erste Gegner, der sie betritt, wird 2 Sekunden lang festgewurzelt und lässt neue Dornen wachsen. Bis zu 3 Ausbreitungen und 10 Sekunden interne Abklingzeit.", fr = "Ronde des épines : changer de forme laisse des épines pendant 5 s. Le premier ennemi qui les traverse est immobilisé 2 s et fait pousser de nouvelles épines. Jusqu’à 3 propagations, recharge interne de 10 s.", es = "Cambio de espinas: Cambiar de forma deja espinas durante 5 s. El primer enemigo que entra queda enraizado 2 s y hace brotar más espinas. Hasta 3 propagaciones con 10 s de reutilización interna.", pt = "Troca de Espinhos: Mudar de forma deixa espinhos por 5 s. O primeiro inimigo a entrar fica enraizado por 2 s e gera novos espinhos. Até 3 propagações com recarga interna de 10 s.", ru = "Смена шипов: смена облика оставляет шипы на 5 с. Первый враг, наступивший на них, обездвиживается на 2 с и порождает новые шипы. До 3 распространений, внутреннее восстановление 10 с.", it = "Zmiana cierni: Zmiana postaci zostawia ciernie na 5 s. Pierwszy wróg, który na nie wejdzie, zostaje unieruchomiony na 2 s i rozsiewa nowe ciernie. Do 3 rozprzestrzenień, wewnętrzny czas odnowienia 10 s.", pl = "Diken Değişimi: Biçim değiştirmek 5 sn diken bırakır. Giren ilk düşman 2 sn köklenir ve yeni dikenler oluşturur. En fazla 3 yayılma, 10 sn iç bekleme süresi.", tr = "Cambio di Spine: Cambiare forma lascia spine per 5 s. Il primo nemico che vi entra resta immobilizzato per 2 s e fa crescere altre spine. Fino a 3 propagazioni con 10 s di recupero interno.", ja = "ソーンシフト：フォームを変えると5秒間ソーンが残ります。最初に踏み込んだ敵は2秒間移動不能になり、他の敵のために新たなソーンを生やします。最大3回まで広がり、内部クールダウンは10秒です。", zh = "棘变：变换形态时会留下持续5秒的荆棘。第一个进入的敌人被定身2秒，并为其他敌人长出新的荆棘。最多蔓延3次，内置冷却时间10秒。", ko = "가시 변환: 변신을 바꾸면 5초 동안 가시가 남습니다. 처음 들어온 적은 2초 동안 속박되며, 다른 적을 위한 새 가시가 돋아납니다. 최대 3번 퍼지며, 내부 재사용 대기시간은 10초입니다." }

[[set_bonus]]
key = "druid_exotic_4"
tier = "exotic"
pieces = 4
scripted = true
text = { en = "Thornshift: Thorns' base cooldown drops from 20 to 10 seconds. It deals 100% of its damage to up to 3 additional nearby enemies.", de = "Dornenwechsel: Die Grundabklingzeit von Dornen sinkt von 20 auf 10 Sekunden. Dornen verursachen 100% ihres Schadens an bis zu 3 weiteren benachbarten Feinden.", fr = "Ronde des épines : Le temps de recharge de base d'Épines passe de 20 à 10 secondes. Le sort inflige 100 % de ses dégâts à jusqu'à 3 ennemis proches supplémentaires.", es = "Cambio de espinas: La reutilización base de Espinas baja de 20 a 10 segundos. Inflige el 100 % de su daño a hasta 3 enemigos cercanos adicionales.", pt = "Troca de espinhos: A recarga base de Espinhos cai de 20 para 10 segundos. A habilidade causa 100% do seu dano a até 3 inimigos próximos adicionais.", ru = "Смена шипов: Базовое время восстановления Шипов сокращается с 20 до 10 секунд. Шипы наносят 100% своего урона ещё максимум 3 ближайшим врагам.", it = "Cambio di spine: Il recupero base di Spine scende da 20 a 10 secondi. Spine infligge il 100% dei suoi danni a un massimo di altri 3 nemici vicini.", pl = "Zmiana cierni: Podstawowy czas odnowienia Cierni spada z 20 do 10 sekund. Ciernie zadają 100% swoich obrażeń maksymalnie 3 dodatkowym pobliskim wrogom.", tr = "Diken Değişimi: Dikenler'in temel bekleme süresi 20 saniyeden 10 saniyeye düşer. Yakındaki en fazla 3 ek düşmana hasarının %100'ünü verir.", ja = "ソーンシフト：ソーンの基本クールダウンが20秒から10秒に短縮されます。近くの敵最大3体にも100%のダメージを与えます。", zh = "棘变：荆棘术的基础冷却时间从20秒降至10秒。它还会对附近最多3个额外敌人造成100%的伤害。", ko = "가시 변환: 가시의 기본 재사용 대기시간이 20초에서 10초로 줄어듭니다. 근처의 적 최대 3명에게 추가로 피해의 100%를 줍니다." }
