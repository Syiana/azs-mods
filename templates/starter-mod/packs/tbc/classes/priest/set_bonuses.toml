# Circle of Holy Light, the priest's Exotic set (the balance team's write-up of 2026-11-14). A yard is
# 0.9144 m, so 10 m is 10.93613 yd and 6 m 6.56168 yd. The 4-piece: you start every run with
# Lightwell as well as the class's first spell, and each cast sets three whole wells in a triangle 10 m
# round you (one straight ahead, two behind), which stay where they were set and join the wells of the
# casts before until their own time is out, 27 at most (`max`: the circle is closed; at the limit the
# oldest are replaced). With 8 pieces the 27 `slots` of the circle are fixed places 13.33 degrees apart;
# the first triangle takes places 0, 9 and 18, every further cast one place further on clockwise.
# The 8-piece: the wells orbit you clockwise at 7 m/s (a turn in 2 pi * 10 / 7 = 8.976 sec)
# and follow you, aim by rank (boss, guardian, elite, normal) within the spell's 25, and shoot a
# missile that deals its hit when it lands and jumps on to two more enemies within 6 m (the
# amulets' jumps follow); every hit burns for {v}% of the damage it dealt (100%, empowered 150%) over
# 3 sec, and an enemy the burn kills bursts for 20% of its maximum health on everything within 6 m.

[[set_bonus]]
key = "priest_exotic_4"
tier = "exotic"
pieces = 4
mechanic = { kind = "field_ring", spell = "lightwell", count = 3, max = 27, radius = 10.93613, entry = 31883, display = 27769 }
text = { en = "Circle of Holy Light: You also start every run with Lightwell. Lightwell places three wells in a triangle around you, each 10 m from you.", de = "Zirkel des Heiligen Lichts: Du beginnst jeden Lauf zusätzlich mit Brunnen des Lichts. Brunnen des Lichts platziert drei Brunnen in einem Dreieck um dich, jeweils 10 m von dir entfernt.", fr = "Cercle de lumière sacrée : Vous commencez aussi chaque partie avec Puits de lumière. Puits de lumière place trois puits en triangle autour de vous, chacun à 10 m de vous.", es = "Círculo de Luz Sagrada: También empiezas cada partida con Pozo de Luz. Pozo de Luz coloca tres pozos en triángulo a tu alrededor, cada uno a 10 m de ti.", pt = "Círculo da Luz Sagrada: Você também começa cada partida com Poço de Luz. Poço de Luz coloca três poços em triângulo ao seu redor, cada um a 10 m de você.", ru = "Круг священного света: Вы также начинаете каждый забег с Источником Света. Источник Света размещает три колодца треугольником вокруг вас, каждый в 10 м от вас.", it = "Cerchio di Luce Sacra: Inizi ogni partita anche con Pozzo di luce. Pozzo di luce dispone tre pozzi a triangolo intorno a te, ciascuno a 10 m da te.", pl = "Krąg Świętego Światła: Każdą rozgrywkę zaczynasz dodatkowo ze Studnią światła. Studnia światła tworzy trzy studnie w trójkącie wokół ciebie, każdą 10 m od ciebie.", tr = "Kutsal Işık Çemberi: Her oyuna ayrıca Işık Pınarı ile başlarsın. Işık Pınarı, her biri senden 10 m uzakta olacak şekilde etrafında üçgen biçiminde üç pınar yerleştirir.", ja = "聖なる光の環：毎ラン、追加でライトウェルを持って始めます。ライトウェルは、あなたの周囲に、それぞれ10メートル離れた三角形の位置に3つの泉を設置します。", zh = "圣光之环：你每场对局还会额外以光束泉开始。光束泉会在你周围以三角形放置三口泉，每口距离你10码。", ko = "성스러운 빛의 원: 매 런을 추가로 빛샘과 함께 시작합니다. 빛샘이 당신 주위에 각각 10미터 떨어진 삼각형으로 샘 셋을 놓습니다." }

# The run starts with Lightwell as well as the class's first spell (a card with no boosts, like the starter).
[[set_bonus.part]]
effects = [{ start_with = "lightwell" }]
fixed = true

[[set_bonus]]
key = "priest_exotic_8"
tier = "exotic"
pieces = 8
# `speed` is Penance's missile (spell 47666, 40 yd a second in Spell.dbc), the look 910906 below the same
# missile at half its size.
mechanic = { kind = "field_burn", spell = "lightwell", period = 8.976, clockwise = true, ticks = 3, every = 1.0, damage = 1.0, empowers = true, burst = 0.2, radius = 6.56168, visual = 48135, jumps = 2, jump_radius = 6.56168, speed = 40.0, shot = 910906, ranked = true, slots = 27 }
text = { en = "Circle of Holy Light: The wells orbit you clockwise and follow you while active. New wells join the existing ones until the circle is closed. Each well shot jumps to two additional enemies within 6 m. Enemies hit burn for {v}% of the damage dealt over 3 sec. Enemies slain by the burn explode for 20% of their maximum health within 6 m.", de = "Zirkel des Heiligen Lichts: Die Brunnen kreisen im Uhrzeigersinn um dich und folgen dir, solange sie aktiv sind. Neue Brunnen kommen zu den bestehenden hinzu, maximal bis der Kreis geschlossen ist. Jeder Schuss eines Brunnens springt auf zwei weitere Gegner im Umkreis von 6 m. Getroffene Gegner brennen 3 Sek. lang für {v}% des verursachten Schadens. Durch den Brand getötete Gegner explodieren für 20% ihres maximalen Lebens im Umkreis von 6 m.", fr = "Cercle de lumière sacrée : Tant qu’ils sont actifs, les puits gravitent autour de vous dans le sens horaire et vous suivent. De nouveaux puits s’ajoutent aux puits existants jusqu’à ce que le cercle soit fermé. Chaque tir d’un puits rebondit sur deux ennemis supplémentaires dans un rayon de 6 m. Les ennemis touchés brûlent pendant 3 s pour {v} % des dégâts infligés. Les ennemis tués par la brûlure explosent et infligent 20 % de leurs points de vie maximum dans un rayon de 6 m.", es = "Círculo de Luz Sagrada: Mientras están activos, los pozos orbitan a tu alrededor en sentido horario y te siguen. Los pozos nuevos se suman a los existentes hasta que el círculo se cierra. Cada disparo de un pozo salta a dos enemigos adicionales en un radio de 6 m. Los enemigos alcanzados arden durante 3 s por el {v} % del daño infligido. Los enemigos que mueren por la quemadura explotan e infligen un 20 % de su salud máxima en un radio de 6 m.", pt = "Círculo da Luz Sagrada: Enquanto estiverem ativos, os poços orbitam você no sentido horário e seguem você. Novos poços se juntam aos existentes até que o círculo se feche. Cada disparo de um poço salta para mais dois inimigos em um raio de 6 m. Inimigos atingidos queimam por 3 s com {v}% do dano causado. Inimigos mortos pela queimadura explodem e causam 20% da vida máxima em um raio de 6 m.", ru = "Круг священного света: Пока колодцы активны, они вращаются вокруг вас по часовой стрелке и следуют за вами. Новые колодцы добавляются к существующим, пока круг не замкнётся. Каждый выстрел колодца перескакивает ещё на двух врагов в радиусе 6 м. Пораженные враги горят 3 сек., получая {v}% нанесённого урона. Погибшие от ожога враги взрываются, нанося 20% своего максимального запаса здоровья в радиусе 6 м.", it = "Cerchio di Luce Sacra: Finché sono attivi, i pozzi orbitano intorno a te in senso orario e ti seguono. I nuovi pozzi si aggiungono a quelli esistenti finché il cerchio non è chiuso. Ogni colpo di un pozzo rimbalza su altri due nemici entro 6 m. I nemici colpiti bruciano per 3 s per il {v}% dei danni inflitti. I nemici uccisi dalla bruciatura esplodono e infliggono il 20% della loro salute massima entro 6 m.", pl = "Krąg Świętego Światła: Dopóki studnie są aktywne, krążą wokół ciebie zgodnie z ruchem wskazówek zegara i podążają za tobą. Nowe studnie dołączają do istniejących, aż krąg się zamknie. Każdy strzał studni przeskakuje na dwóch dodatkowych wrogów w promieniu 6 m. Trafieni wrogowie płoną przez 3 sek., otrzymując {v}% zadanych obrażeń. Wrogowie zabici przez podpalenie wybuchają, zadając 20% swojego maksymalnego zdrowia w promieniu 6 m.", tr = "Kutsal Işık Çemberi: Pınarlar etkin oldukları sürece etrafında saat yönünde döner ve seni takip eder. Yeni pınarlar, çember kapanana kadar mevcut pınarlara eklenir. Bir pınarın her atışı 6 m içindeki iki ek düşmana sıçrar. Vurulan düşmanlar 3 sn boyunca verilen hasarın %{v}’si kadar yanar. Yanarak ölen düşmanlar patlayarak 6 m içindekilere azami canlarının %20’si kadar hasar verir.", ja = "聖なる光の環：ライトウェルは有効な間、あなたの周りを時計回りに回りながらついてきます。新しいライトウェルは、環が閉じるまで既存のものに加わります。ライトウェルの各弾は、6メートル以内の追加の敵2体に跳ね返ります。命中した敵は3秒間、与えたダメージの{v}%で燃え続けます。燃焼で倒された敵は爆発し、6メートル以内に最大体力の20%のダメージを与えます。", zh = "圣光之环：光束泉在激活期间顺时针环绕并跟随你。新的光束泉会加入已有的泉，直到圆环闭合。每口泉的每次射击会跳跃到6码内另外两个敌人身上。被击中的敌人会在3秒内灼烧，造成相当于所造成伤害{v}%的伤害。被灼烧消灭的敌人会爆炸，对6码内造成相当于其最大生命值20%的伤害。", ko = "성스러운 빛의 원: 빛샘이 활성화된 동안 당신 주위를 시계 방향으로 돌며 따라옵니다. 새 빛샘은 원이 닫힐 때까지 기존 빛샘에 더해집니다. 샘의 공격은 6미터 안의 적 2명에게 더 튕겨 갑니다. 맞은 적은 3초 동안 준 피해의 {v}%만큼 불탑니다. 불태우기로 처치된 적은 폭발하여 6미터 안에 그 적의 최대 생명력의 20%만큼 피해를 줍니다." }

# The wells' shot is Penance's missile (the source's own landing: its holy impact) at half its size, in the
# Azure Light colour: the client turns its hue by the shop colour Azure Light's own 160 degrees, and a holy
# colour the hero wears replaces that (`turn`; the wells carry the hero's colours, `holy.rs`).
[[set_bonus.look]]
visual = 910906
source = 47666
missile_scale = 0.5
turn = 160
