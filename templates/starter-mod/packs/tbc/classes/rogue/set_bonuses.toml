# Path of Darkness, the rogue's Exotic set (the balance team's document of 2026-11-15). It replaces the
# old Exotic 8-piece (a Kidney Shot a step up from the PvP set's) and gives the set a 4-piece of its own.
# The 4-piece: Cloak of Shadows becomes Darkness, which the hero triggers with a key (`AZSCMD darkness`:
# the keyboard's Taste 1, the controller's LT, the touch button) in place of casting by itself. The hero
# is immune for 1 sec and out of sight for 5: every enemy loses them as its target, bosses and guardians
# only for a quarter of that (then they are immune to the Darkness for 8 sec), and only Backstab casts
# from it. It ends when the time is out or Backstab is cast. The cooldown, 10 sec, starts at its end and
# nothing changes it. The 8-piece: the hero starts the run with Darkness, Backstab from it deals 400%
# more damage (empowered 600%: a factor of 5, 7), and a Backstab that slays an enemy in it keeps it
# alive for at least 3 sec. Every number is fixed but the 400%. A class 4-piece replaces the Exotic
# tier's shared one (+40% area, +25% speed); this text says nothing of those, so the rogue's gives
# none. The looks are 3.3.5a's: Vanish's cloud (26889), Stealth's translucent figure (1784), Shadow
# Dance's dark veil (51713) and Shadowstep's flicker (36554).

[[set_bonus]]
key = "rogue_exotic_4"
tier = "exotic"
pieces = 4
mechanic = { kind = "darkness", spell = "cloak_of_shadows", only_spell = "backstab", secs = 5.0, cooldown = 10.0, immune_secs = 1.0, boss_share = 0.25, boss_immune_secs = 8.0, smoke = 26889, stealth = 1784, veil = 51713, flicker = 36554 }
text = { en = "Path of Darkness: Cloak of Shadows becomes Darkness, which you trigger yourself. Darkness has a 10 sec cooldown instead of 40, makes you immune for 1 sec and lets you vanish into the darkness for 5 sec. In the darkness, all enemies lose you as their target. Bosses and guardians stand still for 25% of the duration and are then immune to the darkness for 8 sec. From the darkness, only Backstab can be cast. The darkness ends when its time runs out or as soon as you attack.", de = "Pfad der Finsternis: Mantel der Schatten wird zu Finsternis, die du selbst auslöst. Finsternis hat 10 statt 40 Sek. Abklingzeit, macht dich 1 Sek. lang immun und lässt dich für 5 Sek. in die Finsternis verschwinden. In der Finsternis verlieren dich alle Gegner als Ziel. Bosse und Wächter bleiben 25% der Dauer stehen und sind danach 8 Sek. immun gegen die Finsternis. Aus der Finsternis heraus kann nur Meucheln gewirkt werden. Die Finsternis endet nach Ablauf der Zeit oder sobald du angreifst.", fr = "Voie des ténèbres : Cape d'ombre devient les Ténèbres, que vous déclenchez vous-même. Les Ténèbres ont un délai de récupération de 10 s au lieu de 40, vous rendent invulnérable pendant 1 s et vous font disparaître dans l'obscurité pendant 5 s. Dans les ténèbres, tous les ennemis vous perdent comme cible. Les boss et les gardiens restent immobiles pendant 25 % de la durée, puis sont immunisés contre les Ténèbres pendant 8 s. Depuis les ténèbres, seule Attaque dans le dos peut être lancée. Les ténèbres prennent fin quand leur durée s'écoule ou dès que vous attaquez.", es = "Sendero de la oscuridad: Capa de las Sombras se convierte en Oscuridad, que activas tú mismo. Oscuridad tiene una reutilización de 10 s en lugar de 40, te hace inmune durante 1 s y te deja desaparecer en la oscuridad durante 5 s. En la oscuridad, todos los enemigos te pierden como objetivo. Los jefes y los guardianes se quedan quietos durante el 25 % de la duración y después son inmunes a la oscuridad durante 8 s. Desde la oscuridad solo se puede lanzar Puñalada trapera. La oscuridad termina cuando se acaba el tiempo o en cuanto atacas.", pt = "Caminho da Escuridão: Manto das Sombras se torna Escuridão, que você ativa por conta própria. A Escuridão tem recarga de 10 s em vez de 40, deixa você imune por 1 s e faz você desaparecer na escuridão por 5 s. Na escuridão, todos os inimigos perdem você como alvo. Chefes e guardiões ficam parados por 25% da duração e depois ficam imunes à escuridão por 8 s. Da escuridão, só é possível lançar Punhalada. A escuridão termina quando o tempo acaba ou assim que você ataca.", ru = "Путь тьмы: «Плащ теней» становится «Тьмой», которую вы запускаете сами. У «Тьмы» время восстановления 10 сек. вместо 40; она делает вас неуязвимым на 1 сек. и скрывает вас во тьме на 5 сек. Во тьме все враги теряют вас как цель. Боссы и стражи стоят на месте 25% времени, а затем 8 сек. невосприимчивы к тьме. Из тьмы можно применять только «Удар в спину». Тьма заканчивается, когда истекает время или как только вы атакуете.", it = "Sentiero dell'oscurità: Manto d'ombra diventa Oscurità, che attivi tu stesso. Oscurità ha un tempo di recupero di 10 s anziché 40, ti rende immune per 1 s e ti fa svanire nell'oscurità per 5 s. Nell'oscurità tutti i nemici ti perdono come bersaglio. I boss e i guardiani restano fermi per il 25% della durata e poi sono immuni all'oscurità per 8 s. Dall'oscurità si può lanciare solo Pugnalata alle spalle. L'oscurità termina allo scadere del tempo o appena attacchi.", pl = "Ścieżka Ciemności: Płaszcz cieni staje się Ciemnością, którą uruchamiasz sam. Ciemność ma czas odnowienia 10 sek. zamiast 40, czyni cię odpornym na 1 sek. i pozwala ci zniknąć w ciemności na 5 sek. W ciemności wszyscy wrogowie tracą cię z celu. Bossowie i strażnicy stoją w miejscu przez 25% czasu trwania, a potem są odporni na ciemność przez 8 sek. Z ciemności można rzucić tylko Cios w plecy. Ciemność kończy się, gdy upłynie jej czas, albo gdy tylko zaatakujesz.", tr = "Karanlığın Yolu: Gölge Pelerini, kendinin başlattığın Karanlık'a dönüşür. Karanlık'ın bekleme süresi 40 yerine 10 sn'dir, seni 1 sn bağışık kılar ve 5 sn boyunca karanlığa karışıp kaybolmanı sağlar. Karanlıkta tüm düşmanlar seni hedef olarak kaybeder. Boss'lar ve muhafızlar sürenin %25'i boyunca olduğu yerde durur, ardından 8 sn boyunca karanlığa karşı bağışık olur. Karanlıktan yalnızca Sırtından Bıçak kullanılabilir. Karanlık, süresi dolunca ya da saldırdığın anda sona erer.", ja = "闇の道：クローク・オブ・シャドウが、自分で発動する「暗闇」になります。暗闇のクールダウンは40秒ではなく10秒で、1秒間無敵になり、5秒間暗闇に姿を消します。暗闇の中では、すべての敵があなたをターゲットできなくなります。ボスとガーディアンは持続時間の25%の間その場で動きを止め、その後8秒間は暗闇の影響を受けません。暗闇の中からはバックスタブしか使えません。暗闇は時間切れになるか、攻撃した瞬間に終わります。", zh = "黑暗之路：暗影斗篷变为黑暗，由你亲自触发。黑暗的冷却时间为10秒（原为40秒），使你免疫伤害1秒，并让你隐入黑暗5秒。身处黑暗时，所有敌人都会失去你这个目标。首领和守卫会在持续时间的25%内原地不动，之后8秒内免疫黑暗。在黑暗中只能施放背刺。黑暗会在时间耗尽或你发动攻击时结束。", ko = "어둠의 길: 그림자 망토가 직접 발동하는 어둠으로 바뀝니다. 어둠의 재사용 대기시간은 40초 대신 10초이며, 1초 동안 무적이 되고 5초 동안 어둠 속으로 사라집니다. 어둠 속에서는 모든 적이 당신을 대상으로 삼지 못합니다. 우두머리와 수호자는 지속시간의 25% 동안 제자리에 멈추고 그 후 8초 동안 어둠에 면역이 됩니다. 어둠 속에서는 기습만 시전할 수 있습니다. 어둠은 시간이 다 되거나 공격하는 즉시 끝납니다." }

# While the 4-piece is awake the cloak is called Darkness on the level-up cards and the bar, and the card
# and the bar's tooltip read the text above.
[[set_bonus.rename]]
spell = "cloak_of_shadows"
name = { en = "Darkness", de = "Finsternis", fr = "Ténèbres", es = "Oscuridad", pt = "Escuridão", ru = "Тьма", it = "Oscurità", pl = "Ciemność", tr = "Karanlık", ja = "暗闇", zh = "黑暗", ko = "어둠" }

[[set_bonus]]
key = "rogue_exotic_8"
tier = "exotic"
pieces = 8
# `damage` is the share `{v}` shows (4.0 = +400%, a factor of 5; empowered 6.0 = 600%, a factor of 7).
mechanic = { kind = "darkness_ambush", spell = "backstab", damage = 4.0, kill_secs = 3.0, empowers = true }
text = { en = "Path of Darkness: You also start with Darkness. Backstab from the darkness deals {v}% more damage. When Backstab kills an enemy in the darkness, it starts over for 3 sec.", de = "Pfad der Finsternis: Du erhältst zusätzlich von Beginn an Finsternis. Meucheln aus der Finsternis verursacht {v}% mehr Schaden. Tötet Meucheln in der Finsternis einen Gegner, beginnt sie von vorn für 3 Sek.", fr = "Voie des ténèbres : Vous commencez également avec les Ténèbres. Attaque dans le dos lancée depuis les ténèbres inflige {v} % de dégâts en plus. Quand Attaque dans le dos tue un ennemi dans les ténèbres, elles recommencent pour 3 s.", es = "Sendero de la oscuridad: También empiezas con Oscuridad. Puñalada trapera desde la oscuridad inflige un {v} % más de daño. Cuando Puñalada trapera mata a un enemigo en la oscuridad, esta vuelve a empezar durante 3 s.", pt = "Caminho da Escuridão: Você também começa com Escuridão. Punhalada lançada da escuridão causa {v}% a mais de dano. Quando Punhalada mata um inimigo na escuridão, ela recomeça por 3 s.", ru = "Путь тьмы: Вы также начинаете забег со «Тьмой». «Удар в спину» из тьмы наносит на {v}% больше урона. Если «Удар в спину» убивает врага во тьме, она начинается заново на 3 сек.", it = "Sentiero dell'oscurità: Inizi anche con Oscurità. Pugnalata alle spalle dall'oscurità infligge il {v}% di danni in più. Quando Pugnalata alle spalle uccide un nemico nell'oscurità, questa ricomincia per 3 s.", pl = "Ścieżka Ciemności: Zaczynasz również z Ciemnością. Cios w plecy zadany z ciemności zadaje o {v}% więcej obrażeń. Gdy Cios w plecy zabije wroga w ciemności, ta zaczyna się od nowa na 3 sek.", tr = "Karanlığın Yolu: Ayrıca Karanlık ile başlarsın. Karanlıktan yapılan Sırtından Bıçak %{v} daha fazla hasar verir. Sırtından Bıçak karanlıkta bir düşmanı öldürdüğünde karanlık 3 sn için yeniden başlar.", ja = "闇の道：さらに、暗闇を持って始めます。暗闇からのバックスタブが与えるダメージが{v}%増加します。暗闇の中でバックスタブが敵を倒すと、暗闇は3秒間でやり直しになります。", zh = "黑暗之路：你还会在对局开始时拥有黑暗。从黑暗中施放的背刺造成的伤害提高{v}%。在黑暗中，背刺击杀敌人时，黑暗会重新开始，持续3秒。", ko = "어둠의 길: 어둠도 함께 가지고 시작합니다. 어둠 속에서 시전한 기습의 피해가 {v}% 증가합니다. 어둠 속에서 기습이 적을 처치하면 어둠이 3초 동안 다시 시작됩니다." }

# The run starts with Darkness as well as the class's first spell (a card with no boosts, like the starter).
[[set_bonus.part]]
effects = [{ start_with = "cloak_of_shadows" }]
fixed = true
