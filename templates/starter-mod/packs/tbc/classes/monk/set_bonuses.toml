text = { en = "Backswing: Leg Sweep leaves a Chi Orb that rolls back to you after 2 seconds. It deals 120% of Leg Sweep damage once to each enemy it passes. Up to 20 orbs can be active at a time.", de = "Rückschwung: Fußfeger hinterlässt eine Chi-Kugel, die nach 2 Sekunden zu dir zurückrollt. Sie fügt jedem Gegner auf dem Rückweg einmal 120 % Fußfeger-Schaden zu. Bis zu 20 Kugeln können gleichzeitig aktiv sein.", fr = "Retour de chi : Balayage de jambe laisse un orbe de chi qui revient vers vous après 2 s et inflige une fois 120 % des dégâts du balayage à chaque ennemi sur son trajet. Maximum 20 orbes actifs.", es = "Barrido de vuelta: Barrido de pierna deja un orbe de chi que regresa tras 2 s e inflige una vez el 120 % del daño del barrido a cada enemigo que atraviesa. Hasta 20 orbes activos.", pt = "Retorno do Chi: Rasteira deixa um orbe de chi que volta após 2 s, causando uma vez 120% do dano da Rasteira a cada inimigo no caminho. Até 20 orbes ativos.", ru = "Обратный взмах: Круговой удар ногой оставляет сферу ци, которая возвращается через 2 с и наносит каждому врагу на пути 120% урона удара один раз. До 20 сфер одновременно.", it = "Powrotny zamach: Podcięcie nogą zostawia kulę chi, która wraca po 2 s i raz zadaje każdemu wrogowi po drodze 120% obrażeń podcięcia. Maksymalnie 20 aktywnych kul.", pl = "Geri Savuruş: Ayak Süpürme 2 sn sonra sana dönen bir Chi Küresi bırakır. Küre, geçtiği her düşmana bir kez Ayak Süpürme hasarının %120'sini verir. En fazla 20 küre etkin olabilir.", tr = "Ritorno del Chi: Spazzata di gambe lascia una sfera di chi che torna dopo 2 s e infligge una volta il 120% dei danni della spazzata a ciascun nemico sul percorso. Fino a 20 sfere attive.", ja = "バックスウィング：レッグ・スウィープがチー・オーブを残し、2秒後にあなたのもとへ転がり戻ります。通過した敵それぞれに1回ずつレッグ・スウィープの120%のダメージを与えます。同時に最大20個まで存在できます。", zh = "回旋：扫堂腿会留下一个真气球，2秒后滚回你身边。它对经过的每个敌人造成一次相当于扫堂腿120%的伤害。最多同时存在20个真气球。", ko = "되돌아치기: 팽이차기가 기의 구슬을 남기며, 구슬은 2초 후 당신에게 굴러 돌아옵니다. 지나가는 적마다 한 번씩 팽이차기 피해의 120%를 줍니다. 구슬은 동시에 최대 20개까지 존재할 수 있습니다." }

