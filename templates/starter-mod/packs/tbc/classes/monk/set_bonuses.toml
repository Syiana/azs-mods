pieces = 8
text = { en = "Keg Smash leaps to a second enemy for {v}% of its damage.", de = "Fasshieb springt auf einen zweiten Feind über, für {v}% seines Schadens.", fr = "Bris de tonneau bondit sur un second ennemi pour {v}% de ses dégâts.", es = "Machacar barril salta a un segundo enemigo con un {v}% de su daño.", pt = "Barrilada salta para um segundo inimigo com {v}% do seu dano.", ru = "«Удар бочонком» перескакивает на второго врага с {v}% урона.", pl = "Rozbicie beczki przeskakuje na drugiego wroga, zadając {v}% swoich obrażeń.", tr = "Fıçı Parçalama, hasarının %{v}'i ile ikinci bir düşmana sıçrar.", it = "Colpo di barile balza su un secondo nemico per il {v}% dei suoi danni.", ja = "ケグ・スマッシュが2体目の敵に飛び移り、そのダメージの{v}%を与えます。", zh = "醉酿投会跳跃到第二个敌人身上，造成相当于其伤害{v}%的伤害。", ko = "맥주통 휘두르기가 두 번째 적에게 튀어 피해의 {v}%를 줍니다." }

