# Ours (TUNE): plan section 5, the PvP bonus: a nova widens in place of striking more (+50% wider, +200% damage, 40% sooner, +100% against held enemies).
[[set_bonus]]
key = "monk_pvp_8"
tier = "pvp"
pieces = 8
text = { en = "Leg Sweep is {v}% wider, deals 200% more damage and comes back 40% sooner, and you deal {v2}% more damage to enemies you stun, root, slow or fear.", de = "Fußfeger ist {v}% weiter, verursacht 200% mehr Schaden und ist 40% früher wieder bereit, und du verursachst {v2}% mehr Schaden an Feinden, die du betäubst, festwurzelst, verlangsamst oder fürchten lässt.", fr = "Balayage de jambe est {v}% plus large, inflige 200% de dégâts en plus et revient 40% plus tôt, et vous infligez {v2}% de dégâts en plus aux ennemis que vous étourdissez, immobilisez, ralentissez ou terrifiez.", es = "Barrido de pierna es un {v}% más amplio, inflige un 200% más de daño y vuelve un 40% antes, y infliges un {v2}% más de daño a los enemigos que aturdes, enraízas, ralentizas o asustas.", pt = "Rasteira é {v}% mais ampla, causa 200% mais dano e volta 40% mais cedo, e você causa {v2}% mais dano a inimigos que atordoa, enraíza, retarda ou amedronta.", ru = "Круговой удар ногой шире на {v}%, наносит на 200% больше урона и восстанавливается на 40% быстрее, а вы наносите на {v2}% больше урона противникам, которых оглушаете, обездвиживаете, замедляете или пугаете.", pl = "Podcięcie nogą jest o {v}% szersze, zadaje o 200% więcej obrażeń i wraca o 40% szybciej, a zadajesz o {v2}% więcej obrażeń wrogom, których ogłuszasz, unieruchamiasz, spowalniasz lub przerażasz.", tr = "Bacak Süpürme %{v} daha geniştir, %200 daha fazla hasar verir ve %40 daha erken hazır olur, ve sersemlettiğin, köklediğin, yavaşlattığın veya korkuttuğun düşmanlara %{v2} daha fazla hasar verirsin.", it = "Spazzata di gambe è più ampia del {v}%, infligge il 200% di danni in più e ritorna il 40% prima, e infliggi il {v2}% di danni in più ai nemici che stordisci, immobilizzi, rallenti o terrorizzi.", ja = "レッグ・スウィープの範囲が{v}%広がり、ダメージが200%増加し、40%早く再使用できるようになります。さらに、スタン・移動不能・スロー・恐怖状態の敵に与えるダメージが{v2}%増加します。", zh = "扫堂腿的范围扩大{v}%，造成的伤害提高200%，冷却速度加快40%，并且你对被昏迷、定身、减速或恐惧的敌人造成的伤害提高{v2}%。", ko = "팽이차기의 범위가 {v}% 넓어지고, 피해가 200% 증가하며, 40% 더 빨리 돌아옵니다. 또한 기절, 속박, 감속, 공포 상태인 적에게 주는 피해가 {v2}% 증가합니다." }

