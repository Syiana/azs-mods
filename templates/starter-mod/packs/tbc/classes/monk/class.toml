# The monk, Mists of Pandaria's class, after a friend's 3.3.5a backport (the Shadowsong client,
# data/dl/SOURCES/shadowsong): fists and feet, chi and brews, three stances. AS has no monk, so
# every number here is ours. `TUNE`
#
# Chi: the generators (Jab, Spinning Crane Kick, Expel Harm, Keg Smash) gather it, the spenders
# (Tiger Palm, Blackout Kick, Rising Sun Kick, Fists of Fury, Touch of Death, Breath of Fire) spend
# it when it is there to hit harder; nothing waits for it. Brews come back on their own and
# strengthen each stance's own brew (Fortifying, Tigereye, Mana Tea), which a hand deals only once
# its stance talent is taken (`needs`).
key = "monk"
# The `ChrClasses` id, as the Shadowsong client numbers the monk (patch-{ adds the row).
id = 12
# Which piece profile (`gear/pieces.toml`) sits in each armor slot, head to hands: the original's
# (class id * 3 + slot) mod 8. A class wears each of the eight once.
piece_profiles = [6, 7, 0, 1, 2, 3, 4, 5]
# Health at level 1: the warrior's. `TUNE`
health = 230
# Balance (2026-11-10): the monk read as weak in every stance (the strikes reach one enemy a blow, 6 yd,
# on 200 health and no class bonus). Tougher and a little stronger, as the warrior is. 6 % less taken is
# 6 % more effective health.
damage_pct = 4
taken_pct = -6
power = "energy"
starter = "jab"
# As Mists of Pandaria's character creation allows them: no worgen, no goblins.
races = [1, 3, 4, 7, 11, 2, 5, 8, 6, 10, 15, 17]
# A staff, as the monk's first weapon (`content.rs` holds its `Item.dbc` row).
starter_weapons = [
    35, # Bent Staff
]
# The legendary dash card: Roll's icon, and what it does.
dash_spell = 900051
dash_legend = { en = "Your Roll ends in a Flying Serpent Kick: every enemy where you land is struck and slowed.", de = "Deine Rolle endet in einem Tritt der fliegenden Schlange: Jeder Gegner am Landepunkt wird getroffen und verlangsamt.", fr = "Ta roulade se termine par un Coup de pied du serpent volant : chaque ennemi là où tu atterris est frappé et ralenti.", es = "Tu voltereta termina en una Patada de serpiente voladora: cada enemigo donde aterrizas recibe un golpe y se ralentiza.", pt = "Sua Rolagem termina em um Chute da Serpente Voadora: todo inimigo onde você pousa é atingido e fica lento.", ru = "Твой кувырок заканчивается Ударом летящего змея: каждый враг в месте приземления получает урон и замедляется.", pl = "Twój Przewrót kończy się Latającym kopnięciem węża: każdy przeciwnik w miejscu lądowania zostaje trafiony i spowolniony.", tr = "Yuvarlanman Uçan Yılan Tekmesi ile biter: indiğin yerdeki her düşman vurulur ve yavaşlar.", it = "La tua Rotolata termina in un Calcio del serpente volante: ogni nemico dove atterri viene colpito e rallentato.", ja = "ロールの最後がフライング・サーペント・キックになります：着地点のすべての敵に命中し、スローにします。", zh = "你的滚地翻以一记翔龙在天收尾：落点处的每个敌人都会受到打击并被减速。", ko = "구르기가 비룡차기로 끝납니다: 착지 지점의 모든 적이 공격받고 감속됩니다." }
bot_name = "Botmonk"
bot_order = 10
name = { en = "Monk", de = "Mönch", fr = "Moine", es = "Monje", pt = "Monge", ru = "Монах", pl = "Mnich", tr = "Keşiş", it = "Monaco", ja = "モンク", zh = "武僧", ko = "수도사" }
# Mists of Pandaria's RAID_CLASS_COLORS.MONK (jade green).
color = [0.0, 1.0, 0.59]
# Played once a hero of the account has beaten Classic's last zone; a mode's `[unlocks]` may say
# otherwise.
unlock = "classic"
# Fists and staff: a swing every 2.2 sec, as the warrior's. `TUNE`
swing = { beat = 2.2 }

