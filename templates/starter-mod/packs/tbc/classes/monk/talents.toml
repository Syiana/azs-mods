effects = [{ stat = [2, 0.05] }]
icon = "monk_stance_drunkenox"
name = { en = "Stance of the Sturdy Ox", de = "Haltung des sturen Ochsen", fr = "Posture du buffle robuste", es = "Postura del buey robusto", pt = "Postura do Boi Robusto", ru = "Стойка стойкого быка", pl = "Postawa Mocnego Wołu", tr = "Sağlam Öküz Duruşu", it = "Posizione del Bue robusto", ja = "スタンス・オブ・ザ・スターディ・オックス", zh = "蛮牛之姿", ko = "굳건한 황소의 태세" }
text = { en = "Milestone. Stance of the Sturdy Ox: {v}% less damage taken while an enemy is within 7 yd, 5% more health, and your level-up hands may deal Keg Smash, Exploding Keg, Breath of Fire, Charging Ox Wave and Fortifying Brew. One stance at a time: the first one taken rules out the other two.", de = "Meilenstein. Haltung des sturen Ochsen: {v}% weniger erlittener Schaden, solange ein Gegner im Umkreis von 7 m ist, 5% mehr Gesundheit, und deine Stufenaufstiege können Fasshieb, Explodierendes Fass, Feueratem, Ansturm des Ochsen und Anregendes Gebräu bieten. Nur eine Haltung: Die zuerst gewählte schließt die anderen beiden aus.", fr = "Jalon. Posture du bœuf robuste : {v}% de dégâts subis en moins tant qu'un ennemi est à moins de 7 m, 5% de santé en plus, et vos mains de montée de niveau peuvent donner Baril fracassé, Baril explosif, Souffle de feu, Vague du bœuf chargeant et Brassin fortifiant. Une seule posture à la fois : la première choisie exclut les deux autres.", es = "Hito. Postura del buey robusto: un {v}% menos de daño recibido mientras haya un enemigo a menos de 7 m, un 5% más de salud, y tus manos de subida de nivel pueden ofrecer Golpe de barril, Barril explosivo, Aliento de fuego, Ola de buey cargante y Brebaje fortificante. Una sola postura a la vez: la primera elegida excluye las otras dos.", pt = "Marco. Postura do Boi Robusto: {v}% a menos de dano sofrido enquanto houver um inimigo a menos de 7 m, 5% a mais de vida, e suas mãos de subida de nível podem oferecer Golpe de Barril, Barril Explosivo, Sopro de Fogo, Onda do Boi Carregador e Infusão Fortificante. Uma postura por vez: a primeira escolhida exclui as outras duas.", ru = "Веха. Стойка крепкого быка: получаемый урон снижен на {v}%, пока враг находится в пределах 7 м, здоровье больше на 5%, а при повышении уровня вам могут выпасть Удар бочонком, Взрывной бочонок, Огненное дыхание, Волна бычьего натиска и Укрепляющий настой. Только одна стойка: выбранная первой исключает две другие.", pl = "Kamień milowy. Postawa Mocnego Wołu: {v}% mniej otrzymywanych obrażeń, gdy przeciwnik jest w promieniu 7 m, 5% więcej zdrowia, a twoje karty awansu mogą dać Rozbicie beczki, Wybuchową beczkę, Ognisty oddech, Falę szarżującego wołu i Wzmacniający napar. Jedna postawa naraz: pierwsza wybrana wyklucza dwie pozostałe.", tr = "Dönüm noktası. Sağlam Öküz Duruşu: 7 m içinde düşman varken {v}% daha az hasar alırsın, 5% daha fazla can ve seviye atlama ellerinde Fıçı Parçalama, Patlayan Fıçı, Ateş Nefesi, Hücum Eden Öküz Dalgası ve Güçlendirici Demleme çıkabilir. Aynı anda tek duruş: ilk alınan diğer ikisini dışlar.", it = "Traguardo. Posizione del Bue robusto: {v}% di danni subiti in meno mentre un nemico è entro 7 m, 5% di salute in più e le carte che ricevi a ogni livello possono offrire Colpo di barile, Barile esplosivo, Soffio di fuoco, Onda del bue in carica e Infuso fortificante. Una sola posizione alla volta: la prima scelta esclude le altre due.", ja = "【マイルストーン】スタンス・オブ・ザ・スターディ・オックス：7ヤード以内に敵がいる間、被ダメージが{v}%減少し、体力が5%増加し、レベルアップの手札にケグ・スマッシュ、エクスプローディング・ケグ、ブレス・オブ・ファイア、チャージング・オックス・ウェーブ、フォーティファイング・ブリューが出るようになります。スタンスは1つだけ：最初に取ったものが他の2つを封じます。", zh = "里程碑：蛮牛之姿：7码内有敌人时，受到的伤害降低{v}%，生命值提高5%，升级时提供的卡牌中可能出现醉酿投、爆炸酒桶、火焰之息、蛮牛冲和壮胆酒。一次只能选择一种姿态：第一个选择的姿态会排除另外两个。", ko = "이정표. 굳건한 황소의 태세: 7미터 안에 적이 있는 동안 받는 피해가 {v}% 감소하고 생명력이 5% 증가하며, 레벨 업 카드에 맥주통 휘두르기, 폭발하는 맥주통, 불의 숨결, 돌진하는 황소의 물결, 강화주가 나올 수 있습니다. 태세는 하나만: 먼저 고른 태세가 다른 둘을 막습니다." }
