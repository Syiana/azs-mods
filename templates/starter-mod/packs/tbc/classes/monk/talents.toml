icon = "monk_stance_whitetiger"
name = { en = "Stance of the Fierce Tiger", de = "Haltung des wilden Tigers", fr = "Posture du tigre féroce", es = "Postura del tigre feroz", pt = "Postura do Tigre Feroz", ru = "Стойка свирепого тигра", pl = "Postawa Dzikiego Tygrysa", tr = "Yırtıcı Kaplan Duruşu", it = "Posizione della Tigre feroce", ja = "スタンス・オブ・ザ・フィアース・タイガー", zh = "猛虎之姿", ko = "사나운 범의 태세" }
text = { en = "Milestone. Stance of the Fierce Tiger: your physical spells deal {v}% more damage, and your level-up hands may deal Tigereye Brew, Whirling Dragon Punch and Invoke Xuen. One stance at a time: the first one taken rules out the other two.", de = "Meilenstein. Haltung des wilden Tigers: Deine körperlichen Zauber verursachen {v}% mehr Schaden, und deine Stufenaufstiege können Tigeraugengebräu, Wirbelnden Drachenschlag und Xuen anrufen bieten. Nur eine Haltung: Die zuerst gewählte schließt die anderen beiden aus.", fr = "Jalon. Posture du tigre féroce : vos sorts physiques infligent {v}% de dégâts en plus, et vos mains de montée de niveau peuvent donner Brassin d'œil de tigre, Coup de poing du dragon tourbillonnant et Invocation de Xuen. Une seule posture à la fois : la première choisie exclut les deux autres.", es = "Hito. Postura del tigre feroz: tus hechizos físicos infligen un {v}% más de daño, y tus manos de subida de nivel pueden ofrecer Brebaje de ojo de tigre, Puñetazo del dragón giratorio e Invocar a Xuen. Una sola postura a la vez: la primera elegida excluye las otras dos.", pt = "Marco. Postura do Tigre Feroz: seus feitiços físicos causam {v}% a mais de dano, e suas mãos de subida de nível podem oferecer Infusão do Olho de Tigre, Soco do Dragão Giratório e Invocar Xuen. Uma postura por vez: a primeira escolhida exclui as outras duas.", ru = "Веха. Стойка свирепого тигра: ваши физические заклинания наносят на {v}% больше урона, а при повышении уровня вам могут выпасть Настой тигриного глаза, Удар вращающегося дракона и Призыв Сюэня. Только одна стойка: выбранная первой исключает две другие.", pl = "Kamień milowy. Postawa Dzikiego Tygrysa: twoje czary fizyczne zadają o {v}% więcej obrażeń, a twoje karty awansu mogą dać Napar tygrysiego oka, Wirujące uderzenie smoka i Przywołanie Xuena. Jedna postawa naraz: pierwsza wybrana wyklucza dwie pozostałe.", tr = "Dönüm noktası. Yırtıcı Kaplan Duruşu: fiziksel büyülerin {v}% daha fazla hasar verir ve seviye atlama ellerinde Kaplangözü Demlemesi, Dönen Ejderha Yumruğu ve Xuen'i Çağır çıkabilir. Aynı anda tek duruş: ilk alınan diğer ikisini dışlar.", it = "Traguardo. Posizione della Tigre feroce: i tuoi incantesimi fisici infliggono il {v}% di danni in più e le carte che ricevi a ogni livello possono offrire Infuso occhio di tigre, Pugno del drago vorticante e Invocare Xuen. Una sola posizione alla volta: la prima scelta esclude le altre due.", ja = "【マイルストーン】スタンス・オブ・ザ・フィアース・タイガー：物理呪文のダメージが{v}%増加し、レベルアップの手札にタイガーアイ・ブリュー、ワーリング・ドラゴン・パンチ、インヴォーク・シュエンが出るようになります。スタンスは1つだけ：最初に取ったものが他の2つを封じます。", zh = "里程碑：猛虎之姿：你的物理法术造成的伤害提高{v}%，升级时提供的卡牌中可能出现虎眼酒、升龙霸和召唤白虎雪怒。一次只能选择一种姿态：第一个选择的姿态会排除另外两个。", ko = "이정표. 사나운 범의 태세: 물리 주문의 피해가 {v}% 증가하며, 레벨 업 카드에 범눈 양조주, 용축회오리격, 쉬엔 소환이 나올 수 있습니다. 태세는 하나만: 먼저 고른 태세가 다른 둘을 막습니다." }
menu_v = 0.08
mods = [{ school = 1 }]
mods_v = 0.08

