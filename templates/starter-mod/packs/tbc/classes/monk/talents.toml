text = { en = "Milestone. Stance of the Wise Serpent: your heals and shields are {v}% stronger, and your level-up hands may deal Renewing Mist, Mana Tea and Song of Chi-Ji. One stance at a time: the first one taken rules out the other two.", de = "Meilenstein. Haltung der weisen Schlange: Deine Heilungen und Schilde sind {v}% stärker, und deine Stufenaufstiege können Erneuernden Nebel, Manatee und das Lied von Chi-Ji bieten. Nur eine Haltung: Die zuerst gewählte schließt die anderen beiden aus.", fr = "Jalon. Posture du serpent sage : vos soins et boucliers sont {v}% plus puissants, et vos mains de montée de niveau peuvent donner Brume de rénovation, Thé de mana et Chant de Chi-Ji. Une seule posture à la fois : la première choisie exclut les deux autres.", es = "Hito. Postura de la serpiente sabia: tus curaciones y escudos son un {v}% más potentes, y tus manos de subida de nivel pueden ofrecer Niebla renovadora, Té de maná y Canción de Chi-Ji. Una sola postura a la vez: la primera elegida excluye las otras dos.", pt = "Marco. Postura da Serpente Sábia: suas curas e escudos são {v}% mais fortes, e suas mãos de subida de nível podem oferecer Névoa Renovadora, Chá de Mana e Canção de Chi-Ji. Uma postura por vez: a primeira escolhida exclui as outras duas.", ru = "Веха. Стойка мудрой змеи: ваше исцеление и щиты на {v}% сильнее, а при повышении уровня вам могут выпасть Заживляющий туман, Чай маны и Песнь Чи-Цзи. Только одна стойка: выбранная первой исключает две другие.", pl = "Kamień milowy. Postawa Mądrego Węża: twoje leczenie i tarcze są silniejsze o {v}%, a twoje karty awansu mogą dać Odnawiającą mgłę, Herbatę many i Pieśń Chi-Ji. Jedna postawa naraz: pierwsza wybrana wyklucza dwie pozostałe.", tr = "Dönüm noktası. Bilge Yılan Duruşu: iyileştirmelerin ve kalkanların {v}% daha güçlüdür ve seviye atlama ellerinde Yenileyici Sis, Mana Çayı ve Chi-Ji'nin Şarkısı çıkabilir. Aynı anda tek duruş: ilk alınan diğer ikisini dışlar.", it = "Traguardo. Posizione del Serpente saggio: le tue cure e i tuoi scudi sono più forti del {v}% e le carte che ricevi a ogni livello possono offrire Nebbia rinnovante, Tè del mana e Canto di Chi-Ji. Una sola posizione alla volta: la prima scelta esclude le altre due.", ja = "【マイルストーン】スタンス・オブ・ザ・ワイズ・サーペント：回復とシールドの効果が{v}%高まり、レベルアップの手札にリニューイング・ミスト、マナ・ティー、ソング・オブ・チー・ジーが出るようになります。スタンスは1つだけ：最初に取ったものが他の2つを封じます。", zh = "里程碑：灵蛇之姿：你的治疗和护盾效果提高{v}%，升级时提供的卡牌中可能出现复苏之雾、法力茶和赤精之歌。一次只能选择一种姿态：第一个选择的姿态会排除另外两个。", ko = "이정표. 지혜로운 뱀의 태세: 치유와 보호막의 효과가 {v}% 증가하며, 레벨 업 카드에 소생의 안개, 마나 차, 츠지의 노래가 나올 수 있습니다. 태세는 하나만: 먼저 고른 태세가 다른 둘을 막습니다." }
menu_v = 0.15
mods = ["heals"]
mods_v = 0.15

