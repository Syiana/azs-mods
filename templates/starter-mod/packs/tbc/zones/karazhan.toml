map = 0
map_name = "Azeroth"
area = 3457
center = [-10683.3, -1183.3]
radius = 100.0
# Duskwood's sheet (WorldMapArea 32): the centre stands over Darkshire's ground chunk, so that is the
# map the client reads the hero's position against, not Deadwind Pass's.
map_bounds = [833.3333, -1866.6666, -9716.666, -11516.666]
# 90 % of AS's climb (2026-11-09: Burning Crusade was too hard on Normal).
health_factor = 9.64
gold_factor = 2.98
late_factor = 0.4
hour = 12
# Noon, not night: at night the night dimming (Night Darkness) made the run almost black. The edge
# stays the night's, as it was (`dark_sky`).
dark_sky = true
weather = { fine = 75, rain = 25 }

