#
# The place off the zone map, `map_bounds` off `WorldMapArea.dbc`, the health factor carrying
# AS's climb on by 8% a zone; the creatures are 3.3.5a's own of the place (`CreatureDisplayInfo.dbc`
# ids), on the stats of Naxxramas's roles (the zone's health factor makes them stronger).
#
# Entries, names, creature types and display ids are AS's own where AS has the zone; health,
# damage, speeds, spawn costs, minutes and the place are first guesses until read from the game.
# `TUNE`

[[zone]]
key = "karazhan"
order = 18
name = { en = "Karazhan", de = "Karazhan", fr = "Karazhan", es = "Karazhan", pt = "Karazhan", ru = "Каражан", pl = "Karazhan", tr = "Karazhan", it = "Karazhan", ja = "カラザン", zh = "卡拉赞", ko = "카라잔" }
