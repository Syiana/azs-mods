# Hills no hero walks up (the navmesh climbs 70 degrees, a hero 50) hold no rift crystal, portal,
# chest or boss: places a hero is asked to reach lie on ground a 45 degree walker gets to. The
# mesh smooths rough ground, so the margin under the client's 50 keeps the highest ridge, whose
# way up leans 45 to 50, out of it; the ground within 100 yd of the centre that places may stand
# on shrinks by about 8 % (the hillsides themselves; measured on the baked mesh, 2026-11-15).
climb = 45.0

