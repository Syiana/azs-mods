# The druid's 8-piece set bonuses: one change to one of its spells per tier (docs/HOWTO-CONTENT.md "A set bonus").

[[set_bonus]]
key = "druid_mythic_8"
tier = "mythic"
pieces = 8
mechanic = { kind = "death_sprout", spell = "shred", pet = "treant", radius = 2.0, mature = 3.0, secs = 10.0, duration = 8.0, damage = 0.4 }
marker = { entry = 990103, display = 864, scale = 0.2 }
text = { en = "Circle of Life: Rooted enemies leave sprouts when they die. Sprouts mature after 3 seconds and last 10 seconds. Touch a mature sprout to summon a Treant for 8 seconds, up to one at a time. It deals 40% of Shred damage per attack.", de = "Kreis des Lebens: Festgewurzelte Gegner hinterlassen beim Tod Schösslinge. Sie reifen nach 3 Sekunden und halten 10 Sekunden. Berühre einen reifen Schössling, um einen Treant für 8 Sekunden zu rufen. Es kann nur einer aktiv sein. Er verursacht 40 % Schreddern-Schaden pro Angriff.", fr = "Cercle de la vie : les ennemis immobilisés laissent des pousses à leur mort. Elles mûrissent en 3 s et durent 10 s. Toucher une pousse mûre invoque un tréant pour 8 s, un seul à la fois, qui inflige 40 % des dégâts de Lambeau par attaque.", es = "Círculo de la vida: Los enemigos enraizados dejan brotes al morir. Maduran en 3 s y duran 10 s. Toca un brote maduro para invocar un antárbol durante 8 s, uno a la vez, que inflige el 40 % del daño de Triturar por ataque.", pt = "Círculo da Vida: Inimigos enraizados deixam brotos ao morrer. Eles amadurecem em 3 s e duram 10 s. Toque um broto maduro para invocar um arvoroso por 8 s, um de cada vez, que causa 40% do dano de Estraçalhar por ataque.", ru = "Круг жизни: обездвиженные корнями враги оставляют ростки. Они созревают за 3 с и живут 10 с. Коснитесь зрелого ростка, чтобы призвать одного древня на 8 с. За атаку он наносит 40% урона Полоснуть.", it = "Krąg życia: Unieruchomieni korzeniami wrogowie zostawiają pędy. Dojrzewają po 3 s i trwają 10 s. Dotknij dojrzałego pędu, aby wezwać drzewca na 8 s, najwyżej jednego naraz. Zadaje 40% obrażeń Rozszarpania na atak.", pl = "Yaşam Döngüsü: Köklenmiş düşmanlar ölünce filiz bırakır. Filizler 3 sn'de olgunlaşır ve 10 sn kalır. Olgun filize dokunmak 8 sn boyunca en fazla bir ağaç adam çağırır. Saldırı başına Parçala hasarının %40'ını verir.", tr = "Cerchio della Vita: I nemici immobilizzati dalle radici lasciano germogli. Maturano dopo 3 s e durano 10 s. Tocca un germoglio maturo per evocare un treant per 8 s, uno alla volta. Infligge il 40% dei danni di Lacerazione per attacco.", ja = "生命の環：移動不能の敵が死ぬと若芽を残します。若芽は3秒後に育ち、10秒間残ります。育った若芽に触れるとトレントを8秒間召喚します（同時に1体まで）。トレントは攻撃ごとにシュレッドの40%のダメージを与えます。", zh = "生命之环：被定身的敌人死亡时会留下幼苗。幼苗在3秒后成熟，持续10秒。触碰成熟的幼苗可召唤一个树人，持续8秒，同时最多一个。它的每次攻击造成相当于撕碎40%的伤害。", ko = "생명의 순환: 속박된 적이 죽으면 새싹을 남깁니다. 새싹은 3초 후 자라나 10초 동안 유지됩니다. 다 자란 새싹을 건드리면 나무정령을 8초 동안 소환합니다(한 번에 하나). 나무정령은 공격마다 칼날 발톱 피해의 40%를 줍니다." }

[[set_bonus]]
key = "druid_mythic_4"
tier = "mythic"
pieces = 4
scripted = true
text = { en = "Circle of Life: Entangling Roots lands on the densest enemy group within 30 m. Each enemy near that spot takes 200% of its damage and is rooted for 3 seconds.", de = "Kreis des Lebens: Wucherwurzeln landet auf der dichtesten Gegnergruppe im Umkreis von 30 m. Jeder Feind in der Nähe dieser Stelle erleidet 200% des Schadens von Wucherwurzeln und wird 3 Sekunden lang festgewurzelt.", fr = "Cercle de la vie : Sarments s'abat sur le groupe d'ennemis le plus dense dans un rayon de 30 m. Chaque ennemi proche de cet endroit subit 200 % des dégâts du sort et est immobilisé pendant 3 secondes.", es = "Círculo de la vida: Raíces enredadoras cae sobre el grupo más denso de enemigos en un radio de 30 m. Cada enemigo cerca del punto recibe el 200 % del daño del hechizo y queda enraizado durante 3 segundos.", pt = "Círculo da Vida: Raízes Enredantes cai sobre o grupo mais denso de inimigos em um raio de 30 m. Cada inimigo perto do local recebe 200% do dano do feitiço e fica enraizado por 3 segundos.", ru = "Круг жизни: Гнев деревьев обрушивается на самое плотное скопление врагов в радиусе 30 м. Каждый противник рядом с этой точкой получает 200% урона заклинания и обездвиживается на 3 секунды.", it = "Cerchio della vita: Radici intrappolanti si abbatte sul gruppo di nemici più fitto entro 30 m. Ogni nemico vicino al punto subisce il 200% dei danni della magia e viene immobilizzato per 3 secondi.", pl = "Krąg życia: Pnącza trafiają w najgęstsze skupisko wrogów w promieniu 30 m. Każdy wróg w pobliżu tego miejsca otrzymuje 200% obrażeń zaklęcia i zostaje unieruchomiony na 3 sekundy.", tr = "Yaşam Çemberi: Dolaşan Kökler 30 m içindeki en yoğun düşman grubunun üzerine düşer. O noktaya yakın her düşman büyünün hasarının %200'ünü alır ve 3 saniyeliğine köklenir.", ja = "生命の環：エンタングリング・ルーツが30メートル以内で最も密集した敵の集団に落ちます。その地点の近くの敵はそれぞれそのダメージの200%を受け、3秒間移動不能になります。", zh = "生命之环：纠缠根须会落在30码内最密集的敌群上。该处附近的每个敌人受到相当于其伤害200%的伤害，并被定身3秒。", ko = "생명의 순환: 휘감는 뿌리가 30미터 안에서 적이 가장 밀집한 무리에 떨어집니다. 그 지점 근처의 적은 각각 피해의 200%를 받고 3초 동안 속박됩니다." }
