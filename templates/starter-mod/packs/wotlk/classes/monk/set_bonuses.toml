# Class set: Breath of the Storm / Atem des Sturms.
[[set_bonus]]
key = "monk_mythic_4"
tier = "mythic"
pieces = 4
text = { en = "Breath of the Storm: Tiger Palm hits one additional enemy.", de = "Atem des Sturms: Treffer von Tigerklaue springen auf einen weiteren Feind über.", fr = "Souffle de la tempête : Paume du tigre touche un ennemi supplémentaire.", es = "Aliento de la tormenta: Palma del tigre golpea a un enemigo adicional.", pt = "Sopro da Tempestade: Palma do Tigre atinge um inimigo adicional.", ru = "Дыхание бури: Ладонь тигра поражает ещё одного врага.", it = "Respiro della tempesta: Palmo della Tigre colpisce un nemico aggiuntivo.", pl = "Oddech burzy: Dłoń tygrysa trafia jednego dodatkowego wroga.", tr = "Fırtınanın Nefesi: Kaplan Avucu bir ek düşmana vurur.", ja = "嵐の吐息：タイガー・パームが追加で1体の敵に命中します。", zh = "风暴之息：猛虎掌额外击中一个敌人。", ko = "폭풍의 숨결: 범의 장풍이 적을 1명 더 공격합니다." }

