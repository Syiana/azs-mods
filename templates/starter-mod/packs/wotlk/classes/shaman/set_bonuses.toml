scripted = true
text = { en = "Eye of the Storm: Chain Lightning casts a second time, starting on a different target.", de = "Auge des Sturms: Kettenblitz wird ein zweites Mal auf ein anderes Ziel gewirkt.", fr = "Œil du cyclone : Chaîne d’éclairs est lancée une seconde fois en partant d’une autre cible.", es = "Ojo de la Tormenta: Cadena de relámpagos se lanza una segunda vez sobre un objetivo distinto.", pt = "Olho da Tormenta: Cadeia de Raios é lançada uma segunda vez, começando em outro alvo.", ru = "Око Бури: «Цепная молния» срабатывает второй раз, начиная с другой цели.", pl = "Oko Burzy: Błyskawica łańcuchowa zostaje rzucona drugi raz, zaczynając od innego celu.", tr = "Fırtınanın Gözü: Zincir Yıldırım farklı bir hedeften başlayarak ikinci kez kullanılır.", it = "Occhio del Ciclone: Catena di Fulmini viene lanciata una seconda volta a partire da un bersaglio diverso.", ja = "アイ・オブ・ザ・ストーム：チェイン・ライトニングが別の対象から始まる2回目を唱えます。", zh = "风暴之眼：闪电链会第二次施放，从另一个目标开始。", ko = "폭풍의 눈: 연쇄 번개가 다른 대상에서 시작하여 한 번 더 시전됩니다." }

[[set_bonus]]
key = "shaman_mythic_8"
tier = "mythic"
pieces = 8
scripted = true
text = { en = "Eye of the Storm: Every 12 Chain Lightning hits form a visible storm at the last hit. It pulls normal enemies within 10 yd for 2 sec, then deals 180% Chain Lightning damage in the area.", de = "Auge des Sturms: Alle 12 Kettenblitz-Treffer bilden am letzten Trefferort einen sichtbaren Wirbel. Er zieht normale Gegner im Umkreis von 10 Metern 2 Sek. lang zur Mitte und entlädt sich dann mit 180% Kettenblitz-Schaden im Bereich.", fr = "Œil du cyclone : tous les 12 impacts de Chaîne d’éclairs, un tourbillon visible se forme au dernier impact. Il attire les ennemis normaux à 10 m ou moins pendant 2 s, puis inflige 180 % des dégâts de Chaîne d’éclairs dans la zone.", es = "Ojo de la Tormenta: cada 12 impactos de Cadena de relámpagos forman un torbellino visible en el último impacto. Atrae durante 2 s a los enemigos normales en 10 m y luego inflige un 180 % del daño de Cadena de relámpagos en el área.", pt = "Olho da Tormenta: a cada 12 acertos de Cadeia de Raios, surge um redemoinho visível no último impacto. Ele puxa inimigos normais a até 10 m por 2 s e depois causa 180% do dano de Cadeia de Raios na área.", ru = "Око Бури: каждые 12 попаданий «Цепной молнии» создают видимый вихрь в месте последнего попадания. Он притягивает обычных врагов в радиусе 10 м в течение 2 с, затем наносит 180% урона «Цепной молнии» по области.", pl = "Oko Burzy: co 12 trafień Błyskawicy łańcuchowej tworzy się widoczny wir w miejscu ostatniego trafienia. Przez 2 s przyciąga zwykłych wrogów w promieniu 10 m, po czym zadaje na tym obszarze 180% obrażeń Błyskawicy łańcuchowej.", tr = "Fırtınanın Gözü: Her 12 Zincir Yıldırım isabeti son isabetin yerinde görünür bir girdap oluşturur. Girdap 10 m içindeki normal düşmanları 2 sn boyunca çeker, ardından alana %180 Zincir Yıldırım hasarı verir.", it = "Occhio del Ciclone: ogni 12 colpi di Catena di Fulmini si forma un vortice visibile nel punto dell’ultimo impatto. Attira per 2 s i nemici normali entro 10 m, poi infligge il 180% dei danni di Catena di Fulmini nell’area.", ja = "アイ・オブ・ザ・ストーム：チェイン・ライトニングが12回命中するごとに、最後の命中地点に目に見える嵐が生まれます。嵐は10ヤード以内の通常の敵を2秒間引き寄せ、その後範囲内にチェイン・ライトニングの180%のダメージを与えます。", zh = "风暴之眼：闪电链每命中12次，会在最后一次命中处形成一场可见的风暴。它将10码内的普通敌人拉扯2秒，然后对该区域造成相当于闪电链180%的伤害。", ko = "폭풍의 눈: 연쇄 번개가 12번 적중할 때마다 마지막 적중 지점에 눈에 보이는 폭풍이 생깁니다. 폭풍은 10미터 안의 일반 적을 2초 동안 끌어당긴 뒤, 그 범위에 연쇄 번개 피해의 180%를 줍니다." }
