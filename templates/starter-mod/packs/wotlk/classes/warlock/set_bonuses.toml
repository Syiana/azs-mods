scripted = true
text = { en = "Demonic Bombardment: A cursed enemy leaves an 8 sec portal on death, up to two active at once. Every 2 sec three Imps leap at the largest enemy group within 20 yd. Each Imp deals 50% of its damage to enemies within 10 yd of the landing point.", de = "Dämonisches Bombardement: Ein verfluchter Gegner hinterlässt beim Tod 8 Sek. lang ein Portal, bis zu zwei gleichzeitig. Alle 2 Sek. springen drei Wichtel zur größten Gegnergruppe innerhalb von 20 Metern. Jeder Wichtel verursacht 50% seines Schadens an Gegnern innerhalb von 10 Metern um den Landepunkt.", fr = "Bombardement démoniaque : un ennemi maudit laisse à sa mort un portail de 8 s, avec deux portails actifs au maximum. Toutes les 2 s, trois diablotins bondissent sur le plus grand groupe à 20 m ou moins. Chaque diablotin inflige 50 % de ses dégâts aux ennemis à 10 m ou moins du point de chute.", es = "Bombardeo demoníaco: al morir, un enemigo maldito deja un portal durante 8 s, hasta dos activos. Cada 2 s, tres diablillos saltan hacia el grupo enemigo más numeroso en 20 m. Cada uno inflige un 50 % de su daño a los enemigos en 10 m del punto de aterrizaje.", pt = "Bombardeio Demoníaco: ao morrer, um inimigo amaldiçoado deixa um portal por 8 s, até dois ativos. A cada 2 s, três diabretes saltam no maior grupo inimigo a até 20 m. Cada um causa 50% do seu dano aos inimigos a até 10 m do ponto de aterrissagem.", ru = "Демоническая бомбардировка: проклятый враг после смерти оставляет портал на 8 с, до двух одновременно. Каждые 2 с три беса прыгают к самой большой группе врагов в радиусе 20 м. Каждый бес наносит 50% своего урона врагам в радиусе 10 м от места приземления.", pl = "Demoniczny ostrzał: przeklęty wróg po śmierci zostawia portal na 8 s, maksymalnie dwa naraz. Co 2 s trzy chochliki skaczą do największej grupy wrogów w promieniu 20 m. Każdy zadaje 50% swoich obrażeń wrogom w promieniu 10 m od lądowania.", tr = "Şeytani Bombardıman: Lanetli düşman ölünce 8 sn süren bir geçit bırakır, aynı anda en fazla iki geçit açılır. Her 2 sn'de üç İblis 20 m içindeki en büyük düşman grubuna atlar. Her İblis indiği yerin 10 m çevresindeki düşmanlara kendi hasarının %50'sini verir.", it = "Bombardamento Demoniaco: un nemico maledetto lascia alla morte un portale per 8 s, fino a due attivi. Ogni 2 s tre Imp saltano sul gruppo nemico più numeroso entro 20 m. Ogni Imp infligge il 50% dei suoi danni ai nemici entro 10 m dal punto d'arrivo.", ja = "デモニック・ボンバードメント：呪われた敵は死ぬと8秒間のポータルを残します（同時に2つまで）。2秒ごとに3体のインプが20ヤード以内の最大の敵集団へ飛びかかります。各インプは着地点の10ヤード以内の敵にそのダメージの50%を与えます。", zh = "恶魔轰炸：被诅咒的敌人死亡时会留下一个持续8秒的传送门，最多同时存在两个。每2秒，三个小鬼会扑向20码内最大的敌群。每个小鬼对落点10码内的敌人造成相当于其伤害50%的伤害。", ko = "악마 폭격: 저주에 걸린 적이 죽으면 8초 동안 차원문을 남깁니다(동시에 최대 2개). 2초마다 임프 셋이 20미터 안에서 가장 큰 적 무리로 뛰어듭니다. 각 임프는 착지 지점 10미터 안의 적에게 자신의 피해의 50%를 줍니다." }
