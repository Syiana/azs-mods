text = { en = "Demonic Bombardment: Three permanent Imps fight at your side.", de = "Dämonisches Bombardement: Drei permanente Wichtel kämpfen an deiner Seite.", fr = "Démolissage démoniaque : trois diablotins permanents combattent à vos côtés.", es = "Bombardeo demoníaco: tres diablillos permanentes luchan a tu lado.", pt = "Bombardeio Demoníaco: três diabretes permanentes lutam ao seu lado.", ru = "Демоническая бомбардировка: рядом с вами постоянно сражаются три беса.", pl = "Demoniczny ostrzał: trzy stałe chochliki walczą u twego boku.", tr = "Şeytani Bombardıman: Üç kalıcı İblis yanında savaşır.", it = "Bombardamento Demoniaco: tre Imp permanenti combattono al tuo fianco.", ja = "デモニック・ボンバードメント：3体のインプが常に共に戦います。", zh = "恶魔轰炸：三个永久的小鬼在你身边作战。", ko = "악마 폭격: 임프 셋이 영구히 곁에서 싸웁니다." }

