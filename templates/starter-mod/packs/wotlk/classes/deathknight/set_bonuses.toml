text = { en = "Chains of Ice strike {v} more enemies, deal 200% more damage and come back 40% sooner, and you deal {v2}% more damage to enemies you stun, root, slow or fear.", de = "Eisige Ketten treffen {v} weitere Feinde, verursachen 200% mehr Schaden und sind 40% früher wieder bereit, und du verursachst {v2}% mehr Schaden an Feinden, die du betäubst, festwurzelst, verlangsamst oder fürchten lässt.", fr = "Chaînes de glace frappent {v} ennemis de plus, infligent 200% de dégâts en plus et reviennent 40% plus tôt, et vous infligez {v2}% de dégâts en plus aux ennemis que vous étourdissez, immobilisez, ralentissez ou terrifiez.", es = "Cadenas de hielo golpean a {v} enemigos más, infligen un 200% más de daño y vuelven un 40% antes, y infliges un {v2}% más de daño a los enemigos que aturdes, enraízas, ralentizas o asustas.", pt = "Correntes de Gelo atingem {v} inimigos a mais, causam 200% mais dano e voltam 40% mais cedo, e você causa {v2}% mais dano a inimigos que atordoa, enraíza, retarda ou amedronta.", ru = "Ледяные оковы поражают ещё {v} противников, наносят на 200% больше урона и восстанавливаются на 40% быстрее, а вы наносите на {v2}% больше урона противникам, которых оглушаете, обездвиживаете, замедляете или пугаете.", pl = "Łańcuchy lodu trafiają {v} kolejnych wrogów, zadają o 200% więcej obrażeń i wracają o 40% szybciej, a zadajesz o {v2}% więcej obrażeń wrogom, których ogłuszasz, unieruchamiasz, spowalniasz lub przerażasz.", tr = "Buz Zincirleri {v} düşmana daha vurur, %200 daha fazla hasar verir ve %40 daha erken hazır olur, ve sersemlettiğin, köklediğin, yavaşlattığın veya korkuttuğun düşmanlara %{v2} daha fazla hasar verirsin.", it = "Catene di ghiaccio colpiscono {v} nemici in più, infliggono il 200% di danni in più e ritornano il 40% prima, e infliggi il {v2}% di danni in più ai nemici che stordisci, immobilizzi, rallenti o terrorizzi.", ja = "チェイン・オブ・アイスが追加で{v}体の敵に命中し、ダメージが200%増加し、40%早く再使用できるようになります。さらに、スタン・移動不能・スロー・恐怖状態の敵に与えるダメージが{v2}%増加します。", zh = "寒