# Frost Tomb, the death knight's Mythic set (the balance team's write-up, version 4 of 2026-11-16,
# `Todesritter_Set_Aenderungen`). The 4-piece: you also start every run with Frost Strike, and every
# Frost hit of yours entombs its target for 4 sec, up to 5 stacks (all stacks end 4 sec after the latest
# hit); each stack makes it take {v}% more damage from your Frost attacks (6%, empowered 9%, so 30% and
# 45% at 5 stacks) and slows it by 5% (25% at 5, bosses too). The stacks are a debuff the enemy carries
# (the target window's debuff bar shows a boss's, with the icon named here), which the 8-piece reads as
# the enemy dies. The 8-piece: an enemy that dies entombed leaves an ice grave for 15 sec, up to 5. A
# grave is not used up: every 2 sec it releases a Frost Ghoul (7 over its 15 sec) at the nearest boss or
# guardian with 5 stacks within 12 m (13.12336 yd) of it, else at the thickest group of enemies within
# 12 m. The ghoul charges there at 10 yd/s and explodes for {v}% of Frost Strike's hit (250%, empowered
# 375%) on every enemy within {v2} m (6 m, empowered 9 m: 6.56168 yd), each rolling its own crit. The
# explosion lays no stack (it is no cast: no echo, no amulet's extra) but takes the stacks' damage like
# any Frost hit.

[[set_bonus]]
key = "deathknight_mythic_4"
tier = "mythic"
pieces = 4
mechanic = { kind = "entomb", spell = "frost_strike", secs = 4.0, stacks = 5, vulnerability = 0.06, slow = 5, empowers = true, icon = "Spell_Frost_FrozenCore", name = { en = "Frost Tomb", de = "Frostgrab", fr = "Tombeau de givre", es = "Tumba de Escarcha", pt = "Túmulo de Gelo", ru = "Ледяная гробница", it = "Tomba di Ghiaccio", pl = "Lodowy Grób", tr = "Buz Mezarı", ja = "フロスト・トゥーム", zh = "冰霜之墓", ko = "서리 무덤" } }
text = { en = "Frost Tomb: Start with Frost Strike. Your Frost attacks entomb their target for 4 sec, stacking up to 5 times. Each stack makes it take {v}% more damage from your Frost attacks and slows it by 5%.", de = "Frostgrab: Beginne mit Froststoß. Deine Frostangriffe legen ihr Ziel 4 Sek. lang in ein Frostgrab, bis zu 5-mal stapelbar. Jede Stapelung erhöht den Schaden, den es durch deine Frostangriffe erleidet, um {v}% und verlangsamt es um 5%.", fr = "Tombeau de givre : commencez avec Frappe de givre. Vos attaques de Givre ensevelissent leur cible pendant 4 s, jusqu’à 5 fois cumulables. Chaque cumul lui fait subir {v}% de dégâts en plus de vos attaques de Givre et le ralentit de 5%.", es = "Tumba de Escarcha: Empiezas con Golpe de escarcha. Tus ataques de Escarcha sepultan a su objetivo durante 4 s, acumulable hasta 5 veces. Cada acumulación hace que reciba un {v}% más de daño de tus ataques de Escarcha y lo ralentiza un 5%.", pt = "Túmulo de Gelo: Comece com Golpe de Gelo. Seus ataques de Gelo sepultam o alvo por 4 s, acumulando até 5 vezes. Cada acúmulo faz com que ele receba {v}% a mais de dano dos seus ataques de Gelo e o retarda em 5%.", ru = "Ледяная гробница: вы начинаете с Ледяного удара. Ваши атаки льдом заточают цель в гробницу на 4 с; эффект суммируется до 5 раз. Каждый заряд увеличивает урон, получаемый целью от ваших атак льдом, на {v}% и замедляет её на 5%.", it = "Tomba di Ghiaccio: inizi con Colpo di gelo. I tuoi attacchi di gelo seppelliscono il bersaglio per 4 s, fino a 5 volte cumulabili. Ogni cumulo gli fa subire il {v}% di danni in più dai tuoi attacchi di gelo e lo rallenta del 5%.", pl = "Lodowy Grób: zaczynasz z Lodowym uderzeniem. Twoje ataki mrozem pogrążają cel w grobie na 4 s, kumulując się do 5 razy. Każdy ładunek zwiększa obrażenia, jakie cel otrzymuje od twoich ataków mrozem, o {v}% i spowalnia go o 5%.", tr = "Buz Mezarı: Buz Darbesi ile başlarsın. Buz saldırıların hedefi 4 sn boyunca mezara gömer ve en fazla 5 kez birikir. Her birikim, hedefin buz saldırılarından aldığı hasarı %{v} artırır ve onu %5 yavaşlatır.", ja = "フロスト・トゥーム：フロスト・ストライクを習得した状態で開始します。冷気の攻撃が対象を4秒間墓に封じ、最大5回まで重なります。1回重なるごとに、対象が受ける冷気攻撃のダメージが{v}%増加し、移動速度が5%低下します。", zh = "冰霜之墓：以冰霜打击开局。你的冰霜攻击会将目标封入冰墓4秒，最多叠加5次。每层使其受到你的冰霜攻击的伤害提高{v}%，并使其减速5%。", ko = "서리 무덤: 냉기의 일격을 가지고 시작합니다. 냉기 공격이 대상을 4초 동안 무덤에 가두며 최대 5번 중첩됩니다. 중첩될 때마다 대상이 당신의 냉기 공격으로 받는 피해가 {v}% 증가하고 5% 느려집니다." }

