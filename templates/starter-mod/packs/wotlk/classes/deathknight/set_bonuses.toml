mechanic = { kind = "frozen_graves", spell = "frost_strike", pet = "ghoul", cap = 5, secs = 15.0, radius = 13.12336, blast = 6.56168, speed = 10.0, damage = 2.5, every = 2.0, entombed = true, crit = true, empowers = true, source = { en = "Frost Ghoul", de = "Eisghul", fr = "Goule de givre", es = "Necrófago de escarcha", pt = "Carniçal de gelo", ru = "Ледяной вурдалак", it = "Ghoul di ghiaccio", pl = "Lodowy ghul", tr = "Buz Hortlağı", ja = "フロスト・グール", zh = "冰霜食尸鬼", ko = "서리 구울" } }
marker = { entry = 990104, display = 90102, scale = 0.7 }
text = { en = "Frost Tomb: Entombed enemies leave ice graves when they die, lasting 15 seconds, up to 5. Every 2 sec, each grave releases a Frost Ghoul: at a boss or guardian with 5 stacks of Frost Tomb within 12 m, otherwise at the largest enemy group within 12 m. A Frost Ghoul charges its target and explodes for {v}% of Frost Strike damage on all enemies within {v2} m. The explosion can critically strike.", de = "Frostgrab: Gegner im Frostgrab hinterlassen beim Tod bis zu 5 Eisgräber für je 15 Sekunden. Alle 2 Sek. gibt jedes Grab einen Eisghul frei: auf einen Boss oder Wächter mit 5 Stapeln Frostgrab im Umkreis von 12 m, sonst auf die größte Gegnergruppe im Umkreis von 12 m. Ein Eisghul stürmt auf sein Ziel zu und explodiert für {v}% Froststoß-Schaden an allen Gegnern im Umkreis von {v2} m. Die Explosion kann kritisch treffen.", fr = "Tombeau de givre : les ennemis ensevelis laissent des tombes de glace à leur mort, pendant 15 secondes, jusqu’à 5. Toutes les 2 s, chaque tombe libère une goule de givre : sur un boss ou un gardien avec 5 cumuls de Tombeau de givre à moins de 12 m, sinon sur le plus gros groupe d’ennemis à moins de 12 m. Une goule de givre fonce sur sa cible et explose pour {v}% des dégâts de Frappe de givre sur tous les ennemis dans un rayon de {v2} m. L’explosion peut infliger un coup critique.", es = "Tumba de Escarcha: Los enemigos sepultados dejan tumbas de hielo al morir, que duran 15 segundos, hasta 5. Cada 2 s, cada tumba libera un necrófago de escarcha: sobre un jefe o guardián con 5 acumulaciones de Tumba de Escarcha a menos de 12 m; si no, sobre el mayor grupo de enemigos a menos de 12 m. Un necrófago de escarcha carga contra su objetivo y explota infligiendo un {v}% del daño de Golpe de escarcha a todos los enemigos en {v2} m. La explosión puede ser crítica.", pt = "Túmulo de Gelo: Inimigos sepultados deixam túmulos de gelo ao morrer, que duram 15 segundos, até 5. A cada 2 s, cada túmulo libera um carniçal de gelo: sobre um chefe ou guardião com 5 acúmulos de Túmulo de Gelo a até 12 m; caso contrário, sobre o maior grupo de inimigos a até 12 m. Um carniçal de gelo avança contra o alvo e explode causando {v}% do dano de Golpe de Gelo a todos os inimigos em {v2} m. A explosão pode causar dano crítico.", ru = "Ледяная гробница: заточённые в гробницу враги оставляют после смерти ледяные могилы на 15 секунд, до 5 штук. Каждые 2 с каждая могила выпускает ледяного вурдалака: на босса или стража с 5 зарядами Ледяной гробницы в радиусе 12 м, иначе на самую большую группу врагов в радиусе 12 м. Ледяной вурдалак бросается на свою цель и взрывается, нанося {v}% урона Ледяного удара всем врагам в радиусе {v2} м. Взрыв может нанести критический урон.", it = "Tomba di Ghiaccio: i nemici sepolti lasciano tombe di ghiaccio quando muoiono, che durano 15 secondi, fino a 5. Ogni 2 s, ogni tomba libera un ghoul di ghiaccio: su un boss o guardiano con 5 cumuli di Tomba di Ghiaccio entro 12 m, altrimenti sul gruppo di nemici più grande entro 12 m. Un ghoul di ghiaccio carica il suo bersaglio ed esplode infliggendo il {v}% dei danni di Colpo di gelo a tutti i nemici entro {v2} m. L’esplosione può infliggere un colpo critico.", pl = "Lodowy Grób: pogrzebani wrogowie zostawiają po śmierci lodowe groby na 15 sekund, do 5. Co 2 s każdy grób uwalnia lodowego ghula: na bossa lub strażnika z 5 ładunkami Lodowego Grobu w promieniu 12 m, w przeciwnym razie na największą grupę wrogów w promieniu 12 m. Lodowy ghul szarżuje na swój cel i wybucha, zadając {v}% obrażeń Lodowego uderzenia wszystkim wrogom w promieniu {v2} m. Wybuch może zadać obrażenia krytyczne.", tr = "Buz Mezarı: Mezara gömülen düşmanlar öldüklerinde 15 saniye süren en fazla 5 buz mezarı bırakır. Her 2 sn’de bir her mezar bir Buz Hortlağı salar: 12 m içinde 5 Buz Mezarı birikimi olan bir patrona veya muhafıza, yoksa 12 m içindeki en büyük düşman grubuna. Buz Hortlağı hedefine hücum eder ve patlayarak {v2} m içindeki tüm düşmanlara Buz Darbesi hasarının %{v}’si kadar hasar verir. Patlama kritik vurabilir.", ja = "フロスト・トゥーム：墓に封じられた敵は死亡時に氷の墓を残し、15秒間（最大5つ）残ります。2秒ごとに、それぞれの墓がフロスト・グールを1体放ちます。12メートル以内にフロスト・トゥームが5スタックのボスまたはガーディアンがいればそれを、いなければ12メートル以内で最も大きな敵の集団を狙います。フロスト・グールは対象へ突進して爆発し、{v2}メートル以内のすべての敵にフロスト・ストライクのダメージの{v}%を与えます。爆発はクリティカルになることがあります。", zh = "冰霜之墓：被封入冰墓的敌人死亡时会留下持续15秒的冰墓，最多5个。每2秒，每个冰墓会释放一个冰霜食尸鬼：12米内若有叠满5层冰霜之墓的首领或守卫，则攻向它，否则攻向12米内最大的一群敌人。冰霜食尸鬼会冲向目标并爆炸，对{v2}米内的所有敌人造成相当于冰霜打击{v}%的伤害。爆炸可以造成暴击。", ko = "서리 무덤: 무덤에 갇힌 적은 죽을 때 얼음 무덤을 남기며, 15초 동안 최대 5개까지 유지됩니다. 2초마다 각 무덤이 서리 구울을 하나씩 풀어놓습니다. 12미터 안에 서리 무덤이 5번 중첩된 우두머리나 수호자가 있으면 그에게, 없으면 12미터 안의 가장 큰 적 무리에게 향합니다. 서리 구울은 대상에게 돌진하여 폭발하고, {v2}미터 안의 모든 적에게 냉기의 일격 피해의 {v}%를 줍니다. 폭발은 치명타가 될 수 있습니다." }
