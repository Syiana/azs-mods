# The death knight's run sets dressed as the real sets they are named after (`[[set_look]]`,
# docs/HOWTO-CONTENT.md "A set look"): its pieces of each rarity show these displays and icons. A
# piece is (gear slot 0-7 head to hands, ItemDisplayInfo id, InventoryType, icon without INV_),
# read off the client's ItemSet.dbc, Item.dbc and ItemDisplayInfo.dbc (3.3.5a). Ebon Blade
# (Uncommon) is no real set and keeps plate's icons; Darkruned has no belt, boots or bracers, and
# the PvP set no look: those keep plate's icons too.

# Acherus Knight's pieces: Acherus Knight's set, Ebon Hold's starting gear (Item.dbc 34648-34656).
[[set_look]]
key = "deathknight_common"
rarity = 0
pieces = [
    [0, 51495, 1, "Helmet_125"], [1, 51501, 3, "Shoulder_92"],
    [2, 51494, 5, "Chest_Plate11"], [3, 51497, 6, "Belt_12"],
    [4, 51499, 7, "Pants_Cloth_27"], [5, 51496, 8, "Boots_Plate_05"],
    [6, 51500, 9, "Bracer_17"], [7, 51498, 10, "Gauntlets_32"],
]

