text = { en = "Milestone. You start every run with Obliterate, and Obliterate and Icy Touch strike twice: everything they hit is struck again at once for {v}% of the blow.", de = "Meilenstein. Du beginnst jeden Lauf mit Auslöschen, und Auslöschen und Eisige Berührung treffen doppelt: Alles, was sie treffen, wird sofort erneut für {v}% des Hiebs getroffen.", fr = "Jalon. Tu commences chaque partie avec Anéantissement, et Anéantissement et Toucher de glace frappent deux fois : tout ce qu'ils touchent est aussitôt frappé de nouveau pour {v}% du coup.", es = "Hito. Empiezas cada partida con Obliterar, y Obliterar y Toque helado golpean dos veces: todo lo que alcanzan es golpeado de nuevo al instante por un {v}% del golpe.", pt = "Marco. Você começa cada partida com Obliterar, e Obliterar e Toque Gélido atacam duas vezes: tudo que acertam é atingido de novo na hora por {v}% do golpe.", ru = "Веха. Ты начинаешь каждый забег с Уничтожения, а Уничтожение и Ледяное прикосновение бьют дважды: все, что они поражают, тут же получает повторный удар на {v}% от силы удара.", pl = "Kamień milowy. Każdą rozgrywkę zaczynasz z Unicestwieniem, a Unicestwienie i Lodowy dotyk uderzają dwukrotnie: wszystko, co trafią, dostaje natychmiast drugi cios za {v}% pierwszego.", tr = "Dönüm noktası. Her oyuna Yok Et ile başlarsın ve Yok Et ile Buzlu Dokunuş iki kez vurur: vurdukları her şeye hemen darbenin {v}%'si kadar yeniden vurulur.", it = "Traguardo. Inizi ogni partita con Annientare e Annientare e Tocco gelido colpiscono due volte: tutto ciò che colpiscono viene colpito di nuovo subito per il {v}% del colpo.", ja = "【マイルストーン】毎ランをオブリタレートを持って始め、オブリタレートとアイシー・タッチが2度命中します：命中したすべての敵に即座にもう一度その{v}%のダメージを与えます。", zh = "里程碑：你在每场对局开始时拥有湮灭，湮灭和冰冷触摸会打击两次：被击中的目标会立即再受到一次相当于该次攻击{v}%的伤害。", ko = "이정표. 모든 런을 절멸을 가지고 시작하며, 절멸과 얼음 손길이 두 번 적중합니다: 맞힌 모든 대상을 즉시 한 번 더 공격하여 그 피해의 {v}%를 줍니다." }
