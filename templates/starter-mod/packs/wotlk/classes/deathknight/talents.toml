text = { en = "A blow that would kill you leaves you at 35% health instead, behind a shield of 15% of your maximum health, and a free Blood Boil answers it. Once every 90 sec.", de = "Ein Hieb, der dich töten würde, lässt dich stattdessen mit 35% Gesundheit zurück, hinter einem Schild von 15% deiner maximalen Gesundheit, und ein kostenloses Blutsieden antwortet darauf. Einmal alle 90 Sek.", fr = "Un coup qui te tuerait te laisse à 35% de santé, derrière un bouclier de 15% de ta santé maximale, et un Furoncle sanglant gratuit y répond. Une fois toutes les 90 s.", es = "Un golpe que te mataría te deja con un 35% de salud, tras un escudo del 15% de tu salud máxima, y una Sangre hirviente gratuita responde. Una vez cada 90 s.", pt = "Um golpe que mataria você o deixa com 35% de vida, atrás de um escudo de 15% da sua vida máxima, e um Sangue Fervente gratuito responde. Uma vez a cada 90 s.", ru = "Удар, который убил бы тебя, оставляет 35% здоровья и щит в 15% от максимума здоровья, а в ответ срабатывает бесплатное Вскипание крови. Раз в 90 сек.", pl = "Cios, który by cię zabił, zostawia cię przy 35% zdrowia, za tarczą o wartości 15% twojego maksymalnego zdrowia, a odpowiada na niego darmowe Wrzenie krwi. Raz na 90 s.", tr = "Seni öldürecek bir darbe seni 35% canla bırakır, azami canının 15%'i kadar bir kalkanın ardında; bedava bir Kan Kaynaması karşılık verir. 90 sn'de bir.", it = "Un colpo che ti ucciderebbe ti lascia invece al 35% di salute, dietro uno scudo pari al 15% della tua salute massima, e un'Ebollizione del sangue gratuita risponde. Una volta ogni 90 s.", ja = "致命的な一撃を受けると代わりに体力35%で踏みとどまり、最大体力15%のシールドに守られ、無料のブラッド・ボイルで反撃します。90秒に1回まで。", zh = "致命的一击会使你保留35%的生命值，并获得一个吸收相当于你最大生命值15%伤害的护盾，同时以一次免费的血液沸腾回应。每90秒一次。", ko = "치명적인 일격을 받으면 대신 생명력 35%로 남고 최대 생명력 15%의 보호막에 둘러싸이며, 피의 소용돌이가 무료로 반격합니다. 90초에 한 번 발동합니다." }
