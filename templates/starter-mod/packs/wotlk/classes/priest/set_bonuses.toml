# Bell of Redemption, the priest's Mythic set (the balance team's rework of 2026-11-16, "Überarbeitung -
# Priester - Geläut der Erlösung - Mythisch"). Both bonuses are mechanics now (`heal_sparks`, `heal_bell`):
# the sources, the numbers and the looks are written here, the run's code names none of them.
#
# 4 pieces, Holy Sparks: every heal of Renew (each tick), Circle of Healing, Holy Nova (its Mend rider, one heal
# for the whole cast) and Inspiration, overhealing too, sends a spark from the healed hero to up to 10 enemies
# within 10 m (the code's yards) of them, boss before guardian before elite before normal, then the nearest.
# Each deals 30% of the heal as the difficulty has not cut it, at most 10% of the priest's maximum health, in
# Holy, with no crit of its own and none of the damage bonuses, where it lands. None of these numbers grows
# with the stars (they are written in the text). The spark is Penance's missile (spell 47666) at 0.35 of its
# size and turned -30 degrees (amber), its landing as small as the look allows (impact_scale 0.1: the patch
# builder cannot drop a landing).
[[set_bonus]]
key = "priest_mythic_4"
tier = "mythic"
pieces = 4
mechanic = { kind = "heal_sparks", sources = ["renew", "circle_of_healing", "holy_nova", "inspiration"], targets = 10, radius = 10.0, share = 0.3, cap = 0.1, speed = 40.0, id = 48072, row = "holy_sparks", visual = 910960 }
text = { en = "Bell of Redemption: Heals from Renew, Circle of Healing, Holy Nova and Inspiration, overhealing included, send sparks to up to 10 enemies within 10 m of the healed target. Each deals 30% of the heal as Holy damage, up to 10% of your maximum health.", de = "Geläut der Erlösung: Heilungen von Erneuerung, Kreis der Heilung, Heiliger Nova und Inspiration, auch Überheilung, schicken Funken an bis zu 10 Gegner im Umkreis von 10 m um den Geheilten. Jeder trifft mit 30 % der Heilung als Heiligschaden, höchstens 10 % deines maximalen Lebens.", fr = "Cloche de la rédemption : les soins de Rénovation, de Cercle de soins, de Nova sacrée et d’Inspiration, même excédentaires, envoient des étincelles sur jusqu’à 10 ennemis dans un rayon de 10 m autour de la cible soignée. Chacune inflige 30 % du soin en dégâts du Sacré, au maximum 10 % de vos points de vie maximum.", es = "Campana de la Redención: Las curaciones de Renovar, Círculo de sanación, Nova Sagrada e Inspiración, incluida la sanación excedente, envían chispas a hasta 10 enemigos a menos de 10 m del objetivo curado. Cada una inflige el 30 % de la curación como daño Sagrado, hasta el 10 % de tu salud máxima.", pt = "Sino da Redenção: As curas de Renovar, Círculo de Cura, Nova Sagrada e Inspiração, inclusive o excesso de cura, enviam faíscas a até 10 inimigos a até 10 m do alvo curado. Cada uma causa 30% da cura como dano Sagrado, até 10% da sua vida máxima.", ru = "Колокол искупления: Исцеление от Обновления, Круга исцеления, Кольца света и Вдохновения, включая избыточное, посылает искры в до 10 врагов в радиусе 10 м от исцелённой цели. Каждая наносит урон от магии Света в размере 30% исцеления, но не более 10% вашего максимального запаса здоровья.", it = "Campana della Redenzione: Le cure di Rinnovamento, Cerchio di guarigione, Nova sacra e Ispirazione, anche in eccesso, inviano scintille a un massimo di 10 nemici entro 10 m dal bersaglio curato. Ognuna infligge il 30% della cura come danno Sacro, fino al 10% della tua salute massima.", pl = "Dzwon Odkupienia: Leczenie z Odnowienia, Kręgu uzdrowienia, Świętej novy i Natchnienia, także nadmiarowe, wysyła iskry do maksymalnie 10 wrogów w promieniu 10 m od leczonego celu. Każda zadaje obrażenia od światła równe 30% leczenia, nie więcej niż 10% twojego maksymalnego zdrowia.", tr = "Kurtuluş Çanı: Yenile, Şifa Çemberi, Kutsal Nova ve İlham iyileştirmeleri, fazla iyileştirme de dahil, iyileştirilen hedefin 10 m çevresindeki en fazla 10 düşmana kıvılcım gönderir. Her biri iyileştirmenin %30’u kadar Kutsal hasar verir, en fazla azami canının %10’u kadar.", ja = "贖いの鐘：リニュー、サークル・オブ・ヒーリング、ホーリー・ノヴァ、インスピレーションの回復は、過剰回復も含めて、回復した対象の周囲10メートル以内の最大10体の敵に火花を飛ばします。それぞれ回復量の30%の聖属性ダメージを与え、最大でも自身の最大体力の10%までです。", zh = "救赎之钟：恢复、治疗之环、神圣新星和灵感的治疗（包括过量治疗）会向被治疗目标周围10米内最多10个敌人发射火花。每个火花造成相当于该次治疗量30%的神圣伤害，最多不超过你最大生命值的10%。", ko = "구원의 종: 소생, 치유의 마법진, 신성한 폭발, 영감의 치유는 초과 치유량을 포함하여 치유받은 대상 주변 10미터 안의 최대 10명의 적에게 불꽃을 보냅니다. 각 불꽃은 치유량의 30%를 신성 피해로 주며, 최대 생명력의 10%를 넘지 않습니다." }

[[set_bonus.look]]
visual = 910960
source = 47666
missile_scale = 0.35
impact_scale = 0.1
turn = -30

# 8 pieces, the bell: the same four sources charge it (the hero's own heals after the difficulty, overheal
# included, never a wave), at 60% of the maximum health (rounded up) the next counting heal rings it, then it
# rests 2 sec (charging on). Three waves, 10/20/30 yd, 0.5 sec apart, round where the healed hero stood: each
# heals living heroes `heal` (`{v}`: 10%, empowered 15%) of their maximum health times H and strikes enemies for
# 60% of that on the priest's own maximum health (6%, empowered 9%, times H), knocking normal enemies back
# 4 yd. What a wave heals beyond a hero's missing health becomes a separate bell shield (`shield`, `{v2}`: 50%,
# empowered 75%, of the hero's maximum health, 10 sec, each wave refreshing it) that takes damage before every
# other shield. Renew and Circle of Healing are cast whenever they are ready (`at_full`). The charge is the aura
# of Ring Bessy's Bell (35209) in aura place 49, the waves log as spell 48072.
[[set_bonus]]
key = "priest_mythic_8"
tier = "mythic"
pieces = 8
mechanic = { kind = "heal_bell", sources = ["renew", "circle_of_healing", "holy_nova", "inspiration"], at_full = ["renew", "circle_of_healing"], threshold = 0.6, cooldown = 2.0, radii = [10.0, 20.0, 30.0], gap = 0.5, heal = 0.1, harm = 0.6, knock = 4.0, knock_secs = 0.25, shield = 0.5, shield_secs = 10.0, id = 48072, row = "bell_of_redemption", icon = 35209, slot = 49, empowers = true }
text = { en = "Bell of Redemption: Renew, Circle of Healing and Holy Nova are also cast at full health. Their heals and Inspiration charge the bell, overhealing included. At 60% of your maximum health, your next heal releases three growing waves up to 30 m at the target, at most once every 2 sec; closer targets are hit more than once. Each heals heroes for {v}% of their maximum health, hits enemies for 60% of your wave heal and knocks back normal ones; both scale with your healing power. Overhealing from the waves becomes a shield for 10 sec, up to {v2}% of maximum health.", de = "Geläut der Erlösung: Erneuerung, Kreis der Heilung und Heilige Nova werden auch bei voller Gesundheit gewirkt. Ihre Heilung und Inspiration laden die Glocke, auch Überheilung. Bei 60 % deines maximalen Lebens löst deine nächste Heilung am Ziel drei wachsende Wellen bis 30 m aus, höchstens alle 2 Sek.; wer nah steht, wird mehrfach getroffen. Jede heilt Helden um {v} % ihres maximalen Lebens, trifft Gegner mit 60 % deiner Wellenheilung und stößt normale zurück; beides steigt mit deiner Heilstärke. Überheilung der Wellen wird 10 Sek. lang zum Schild, bis {v2} % des maximalen Lebens.", fr = "Cloche de la rédemption : Rénovation, Cercle de soins et Nova sacrée sont aussi lancés à pleine santé. Leurs soins et Inspiration chargent la cloche, soins excédentaires compris. À 60 % de vos points de vie maximum, votre prochain soin déclenche sur la cible trois vagues grandissantes jusqu’à 30 m, au plus une fois toutes les 2 s ; les cibles proches sont touchées plusieurs fois. Chacune soigne les héros de {v} % de leurs points de vie maximum, inflige aux ennemis 60 % de votre soin de vague et repousse les ennemis normaux ; les deux augmentent avec votre puissance de soins. Les soins excédentaires des vagues deviennent un bouclier pendant 10 s, jusqu’à {v2} % des points de vie maximum.", es = "Campana de la Redención: Renovar, Círculo de sanación y Nova Sagrada también se lanzan con la salud al máximo. Sus curaciones y la Inspiración cargan la campana, incluida la sanación excedente. Al 60 % de tu salud máxima, tu siguiente curación libera tres ondas crecientes de hasta 30 m sobre el objetivo, como máximo una vez cada 2 s; los objetivos cercanos reciben varios golpes. Cada una cura a los héroes un {v} % de su salud máxima, golpea a los enemigos con el 60 % de tu curación de onda y repele a los normales; ambos efectos aumentan con tu poder de curación. La curación excedente de las ondas se convierte en un escudo durante 10 s, de hasta el {v2} % de la salud máxima.", pt = "Sino da Redenção: Renovar, Círculo de Cura e Nova Sagrada também são lançados com a vida cheia. As curas deles e a Inspiração carregam o sino, inclusive o excesso de cura. Com 60% da sua vida máxima, a sua próxima cura libera três ondas crescentes de até 30 m no alvo, no máximo uma vez a cada 2 s; alvos mais próximos são atingidos mais de uma vez. Cada uma cura os heróis em {v}% da vida máxima deles, atinge os inimigos com 60% da sua cura de onda e repele os normais; ambos aumentam com o seu poder de cura. O excesso de cura das ondas vira um escudo por 10 s, de até {v2}% da vida máxima.", ru = "Колокол искупления: Обновление, Круг исцеления и Кольцо света применяются и при полном здоровье. Их исцеление и Вдохновение заряжают колокол, включая избыточное исцеление. При 60% вашего максимального запаса здоровья следующее исцеление выпускает на цель три растущие волны до 30 м, не чаще раза в 2 сек.; тех, кто стоит ближе, задевает несколько раз. Каждая исцеляет героев на {v}% их максимального здоровья, наносит врагам 60% вашего исцеления волны и отбрасывает обычных врагов; оба значения растут вместе с силой исцеления. Избыточное исцеление от волн на 10 сек. превращается в щит, до {v2}% максимального здоровья.", it = "Campana della Redenzione: Rinnovamento, Cerchio di guarigione e Nova sacra vengono lanciati anche a salute piena. Le loro cure e Ispirazione caricano la campana, anche in eccesso. Al 60% della tua salute massima, la tua prossima cura libera tre onde crescenti fino a 30 m sul bersaglio, al massimo una volta ogni 2 s; i bersagli più vicini vengono colpiti più volte. Ognuna cura gli eroi del {v}% della loro salute massima, colpisce i nemici con il 60% della tua cura d’onda e respinge quelli normali; entrambi crescono con il tuo potere di guarigione. La cura in eccesso delle onde diventa uno scudo per 10 s, fino al {v2}% della salute massima.", pl = "Dzwon Odkupienia: Odnowienie, Krąg uzdrowienia i Święta nova są rzucane także przy pełnym zdrowiu. Ich leczenie oraz Natchnienie ładują dzwon, także nadmiar leczenia. Przy 60% twojego maksymalnego zdrowia następne leczenie uwalnia na celu trzy rosnące fale do 30 m, najwyżej raz na 2 s; bliżej stojące cele są trafiane wielokrotnie. Każda leczy bohaterów o {v}% ich maksymalnego zdrowia, zadaje wrogom 60% twojego leczenia fali i odpycha zwykłych; obie wartości rosną wraz z twoją siłą leczenia. Nadmiar leczenia z fal staje się tarczą na 10 s, do {v2}% maksymalnego zdrowia.", tr = "Kurtuluş Çanı: Yenile, Şifa Çemberi ve Kutsal Nova canın doluyken de uygulanır. Bunların iyileştirmeleri ve İlham, fazla iyileştirme de dahil, çanı doldurur. Azami canının %60’ında, bir sonraki iyileştirmen hedefte en fazla 30 m’ye kadar üç büyüyen dalga salar, en fazla 2 sn’de bir; yakındaki hedefler birden çok kez vurulur. Her dalga kahramanları azami canlarının %{v}’si kadar iyileştirir, düşmanlara dalga iyileştirmenin %60’ı kadar vurur ve normal olanları iter; ikisi de iyileştirme gücünle artar. Dalgaların fazla iyileştirmesi 10 sn boyunca azami canın en fazla %{v2}’sine kadar kalkana dönüşür.", ja = "贖いの鐘：リニュー、サークル・オブ・ヒーリング、ホーリー・ノヴァは体力が満タンでも唱えられます。これらの回復とインスピレーションは、過剰回復も含めて鐘をチャージします。最大体力の60%に達すると、次の回復で対象から最大30メートルまで広がる3つの波が放たれ、2秒に1回まで発動します。近くにいる対象は複数回命中します。それぞれ英雄の最大体力の{v}%を回復し、敵に波の回復量の60%のダメージを与え、通常の敵をノックバックします。どちらも回復力に応じて増加します。波の過剰回復は10秒間シールドになり、最大体力の{v2}%までです。", zh = "救赎之钟：恢复、治疗之环和神圣新星在满生命值时也会施放。它们的治疗和灵感（包括过量治疗）会为钟充能。当充能达到你最大生命值的60%时，你的下一次治疗会在目标处释放三道逐渐扩大的波，最远30米，每2秒最多一次；站得较近的目标会被多次命中。每道波为英雄恢复其最大生命值{v}%的生命值，对敌人造成相当于你波治疗量60%的伤害，并击退普通敌人；两者都随你的治疗强度提高。波的过量治疗会转化为持续10秒的护盾，最多相当于最大生命值的{v2}%。", ko = "구원의 종: 소생, 치유의 마법진, 신성한 폭발은 생명력이 가득 차 있어도 시전됩니다. 이들의 치유와 영감은 초과 치유량을 포함하여 종을 충전합니다. 최대 생명력의 60%에 이르면 다음 치유가 대상에게서 최대 30미터까지 퍼지는 커지는 물결 셋을 내보내며, 2초에 한 번만 발동합니다. 가까이 있는 대상은 여러 번 맞습니다. 각 물결은 영웅의 최대 생명력의 {v}%를 치유하고, 적에게 물결 치유량의 60%만큼 피해를 주며, 일반 적을 밀쳐 냅니다. 둘 다 치유력에 따라 증가합니다. 물결의 초과 치유량은 10초 동안 보호막이 되며, 최대 생명력의 {v2}%까지입니다." }
