[[set_bonus]]
key = "paladin_mythic_4"
tier = "mythic"
pieces = 4
scripted = true
text = { en = "Avenger’s Shield chains to up to 6 enemies, with each jump within 10 m of the last hit and dealing 5% less damage than the previous hit.", de = "Schild des Rächers springt auf bis zu 6 Gegner über. Jeder Sprung reicht 10 m vom letzten Treffer und verursacht 5% weniger Schaden als der vorherige Treffer.", fr = "Bouclier du vengeur rebondit sur jusqu’à 6 ennemis. Chaque rebond atteint une cible à 10 m au plus de la dernière et inflige 5% de dégâts de moins que le coup précédent.", es = "Escudo del vengador rebota entre un máximo de 6 enemigos. Cada salto alcanza un objetivo a 10 m o menos del último e inflige un 5% menos de daño que el golpe anterior.", pt = "Escudo do Vingador salta entre até 6 inimigos. Cada salto alcança um alvo a até 10 m do último e causa 5% a menos de dano que o acerto anterior.", ru = "Щит мстителя поражает до 6 врагов. При каждом отскоке цель выбирается в пределах 10 м от предыдущей, а урон снижается на 5% от прошлого попадания.", it = "Scudo del vendicatore rimbalza tra un massimo di 6 nemici. Ogni rimbalzo raggiunge un bersaglio entro 10 m dal precedente e infligge il 5% di danni in meno del colpo precedente.", pl = "Tarcza mściciela odbija się między maksymalnie 6 wrogami. Każde odbicie sięga celu w promieniu 10 m od poprzedniego i zadaje o 5% mniej obrażeń niż poprzednie trafienie.", tr = "İntikamcı Kalkanı en fazla 6 düşmana seker. Her sekme son vuruşun 10 m yakınındaki bir hedefe ulaşır ve önceki vuruştan %5 daha az hasar verir.", ja = "アヴェンジャーズ・シールドが最大6体の敵に連鎖します。各跳躍は直前の命中から10メートル以内で、ダメージは前の命中より5%減少します。", zh = "复仇者之盾最多可在6个敌人之间弹跳，每次跳跃的目标距离上一个目标不超过10码，伤害比上一次降低5%。", ko = "응징의 방패가 적 최대 6명에게 연쇄되며, 매번 마지막 적중 지점에서 10미터 안으로 튀고 이전 적중보다 피해가 5% 줄어듭니다." }

[[set_bonus]]
key = "paladin_mythic_8"
tier = "mythic"
pieces = 8
scripted = true
text = { en = "Each Avenger’s Shield hit triggers Hammer of Reckoning for 50% of the hit’s damage. If the enemy is in Consecration, cast Exorcism on 2 random targets for 70% of the hit’s damage instead.", de = "Jeder Treffer von Schild des Rächers löst Hammer der Rechenschaft für 50% des Trefferschadens aus. Befindet sich der Gegner in Weihe, wird stattdessen Exorzismus auf 2 zufällige Ziele für 70% des Trefferschadens gewirkt.", fr = "Chaque coup de Bouclier du vengeur déclenche Marteau du jugement pour 50% des dégâts du coup. Si l’ennemi est dans Consécration, lance à la place Exorcisme sur 2 cibles aléatoires pour 70% des dégâts du coup.", es = "Cada golpe de Escudo del vengador activa Martillo de la expiación por un 50% del daño del golpe. Si el enemigo está en Consagración, lanza en su lugar Exorcismo sobre 2 objetivos aleatorios por un 70% del daño del golpe.", pt = "Cada acerto de Escudo do Vingador aciona Martelo do Acerto de Contas com 50% do dano do acerto. Se o inimigo estiver em Consagração, lança Exorcismo em 2 alvos aleatórios com 70% do dano do acerto.", ru = "Каждое попадание Щита мстителя вызывает Молот воздаяния, который наносит 50% урона от попадания. Если враг находится в области Освящения, вместо этого на 2 случайные цели накладывается Экзорцизм с уроном в размере 70% урона от попадания.", it = "Ogni colpo di Scudo del vendicatore attiva Martello della resa dei conti per il 50% dei danni del colpo. Se il nemico si trova in Consacrazione, lancia invece Esorcismo su 2 bersagli casuali per il 70% dei danni del colpo.", pl = "Każde trafienie Tarczy mściciela wywołuje Młot Rozrachunku za 50% obrażeń tego trafienia. Jeśli wróg znajduje się w Poświęceniu, zamiast tego rzuca Egzorcyzm na 2 losowe cele za 70% obrażeń trafienia.", tr = "İntikamcı Kalkanı her vuruşta, vuruş hasarının %50’si kadar hasar veren Hesaplaşma Çekici’ni tetikler. Düşman Kutsama alanındaysa bunun yerine 2 rastgele hedefe vuruş hasarının %70’i kadar hasar veren Şeytan Kovma uygulanır.", ja = "アヴェンジャーズ・シールドの各命中が、その命中ダメージの50%でハンマー・オブ・レコニングを発動します。敵がコンセクレーションの中にいる場合は、代わりにランダムな対象2体へ命中ダメージの70%でエクソシズムを唱えます。", zh = "复仇者之盾的每次命中都会触发清算之锤，造成相当于该次伤害50%的伤害。如果敌人处于奉献中，则改为对2个随机目标施放驱邪术，造成相当于该次伤害70%的伤害。", ko = "응징의 방패가 적중할 때마다 청산의 망치가 발동하여 그 피해의 50%를 줍니다. 적이 신성화 안에 있으면 대신 무작위 대상 2명에게 그 피해의 70%로 퇴마술을 시전합니다." }

