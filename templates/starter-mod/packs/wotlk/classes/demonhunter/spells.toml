# The demon hunter's pool; the first is the spell every run starts with. AS has no demon hunter:
# every number is ours, scaled with the rogue's and the monk's spells. `TUNE`
# Spell ids are patch-}'s own, 904001 on (tools/demonhunter-patch.js), each built on a row of the
# Shadowsong client's demon hunter (its Demon's Bite, Chaos Strike, Eye Beam, Throw Glaive, Chaos
# Nova, Metamorphosis) with the Legion icon and an effect of the source's `cfx_demonhunter_*`
# models; 900000-903999 stay the monk's.
#
# Fury and soul fragments (`builds`/`spends`, the class's `resources`): Demon's Bite, Felblade and
# Immolation Aura gather fury, Chaos Strike, Blade Dance and Eye Beam spend it; Shear and Fiery
# Brand gather souls, Soul Cleave and Spirit Bomb spend them. A spender hits the harder (`more`)
# for what it spends, but never waits for it: like every class's, each spell casts on its
# cooldown. Spirit Bomb and Demon Spikes are dealt only with Vengeance's Soul Rending (`needs`).
#
# Schools: chaos as shadow, fel fire as fire.

