# The demonhunter's 8-piece set bonuses: one change to one of its spells per tier (docs/HOWTO-CONTENT.md "A set bonus").

# Ours (TUNE): the family of the original's Common bonus (leaps to 2 more enemies for 50%), on a spell of the class (docs/PLAN-SET-BONUSES.md section 5).
[[set_bonus]]
key = "demonhunter_common_8"
tier = "common"
pieces = 8
text = { en = "Chaos Strike leaps to {v} more enemies for 50% of its damage.", de = "Chaosstoß springt auf {v} weitere Feinde über, für 50% seines Schadens.", fr = "Frappe du chaos bondit sur {v} ennemis de plus pour 50% de ses dégâts.", es = "Golpe del caos salta a {v} enemigos más con un 50% de su daño.", pt = "Golpe do Caos salta para mais {v} inimigos com 50% do seu dano.", ru = "«Удар хаоса» перескакивает на дополнительных врагов ({v}) с 50% урона.", pl = "Cios chaosu przeskakuje na {v} kolejnych wrogów, zadając 50% swoich obrażeń.", tr = "Kaos Darbesi, hasarının %50'i ile {v} düşmana daha sıçrar.", it = "Colpo del caos balza su {v} nemici in più per il 50% dei suoi danni.", ja = "カオス・ストライクが追加で{v}体の敵に飛び移り、そのダメージの50%を与えます。", zh = "混乱打击会跳跃到{v}个额外的敌人身上，造成相当于其伤害50%的伤害。", ko = "혼돈의 일격이 적 {v}명에게 더 튀어 피해의 50%를 줍니다." }

[[set_bonus.part]]
plays = [{ v = 2.0, play = { splash = { keys = ["chaos_strike"], share = 0.5, radius = 8.0 } } }]
whole = true
shows = "v"


