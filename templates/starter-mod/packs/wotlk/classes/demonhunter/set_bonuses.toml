# The demonhunter's Mythic set, Illidari's Pride (the balance team's concept of 2026-11-15, the PDF "DH Exotic
# Mythic Konzept"). `with_set` lets a 4-piece part empower with the set's 8-piece (all eight pieces at 5 stars).
#
# 4 pieces: Demon's Bite hits {v} (4, 6) more targets (a `targets` mod) and deals {v2}% (60, 35) less damage: the
# malus is a `damage_times` of -0.6 (a factor of 0.4) that shrinks to -0.35 when empowered, a window number is
# shown without its sign.
[[set_bonus]]
key = "demonhunter_mythic_4"
tier = "mythic"
pieces = 4
text = { en = "Illidari's Pride: Demon's Bite hits {v} additional targets and deals {v2}% less damage.", de = "Stolz der Illidari: Dämonenbiss trifft {v} zusätzliche Ziele und verursacht {v2}% weniger Schaden.", fr = "Fierté des Illidari : Morsure du démon touche {v} cibles supplémentaires et inflige {v2} % de dégâts en moins.", es = "Orgullo de los Illidari: Mordedura de demonio golpea a {v} objetivos adicionales e inflige un {v2} % menos de daño.", pt = "Orgulho dos Illidari: Mordida do Demônio atinge {v} alvos adicionais e causa {v2}% a menos de dano.", ru = "Гордость Иллидари: «Укус демона» поражает ещё {v} целей, но наносит на {v2}% меньше урона.", pl = "Duma Illidari: Ugryzienie demona trafia {v} dodatkowych celów i zadaje o {v2}% mniej obrażeń.", tr = "Illidari'nin Gururu: Şeytan Isırığı {v} ek hedefe vurur ve %{v2} daha az hasar verir.", it = "Orgoglio degli Illidari: Morso del demone colpisce {v} bersagli aggiuntivi e infligge il {v2}% di danni in meno.", ja = "イリダリの誇り：デーモンズ・バイトが追加で{v}体の対象に命中し、ダメージが{v2}%減少します。", zh = "伊利达雷之傲：恶魔之咬额外击中{v}个目标，造成的伤害降低{v2}%。", ko = "일리다리의 긍지: 악마의 이빨이 대상을 {v}명 더 공격하며 피해가 {v2}% 감소합니다." }

[[set_bonus.part]]
mods = [{ targets = ["demons_bite"] }]
mods_v = 4.0
whole = true
with_set = true
shows = "v"

[[set_bonus.part]]
mods = [{ damage_times = ["demons_bite"] }]
mods_v = -0.6
empowered = -0.35
with_set = true
shows = "v2"
percent = true

# 8 pieces: each Demon's Bite hit has {v}% (5, 7.5) to cast a free Chaos Strike for {v2}% (50, 75) of its hit, at most
# 3 a second; a Chaos Strike crit (cast or free) has a fixed 2% for a free Blade Dance for a fixed 50%, at most
# 2 a second (`proc_cast`).
[[set_bonus]]
key = "demonhunter_mythic_8"
tier = "mythic"
pieces = 8
mechanic = { kind = "proc_cast", spell = "demons_bite", cast = "chaos_strike", chance = 0.05, damage = 0.5, most = 3, empowers = true, then = { cast = "blade_dance", chance = 0.02, damage = 0.5, most = 2 } }
text = { en = "Illidari's Pride: Each Demon's Bite hit has a {v}% chance to cast a free Chaos Strike at {v2}% damage, up to 3 times per second. Chaos Strike critical hits have a 2% chance to cast a free Blade Dance at 50% damage, up to twice per second.", de = "Stolz der Illidari: Jeder Treffer mit Dämonenbiss hat eine Chance von {v}%, einen kostenlosen Chaosstoß mit {v2}% Schaden zu wirken, maximal dreimal pro Sekunde. Kritische Treffer mit Chaosstoß haben eine Chance von 2%, einen kostenlosen Klingentanz mit 50% Schaden zu wirken, maximal zweimal pro Sekunde.", fr = "Fierté des Illidari : chaque coup de Morsure du démon a {v} % de chances de déclencher une Frappe du chaos gratuite à {v2} % de ses dégâts, jusqu’à 3 fois par seconde. Les coups critiques de Frappe du chaos ont 2 % de chances de déclencher une Danse des lames gratuite à 50 % de ses dégâts, au maximum deux fois par seconde.", es = "Orgullo de los Illidari: cada golpe de Mordedura de demonio tiene un {v} % de probabilidad de lanzar un Golpe del caos gratuito al {v2} % de su daño, hasta 3 veces por segundo. Los golpes críticos de Golpe del caos tienen un 2 % de probabilidad de lanzar una Danza de espadas gratuita al 50 % de su daño, hasta dos veces por segundo.", pt = "Orgulho dos Illidari: cada acerto de Mordida do Demônio tem {v}% de chance de lançar um Golpe do Caos gratuito com {v2}% do dano, até 3 vezes por segundo. Acertos críticos de Golpe do Caos têm 2% de chance de lançar uma Dança das Lâminas gratuita com 50% do dano, até duas vezes por segundo.", ru = "Гордость Иллидари: каждое попадание «Укуса демона» с вероятностью {v}% вызывает бесплатный «Удар хаоса» с {v2}% урона, до 3 раз в секунду. Критические попадания «Удара хаоса» с вероятностью 2% вызывают бесплатный «Танец клинков» с 50% урона, до двух раз в секунду.", pl = "Duma Illidari: każde trafienie Ugryzieniem demona ma {v}% szansy na darmowy Cios chaosu zadający {v2}% obrażeń, do 3 razy na sekundę. Krytyczne trafienia Ciosem chaosu mają 2% szansy na darmowy Taniec ostrzy zadający 50% obrażeń, do dwóch razy na sekundę.", tr = "Illidari'nin Gururu: Her Şeytan Isırığı isabeti %{v} ihtimalle %{v2} hasarlı ücretsiz bir Kaos Darbesi kullanır, saniyede en fazla 3 kez. Kaos Darbesi kritik isabetleri %2 ihtimalle %50 hasarlı ücretsiz bir Bıçak Dansı kullanır, saniyede en fazla iki kez.", it = "Orgoglio degli Illidari: ogni colpo di Morso del demone ha il {v}% di probabilità di lanciare gratis un Colpo del caos al {v2}% dei danni, fino a 3 volte al secondo. I colpi critici di Colpo del caos hanno il 2% di probabilità di lanciare gratis una Danza delle lame al 50% dei danni, fino a due volte al secondo.", ja = "イリダリの誇り：デーモンズ・バイトの各命中が{v}%の確率で{v2}%ダメージの無料のカオス・ストライクを唱えます（1秒に3回まで）。カオス・ストライクのクリティカルが2%の確率で50%ダメージの無料のブレード・ダンスを唱えます（1秒に2回まで）。", zh = "伊利达雷之傲：恶魔之咬每次命中有{v}%的几率免费施放一次伤害为{v2}%的混乱打击，每秒最多3次。混乱打击暴击时有2%的几率免费施放一次伤害为50%的刃舞，每秒最多两次。", ko = "일리다리의 긍지: 악마의 이빨이 적중할 때마다 {v}% 확률로 {v2}% 피해의 혼돈의 일격을 무료로 시전하며, 초당 최대 3번입니다. 혼돈의 일격이 치명타로 적중하면 2% 확률로 50% 피해의 칼춤을 무료로 시전하며, 초당 최대 2번입니다." }
