# Ours (TUNE): plan section 5, the PvP bonus: a nova widens in place of striking more (+50% wider, +200% damage, 40% sooner, +100% against held enemies).
[[set_bonus]]
key = "demonhunter_pvp_8"
tier = "pvp"
pieces = 8
text = { en = "Chaos Nova is {v}% wider, deals 200% more damage and comes back 40% sooner, and you deal {v2}% more damage to enemies you stun, root, slow or fear.", de = "Chaosnova ist {v}% weiter, verursacht 200% mehr Schaden und ist 40% früher wieder bereit, und du verursachst {v2}% mehr Schaden an Feinden, die du betäubst, festwurzelst, verlangsamst oder fürchten lässt.", fr = "Nova du chaos est {v}% plus large, inflige 200% de dégâts en plus et revient 40% plus tôt, et vous infligez {v2}% de dégâts en plus aux ennemis que vous étourdissez, immobilisez, ralentissez ou terrifiez.", es = "Nova del caos es un {v}% más amplia, inflige un 200% más de daño y vuelve un 40% antes, y infliges un {v2}% más de daño a los enemigos que aturdes, enraízas, ralentizas o asustas.", pt = "Nova do Caos é {v}% mais ampla, causa 200% mais dano e volta 40% mais cedo, e você causa {v2}% mais dano a inimigos que atordoa, enraíza, retarda ou amedronta.", ru = "Кольцо хаоса шире на {v}%, наносит на 200% больше урона и восстанавливается на 40% быстрее, а вы наносите на {v2}% больше урона противникам, которых оглушаете, обездвиживаете, замедляете или пугаете.", pl = "Nova chaosu jest o {v}% szersza, zadaje o 200% więcej obrażeń i wraca o 40% szybciej, a zadajesz o {v2}% więcej obrażeń wrogom, których ogłuszasz, unieruchamiasz, spowalniasz lub przerażasz.", tr = "Kaos Nova %{v} daha geniştir, %200 daha fazla hasar verir ve %40 daha erken hazır olur, ve sersemlettiğin, köklediğin, yavaşlattığın veya korkuttuğun düşmanlara %{v2} daha fazla hasar verirsin.", it = "Nova del caos è più ampia del {v}%, infligge il 200% di danni in più e ritorna il 40% prima, e infliggi il {v2}% di danni in più ai nemici che stordisci, immobilizzi, rallenti o terrorizzi.", ja = "カオス・ノヴァの範囲が{v}%広がり、ダメージが200%増加し、40%早く再使用できるようになります。さらに、スタン・移動不能・スロー・恐怖状態の敵に与えるダメージが{v2}%増加します。", zh = "混乱新星的范围扩大{v}%，造成的伤害提高200%，冷却速度加快40%，并且你对被昏迷、定身、减速或恐惧的敌人造成的伤害提高{v2}%。", ko = "혼돈의 회오리의 범위가 {v}% 넓어지고, 피해가 200% 증가하며, 40% 더 빨리 돌아옵니다. 또한 기절