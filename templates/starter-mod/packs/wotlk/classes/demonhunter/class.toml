# The 3.3.5a Shadowsong backport supplies the Demon Hunter client models.
# Havoc spends fury and Devourer builds soul fragments to empower Collapsing Star.
# Metamorphosis uses the demon display for the duration of its buff.
key = "demonhunter"
# The `ChrClasses` id, as the Shadowsong client numbers the demon hunter (patch-} adds the row).
id = 13
# Which piece profile (`gear/pieces.toml`) sits in each armor slot, head to hands: the original's
# (class id * 3 + slot) mod 8. A class wears each of the eight once.
piece_profiles = [4, 5, 6, 7, 0, 1, 2, 3]
# Health at level 1: the monk's and a little more, leather and a demon within. `TUNE`
health = 210
# Fury fills the rage bar (the first of its `resources`).
power = "rage"
starter = "demons_bite"
# As Legion's character creation allows them: night elves and blood elves.
races = [4, 10]
# Twin warglaives, as every demon hunter of the Illidari wields them: the Warglaives of Azzinoth
# (3.3.5a's own items, their `Item.dbc` rows below).
starter_weapons = [32837, 32838]
# The legendary dash card: Fel Rush's icon, and what it does.
dash_spell = 904002
dash_legend = { en = "Your dash becomes a Fel Rush: every enemy on your way is burned, and you glide on for a moment after it.", de = "Dein Ausweichsprung wird zum Teufelsansturm: Jeder Feind auf deinem Weg verbrennt, und danach gleitest du noch einen Augenblick weiter.", fr = "Ta ruée devient une Ruée gangrenée : chaque ennemi sur ton chemin est brûlé, et tu glisses encore un instant après.", es = "Tu carrera se convierte en Embestida vil: cada enemigo en tu camino se quema, y después planeas un instante más.", pt = "Sua investida vira uma Investida Vil: todo inimigo no caminho é queimado, e você ainda plana por um instante depois.", ru = "Твой рывок становится Рывком Скверны: каждый враг на пути сгорает, а после него ты еще мгновение скользишь вперед.", pl = "Twój zryw staje się Pędem Zła: każdy przeciwnik na twojej drodze zostaje spalony, a po nim jeszcze chwilę szybujesz.", tr = "Atılman bir Fel Atılışı'na dönüşür: yolundaki her düşman yanar ve sonrasında bir an süzülürsün.", it = "Il tuo scatto diventa una Carica vile: ogni nemico sul tuo cammino viene bruciato e plani ancora per un istante dopo.", ja = "ダッシュがフェル・ラッシュになります：通り道のすべての敵を焼き、その後しばらく滑空します。", zh = "你的冲刺变为邪能冲撞：灼烧路上的每个敌人，并在冲撞后继续滑行片刻。", ko = "돌진이 지옥 돌진이 됩니다: 지나가는 길의 모든 적이 불타며, 돌진 후 잠시 미끄러져 나아갑니다." }
bot_name = "Botillidari"
bot_order = 11
name = { en = "Demon Hunter", de = "Dämonenjäger", fr = "Chasseur de démons", es = "Cazador de demonios", pt = "Caçador de Demônios", ru = "Охотник на демонов", pl = "Łowca Demonów", tr = "Şeytan Avcısı", it = "Cacciatore di Demoni", ja = "デーモンハンター", zh = "恶魔猎手", ko = "악마사냥꾼" }
# Legion's RAID_CLASS_COLORS.DEMONHUNTER (fel violet).
color = [0.64, 0.19, 0.79]
# Played once a hero of the account has beaten The Burning Crusade's last zone; a mode's
# `[unlocks]` may say otherwise.
unlock = "tbc"
# Night elves and blood elves fight in the Shadowsong client's demon hunter bodies: blindfold,
# horns, tattoos and wings (patch-}'s CreatureDisplayInfo rows of `Character\NightElf_Dh\...`
# and `Character\BloodElf_Dh\...`), dressed in the hero's own skin, face, hair and gear.
bodies = [
    [4, 98951, 98952],
    [10, 98953, 98954],
]
# Two warglaives taking turns, as the rogue's daggers do: a swing every 1.2 sec. `TUNE`
swing = { beat = 1.2, dual = true }

