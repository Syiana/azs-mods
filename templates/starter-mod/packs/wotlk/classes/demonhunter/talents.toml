text = { en = "Milestone. Consume replaces Demon's Bite as your starting spell. You also start with Void Ray. Level-up offers can include Collapsing Star. Collapsing Star deals {v}% more damage.", de = "Meilenstein. Verzehren ersetzt Dämonenbiss als Startzauber. Du beginnst auch mit Leerenstrahl. Beim Stufenaufstieg kann Kollabierender Stern angeboten werden. Kollabierender Stern verursacht {v}% mehr Schaden.", fr = "Jalon. Dévorer remplace Morsure du démon au départ. Vous commencez aussi avec Rayon du Vide. Étoile en effondrement peut être proposé au passage de niveau. Étoile en effondrement inflige {v}% de dégâts supplémentaires.", es = "Hito. Consumir sustituye a Mordedura de demonio como hechizo inicial. También empiezas con Rayo del Vacío. Estrella colapsante puede aparecer al subir de nivel. Estrella colapsante inflige un {v}% más de daño.", pt = "Marco. Consumir substitui Mordida do Demônio como feitiço inicial. Você também começa com Raio do Vazio. Estrela em Colapso pode aparecer ao subir de nível. Estrela em Colapso causa {v}% a mais de dano.", ru = "Веха. «Поглощение» заменяет «Укус демона» в начале забега. Вы также начинаете с «Луч Бездны». При повышении уровня может выпасть «Коллапс звезды». Урон способности «Коллапс звезды» увеличивается на {v}%.", it = "Traguardo. Consunzione sostituisce Morso del Demone come incantesimo iniziale. Inizi anche con Raggio del Vuoto. Stella Collassante può comparire quando sali di livello. Stella Collassante infligge il {v}% di danni in più.", pl = "Kamień milowy. Pożarcie zastępuje Ugryzienie Demona na początku. Zaczynasz też ze zdolnością Promień Pustki. Przy awansie może pojawić się Zapadająca się Gwiazda. Zapadająca się Gwiazda zadaje o {v}% więcej obrażeń.", tr = "Dönüm noktası. Başlangıç büyün İblis Isırığı yerine Tüket olur. Ayrıca Hiçlik Işını ile başlarsın. Seviye atlayınca Çöken Yıldız sunulabilir. Çöken Yıldız %{v} daha fazla hasar verir.", ja = "【マイルストーン】最初の呪文がデーモンズ・バイトからコンシュームに変わります。さらにヴォイド・レイを持って始めます。レベルアップの選択肢にコラプシング・スターが出るようになります。コラプシング・スターのダメージが{v}%増加します。", zh = "里程碑：吞噬取代恶魔之咬成为你的初始法术。你还会在开始时拥有虚空射线。升级时提供的卡牌中可能出现坍缩之星。坍缩之星造成的伤害提高{v}%。", ko = "이정표. 시작 주문이 악마의 이빨 대신 집어삼키기가 됩니다. 공허 광선도 가지고 시작합니다. 레벨 업 카드에 붕괴하는 별이 나올 수 있습니다. 붕괴하는 별의 피해가 {v}% 증가합니다." }
