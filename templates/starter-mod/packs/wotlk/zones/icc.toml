# Sites of a dungeon run (`[[zone.site]]`), picked from `py -I tools/dungeon-sites.py` on the
# navmeshes of arenas 1 to 3 (the Frozen Throne and the zone's own arena get none), on each
# arena's own floor (the scout prints its z: 574.4, 508.8 and 578.4; the meshes stack other floors
# over the same x/y). Of the scout's doorways only those that also close the run's walk grid hold:
# a navmesh neck cut by a slope (the Crimson Hall's hollow) gates nothing there, so the doors of
# arenas 1 and 2 sit on narrow floor polygons whose disc closes off a nook on the grid, and their
# pockets are under the scout's default 150 yd2. A door's `along` is the heading (degrees, atan2 of
# y over x) from the arena side of its doorway into the pocket.

