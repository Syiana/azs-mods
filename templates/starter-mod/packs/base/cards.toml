# The kinds of card a hand draws from, three drawn by weight without putting back. A level-up
# (`FUN_145d3b880`): a new spell 1.6 while fewer than three are known, then 0.9; a known spell's
# next rank 1.3. A cache or hoard (17.3): a new piece 0.5, a worn one to grow 2.0, a new amulet
# 2.5, the worn amulet's empowering 1.0.
[[card]]
key = "new_spell"
hand = "spell"
weight = 0.9
early_weight = 1.6
early_below = 3

[[card]]
key = "spell_rank"
hand = "spell"
weight = 1.3

[[card]]
key = "new_jewel"
hand = "jewelry"
weight = 0.5

[[card]]
key = "grow_jewel"
hand = "jewelry"
weight = 2.0

[[card]]
key = "amulet"
hand = "jewelry"
weight = 2.5

[[card]]
key = "empower"
hand = "jewelry"
weight = 1.0

