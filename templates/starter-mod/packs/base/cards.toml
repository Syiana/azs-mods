# A rank card's lines at each rarity (`FUN_145bb59c0`, tables 0x14711259c-0x147112658), compounding
# on what the spell has: damage +, cooldown −, targets +, area +, duration +. A new spell gets one
# line a step below. `letter` is the line's on the `AZSCARDS` wire (`d12`).
[[card_line]]
key = "damage"
letter = "d"
amounts = [18, 25, 34, 46, 65]
# What the card says, `%d` the amount.
text = { en = "+%d%% damage", de = "+%d%% Schaden", fr = "+%d%% de dégâts", es = "+%d%% de daño", pt = "+%d%% de dano", ru = "+%d%% урона", pl = "Obrażenia +%d%%", tr = "+%d%% hasar", it = "+%d%% danni", ja = "ダメージ+%d%%", zh = "伤害+%d%%", ko = "피해 +%d%%" }

