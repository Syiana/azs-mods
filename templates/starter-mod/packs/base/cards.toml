# What the level-up hands and the jewelry offers are dealt with (`upgrades.rs`, `jewelry.rs`).
# The code reads each list by place: every entry below, in this order.

# The rarities, Common to Legendary (`rarity.0`-`rarity.4`). A card's rarity is rolled with the
# weights `coef · x^power`, `x = 1 + luck + min(level/100, 0.3)` plus a hoard's bonus: AS's
# 60 : 25x : 10x² : 4x³ : x⁴ (`FUN_145dbf930`, 17.3). `lines` are a known spell's rank card's
# (`FUN_145d40430`); `jewel_gain` a ring's or trinket's pick times its base (17.2);
# `bonus_scale` a `bonus.*` times its Common amount (`TUNE`); `passive_gain` a passive's rank card
# (Call of Flame) times one step of the passive (`TUNE`, 2026-11-10: a rarer card was worth no more).
[[rarity]]
key = "common"
name = { en = "Common", de = "Gewöhnlich", fr = "Commun", es = "Común", pt = "Comum", ru = "Обычный", pl = "Zwykły", tr = "Sıradan", it = "Comune", ja = "コモン", zh = "普通", ko = "일반" }
# The item quality colour.
color = "ffffff"
weight = [60.0, 0]
lines = 1
jewel_gain = 1.0
bonus_scale = 1.0
passive_gain = 1.0

[[rarity]]
key = "uncommon"
name = { en = "Uncommon", de = "Ungewöhnlich", fr = "Inhabituel", es = "Poco común", pt = "Incomum", ru = "Необычный", pl = "Niezwykły", tr = "Seçkin", it = "Non comune", ja = "アンコモン", zh = "优秀", ko = "고급" }
# The item quality colour.
color = "1eff00"
weight = [25.0, 1]
lines = 1
jewel_gain = 1.4
bonus_scale = 1.5
passive_gain = 1.25

[[rarity]]
