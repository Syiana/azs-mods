name = { en = "Rare", de = "Selten", fr = "Rare", es = "Raro", pt = "Raro", ru = "Редкий", pl = "Rzadki", tr = "Nadir", it = "Raro", ja = "レア", zh = "稀有", ko = "희귀" }
