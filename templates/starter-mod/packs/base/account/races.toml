# The races' bonuses, as Azeroth Survivors' picker lists them (`race.<key>.line1`-`line3`): one
# racial that acts on its own (`active`) and one or two that always hold. The draenei and the
# blood elves are 3.3.5a's and not in AS; their bonuses are the port's own, in AS's manner. So
# are the Worgen's, the Goblins' and the Pandaren's (patch-U's playable rows, Cataclysm's and
# Mists of Pandaria's racials in AS's manner, shown as 3.3.5a spells: Darkflight as Dash, Rocket
# Jump as the Rocket Jump effect, Quaking Palm as Bash). `TUNE` for all.
#
# `racials` are the picker lines' keys as the hero menu has them (the name in lower case, words
# joined by `_`): the active one, then the lasting ones. `third` names the bonuses the third
# line carries; the second carries the rest. The order is the hero menu's.
#
# `male` and `female` are the race's models (`CreatureDisplayInfo.dbc`, `ChrRaces.dbc`'s; the
# worgen's, the goblins' and the pandaren's are patch-U's), `faction` its faction template
# (`ChrRaces.dbc`'s; the worgen ride with the humans, the goblins and the pandaren with the orcs,
# as the Shadowsong client's race 15 does), `side` the war's side it fights
# on (`alliance` or `horde`: which of a faction's spells it is dealt).

