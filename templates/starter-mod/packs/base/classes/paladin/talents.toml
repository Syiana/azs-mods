text = { en = "Milestone. You start every run with Hammer of Justice. Every Consecration raises a shield of {v}% of your maximum health, stacking up to 30% (39% with Blessed Life), and while a shield holds, you deal 20% more damage.", de = "Meilenstein. Du beginnst jeden Lauf mit Hammer der Gerechtigkeit. Jede Weihe errichtet einen Schild von {v}% deiner maximalen Gesundheit, stapelbar bis 30% (39% mit Gesegnetes Leben), und solange ein Schild hält, verursachst du 20% mehr Schaden.", fr = "Jalon. Tu commences chaque partie avec Marteau de la justice. Chaque Consécration dresse un bouclier de {v}% de tes points de vie maximums, cumulable jusqu'à 30% (39% avec Vie bénie), et tant qu'un bouclier tient, tu infliges 20% de dégâts en plus.", es = "Hito. Empiezas cada partida con Martillo de justicia. Cada Consagración levanta un escudo del {v}% de tu salud máxima, acumulable hasta el 30% (39% con Vida bendita), y mientras un escudo aguante, infliges un 20% más de daño.", pt = "Marco. Você começa cada partida com Martelo da Justiça. Cada Consagração ergue um escudo de {v}% da sua vida máxima, acumulável até 30% (39% com Vida Abençoada), e enquanto um escudo se mantém, você causa 20% a mais de dano.", ru = "Веха. Ты начинаешь каждый забег с Молота правосудия. Каждое Освящение возводит щит в {v}% твоего максимального здоровья, суммируется до 30% (39% с Благословенной жизнью), и пока щит держится, ты наносишь на 20% больше урона.", pl = "Kamień milowy. Każdą rozgrywkę zaczynasz z Młotem sprawiedliwości. Każde Poświęcenie wznosi tarczę o wartości {v}% twojego maksymalnego zdrowia, kumulującą się do 30% (39% z Błogosławionym życiem), a gdy tarcza trzyma, zadajesz o 20% więcej obrażeń.", tr = "Dönüm noktası. Her oyuna Adalet Çekici ile başlarsın. Her Kutsama azami canının {v}%'si kadar bir kalkan kaldırır, en fazla 30%'a kadar birikir (Kutsanmış Hayat ile 39%) ve kalkan dururken 20% daha fazla hasar verirsin.", it = "Traguardo. Inizi ogni partita con Martello della giustizia. Ogni Consacrazione erige uno scudo pari al {v}% della tua salute massima, cumulabile fino al 30% (39% con Vita benedetta), e finché uno scudo regge infliggi il 20% di danni in più.", ja = "【マイルストーン】毎ランをハンマー・オブ・ジャスティスを持って始めます。コンセクレーションのたびに最大体力の{v}%のシールドが張られ、30%まで重ねられます（ブレスド・ライフがあれば39%）。シールドがある間、与えるダメージが20%増加します。", zh = "里程碑：你在每场对局开始时拥有制裁之锤。每次奉献都会生成一个吸收相当于你最大生命值{v}%伤害的护盾，最多叠加至30%（拥有祝福生命时为39%），护盾存在期间，你造成的伤害提高20%。", ko = "이정표. 모든 런을 심판의 망치를 가지고 시작합니다. 신성화마다 최대 생명력의 {v}%에 해당하는 보호막이 생기며 최대 30%(축복받은 생명이 있으면 39%)까지 중첩됩니다. 보호막이 유지되는 동안 주는 피해가 20% 증가합니다." }
menu_v = 0.1
plays = [
    # Its text's share is unread: Fortified's. `TUNE`
    { v = 0.1, play = { shield_stack = { keys = ["consecration"], cap = 0.3 } } },
]

