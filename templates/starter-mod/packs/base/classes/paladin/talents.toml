text = { en = "A blow that would kill you leaves you at 30% health instead, wrapped in a free Divine Shield and a free Consecration. Once every 90 sec.", de = "Ein Hieb, der dich töten würde, lässt dich stattdessen mit 30% Gesundheit zurück, gehüllt in ein kostenloses Gottesschild und eine kostenlose Weihe. Einmal alle 90 Sek.", fr = "Un coup qui te tuerait te laisse à 30% de vie, enveloppé d'un Bouclier divin gratuit et d'une Consécration gratuite. Une fois toutes les 90 s.", es = "Un golpe que te mataría te deja con el 30% de salud, envuelto en un Escudo divino gratis y una Consagración gratis. Una vez cada 90 s.", pt = "Um golpe que mataria você o deixa com 30% de vida, envolto em um Escudo Divino grátis e uma Consagração grátis. Uma vez a cada 90 s.", ru = "Удар, который убил бы тебя, оставляет тебе 30% здоровья, укутывая бесплатным Божественным щитом и бесплатным Освящением. Раз в 90 сек.", pl = "Cios, który by cię zabił, zostawia cię przy 30% zdrowia, w darmowej Boskiej tarczy i darmowym Poświęceniu. Raz na 90 s.", tr = "Seni öldürecek bir darbe, seni 30% canla bırakır; bedava bir İlahi Kalkan ve bedava bir Kutsama ile sarılırsın. 90 sn'de bir.", it = "Un colpo che ti ucciderebbe ti lascia invece al 30% di salute, avvolto in uno Scudo divino e in una Consacrazione gratuiti. Una volta ogni 90 s.", ja = "致命的な一撃を受けると代わりに体力30%で踏みとどまり、無料のディヴァイン・シールドと無料のコンセクレーションに包まれます。90秒に1回まで。", zh = "致命的一击会使你保留30%的生命值，并为你施放一次免费的圣盾术和一次免费的奉献。每90秒一次。", ko = "치명적인 일격을 받으면 대신 생명력 30%로 남으며, 천상의 보호막과 신성화가 무료로 펼쳐집니다. 90초에 한 번 발동합니다." }
