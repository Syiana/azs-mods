[[talent]]
key = "hammer_righteous"
tree = 1
row = 6
col = 1
ranks = 1
effects = [{ stat = [2, 0.15] }]
icon = "Spell_Holy_BlessingOfProtection"
name = { en = "Hammer of the Righteous", de = "Hammer der Rechtschaffenen", fr = "Marteau du vertueux", es = "Martillo del recto", pt = "Martelo do Íntegro", ru = "Молот праведника", pl = "Młot praworządnych", tr = "Doğruların Çekici", it = "Martello del Giusto", ja = "ハンマー・オブ・ザ・ライチャス", zh = "正义之锤", ko = "정의의 망치" }
text = { en = "Capstone. Your maximum health is 15% higher, every spell you cast deals an extra 1% of your maximum health, Hammer of Justice also strikes for 1.5% of its target's maximum health, and a shield that breaks bursts in holy light: half of what it absorbed, up to half the most it held, strikes every enemy within 10 yd.", de = "Schlussstein. Deine maximale Gesundheit ist 15% höher, jeder Zauber, den du wirkst, verursacht zusätzlich 1% deiner maximalen Gesundheit, Hammer der Gerechtigkeit trifft zudem für 1,5% der maximalen Gesundheit seines Ziels, und ein brechender Schild zerbirst in heiligem Licht: die Hälfte dessen, was er absorbiert hat, bis zur Hälfte seines Höchstwerts, trifft jeden Feind im Umkreis von 10 m.", fr = "Clé de voûte. Tes points de vie maximums augmentent de 15%, chaque sort que tu lances inflige en plus 1% de tes points de vie maximums, Marteau de la justice frappe aussi pour 1,5% des points de vie maximums de sa cible, et un bouclier qui se brise éclate en lumière sacrée : la moitié de ce qu'il a absorbé, jusqu'à la moitié de son maximum, frappe chaque ennemi à moins de 10 m.", es = "Piedra angular. Tu salud máxima aumenta un 15%, cada hechizo que lanzas inflige además un 1% de tu salud máxima, Martillo de justicia también golpea con el 1,5% de la salud máxima de su objetivo, y un escudo que se rompe estalla en luz sagrada: la mitad de lo que absorbió, hasta la mitad de su máximo, golpea a cada enemigo a menos de 10 m.", pt = "Pedra angular. Sua vida máxima é 15% maior, cada feitiço que você lança causa adicionalmente 1% da sua vida máxima, Martelo da Justiça também golpeia com 1,5% da vida máxima do alvo, e um escudo que se quebra explode em luz sagrada: metade do que absorveu, até metade do seu máximo, atinge cada inimigo a até 10 m.", ru = "Вершина. Твое максимальное здоровье выше на 15%, каждое твое заклинание наносит дополнительно 1% максимального здоровья, Молот правосудия также бьет на 1,5% максимального здоровья цели, а разбитый щит взрывается священным светом: половина поглощенного им урона, но не больше половины его максимума, поражает каждого врага в радиусе 10 м.", pl = "Zwieńczenie. Twoje maksymalne zdrowie jest o 15% wyższe, każdy rzucony czar zadaje dodatkowo 1% twojego maksymalnego zdrowia, Młot sprawiedliwości uderza też za 1,5% maksymalnego zdrowia celu, a pękająca tarcza wybucha świętym światłem: połowa pochłoniętych obrażeń, do połowy jej maksymalnej wartości, uderza każdego przeciwnika w promieniu 10 m.", tr = "Zirve. Azami canın 15% yüksektir, yaptığın her büyü azami canının fazladan 1%'i kadar hasar verir, Adalet Çekici ayrıca hedefinin azami canının 1,5%'i kadar vurur ve kırılan kalkan kutsal ışıkla patlar: emdiğinin yarısı, tuttuğu en yüksek miktarın yarısına kadar, 10 m içindeki her düşmana vurur.", it = "Vertice. La tua salute massima è più alta del 15%, ogni incantesimo che lanci infligge un ulteriore 1% della tua salute massima, Martello della giustizia colpisce anche per l'1,5% della salute massima del bersaglio e uno scudo che si rompe esplode in luce sacra: metà di ciò che ha assorbito, fino a metà del massimo che ha retto, colpisce ogni nemico entro 10 m.", ja = "【キャップストーン】最大体力が15%増加し、呪文を唱えるたびに最大体力の1%の追加ダメージを与え、ハンマー・オブ・ジャスティスは対象の最大体力の1.5%のダメージも与えます。さらにシールドが壊れると聖なる光が炸裂し、吸収した量の半分（保持していた最大量の半分まで）が10ヤード以内のすべての敵に命中します。", zh = "终极天赋：你的最大生命值提高15%，你施放的每个法术额外造成相当于你最大生命值1%的伤害，制裁之锤还会造成相当于目标最大生命值1.5%的伤害，护盾破碎时会迸发圣光：将其吸收量的一半（最多为其最大吸收量的一半）作为伤害，打击10码内的所有敌人。", ko = "궁극 특성. 최대 생명력이 15% 증가하고, 주문을 시전할 때마다 최대 생명력의 1%만큼 추가 피해를 주며, 심판의 망치가 대상의 최대 생명력의 1.5%만큼 추가 피해를 줍니다. 보호막이 깨지면 신성한 빛으로 터집니다: 흡수한 양의 절반이 최대 흡수량의 절반까지 10미터 안의 모든 적에게 피해를 줍니다." }
