# The paladin's run sets dressed as the real sets they are named after (`[[set_look]]`,
# docs/HOWTO-CONTENT.md "A set look"): its pieces of each rarity show these displays and icons. A
# piece is (gear slot 0-7 head to hands, ItemDisplayInfo id, InventoryType, icon without INV_),
# read off the client's ItemSet.dbc, Item.dbc and ItemDisplayInfo.dbc (3.3.5a). The Common set
# ("Squire's") is no real set and keeps its armor kind's icons. The PvP set has no belt and no
# bracers: those two keep their armor kind's icons too.

# Lightforge pieces: Lightforge Armor, tier 0 (ItemSet 188).
[[set_look]]
key = "paladin_uncommon"
rarity = 1
pieces = [
    [0, 31207, 1, "Helmet_08"], [1, 29971, 3, "Shoulder_10"],
    [2, 29969, 5, "Chest_Plate03"], [3, 29966, 6, "Belt_11"],
    [4, 29972, 7, "Pants_04"], [5, 29967, 8, "Boots_Plate_03"],
    [6, 29968, 9, "Bracer_14"], [7, 29970, 10, "Gauntlets_19"],
]

