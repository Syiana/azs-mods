    2361, # Battleworn Hammer
]
# The legendary dash card: the class dash's spell for its icon, and what it does.
dash_spell = 1044
dash_legend = { en = "Divine Steed's holy ground lasts twice as long and burns the enemies in it.", de = "Der heilige Boden von Göttliches Ross hält doppelt so lange und verbrennt die Feinde darin.", fr = "Le sol sacré du Destrier divin dure deux fois plus longtemps et brûle les ennemis qui s'y trouvent.", es = "El suelo sagrado de Corcel divino dura el doble y quema a los enemigos que hay en él.", pt = "O solo sagrado do Corcel Divino dura o dobro e queima os inimigos que estão nele.", ru = "Священная земля Божественного скакуна держится вдвое дольше и обжигает врагов на ней.", pl = "Święta ziemia Boskiego rumaka trwa dwa razy dłużej i pali stojących na niej przeciwników.", tr = "İlahi At'ın kutsal zemini iki kat uzun sürer ve içindeki düşmanları yakar.", it = "Il terreno sacro di Destriero divino dura il doppio e brucia i nemici al suo interno.", ja = "ディヴァイン・スティードの聖なる大地の持続時間が2倍になり、その上の敵を焼きます。", zh = "神圣战马留下的圣地持续时间翻倍，并会灼烧其中的敌人。", ko = "신성한 군마의 신성한 땅이 두 배 오래 지속되고 그 위의 적을 불태웁니다." }
