text = { en = "Milestone. You start every run with Shadow Word: Pain instead of Smite, and its ticks have a {v}% chance to loose a shadowy apparition: a free Mind Blast, at most twice a second.", de = "Meilenstein. Du beginnst jeden Lauf mit Schattenwort: Schmerz statt Göttlicher Pein, und seine Ticks haben eine Chance von {v}%, eine schattenhafte Erscheinung freizusetzen: ein kostenloser Gedankenschlag, höchstens zweimal pro Sekunde.", fr = "Jalon. Tu commences chaque partie avec Mot de l'ombre : Douleur au lieu de Châtiment, et ses impulsions ont {v}% de chances de libérer une apparition de l'ombre : une Attaque mentale gratuite, au plus deux fois par seconde.", es = "Hito. Empiezas cada partida con Palabra de las Sombras: Dolor en lugar de Aplastar, y sus pulsos tienen un {v}% de probabilidad de soltar una aparición sombría: una Explosión mental gratis, como máximo dos veces por segundo.", pt = "Marco. Você começa cada partida com Palavra da Sombra: Dor em vez de Punição, e seus pulsos têm {v}% de chance de soltar uma aparição sombria: um Ataque Mental grátis, no máximo duas vezes por segundo.", ru = "Веха. Ты начинаешь каждый забег со Слова Тьмы: Боль вместо Кары, и его такты с вероятностью {v}% выпускают теневое видение: бесплатный Взрыв разума, не чаще двух раз в секунду.", pl = "Kamień milowy. Każdą rozgrywkę zaczynasz ze Słowem Cienia: Ból zamiast Kary, a jego tyknięcia mają {v}% szansy, by wypuścić cienistą zjawę: darmową Eksplozję umysłu, najwyżej dwa razy na sekundę.", tr = "Dönüm noktası. Her oyuna Cezalandır yerine Gölge Sözü: Acı ile başlarsın ve vuruşları {v}% ihtimalle bir gölge hayalet salar: bedava bir Zihin Patlaması, saniyede en fazla iki kez.", it = "Traguardo. Inizi ogni partita con Parola dell'Ombra: Dolore invece di Punire e i suoi tick hanno il {v}% di probabilità di liberare un'apparizione d'ombra: un'Esplosione mentale gratuita, al massimo due volte al secondo.", ja = "【マイルストーン】毎ランをスマイトの代わりにシャドウ・ワード：ペインを持って始め、その各ティックが{v}%の確率で影の幻影を解き放ちます：無料