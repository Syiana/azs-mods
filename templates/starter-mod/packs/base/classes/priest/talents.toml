text = { en = "Capstone. You take on Shadowform for the whole run, and when an enemy dies with Shadow Word: Pain on it, it bursts for {v}% of its maximum health on everything within 6 yd and the pain jumps to the enemy nearest it.", de = "Schlussstein. Du nimmst für den ganzen Lauf Schattengestalt an, und wenn ein Feind mit Schattenwort: Schmerz stirbt, zerbirst er für {v}% seiner maximalen Gesundheit auf alles im Umkreis von 6 m, und der Schmerz springt auf den nächsten Feind über.", fr = "Clé de voûte. Tu prends la Forme d'ombre pour toute la partie, et quand un ennemi meurt sous Mot de l'ombre : Douleur, il éclate pour {v}% de ses points de vie maximums sur tout ce qui est à moins de 6 m, et la douleur saute sur l'ennemi le plus proche.", es = "Piedra angular. Adoptas la Forma de las Sombras durante toda la partida, y cuando un enemigo muere con Palabra de las Sombras: Dolor, estalla con un {v}% de su salud máxima sobre todo lo que haya a menos de 6 m y el dolor salta al enemigo más cercano.", pt = "Pedra angular. Você assume a Forma Sombria durante toda a partida, e quando um inimigo morre com Palavra da Sombra: Dor, ele explode com {v}% da vida máxima dele em tudo a até 6 m, e a dor salta para o inimigo mais próximo.", ru = "Вершина. Ты принимаешь Облик Тьмы на весь забег, и когда умирает враг со Словом Тьмы: Боль, он взрывается на {v}% своего максимального здоровья по всем в радиусе 6 м, а боль перескакивает на ближайшего врага.", pl = "Zwieńczenie. Przyjmujesz Postać cienia na całą rozgrywkę, a gdy umiera przeciwnik ze Słowem Cienia: Ból, wybucha za {v}% swojego maksymalnego zdrowia, raniąc wszystko w promieniu 6 m, a ból przeskakuje na najbliższego przeciwnika.", tr = "Zirve. Tüm oyun boyunca Gölge Biçimi'ne bürünürsün ve üzerinde Gölge Sözü: Acı olan bir düşman ölünce azami canının {v}%'si kadar 6 m içindeki her şeye patlar ve acı ona en yakın düşmana sıçrar.", it = "Vertice. Assumi la Forma d'Ombra per tutta la partita e quando un nemico muore con Parola dell'Ombra: Dolore addosso, esplode per il {v}% della sua salute massima su tutto entro 6 m e il dolore passa al nemico più vicino.", ja = "【キャップストーン】ラン中ずっとシャドウフォームになります。シャドウ・ワード：ペインがかかった敵が死ぬと炸裂して6ヤード以内のすべてに最大体力の{v}%のダメージを与え、ペインは最も近い敵に飛び移ります。", zh = "终极天赋：你在整场对局中保持暗影形态，身上带有暗言术：痛的敌人死亡时会爆发，对6码内的所有目标造成相当于其最大生命值{v}%的伤害，并且痛苦会跳到离它最近的敌人身上。", ko = "궁극 특성. 런 내내 어둠의 형상을 유지하며, 어둠의 권능: 고통에 걸린 적이 죽으면 터져서 6미터 안의 모든 대상에게 그 적의 최대 생명력의 {v}%만큼 피해를 주고, 고통이 가장 가까운 적에게 옮겨 갑니다." }
