# The priest's run sets dressed as the real sets they are named after (`[[set_look]]`,
# docs/HOWTO-CONTENT.md "A set look"): its pieces of each rarity show these displays and icons. A
# piece is (gear slot 0-7 head to hands, ItemDisplayInfo id, InventoryType, icon without INV_),
# read off the client's ItemSet.dbc, Item.dbc and ItemDisplayInfo.dbc (3.3.5a). The Common set
# ("Acolyte's") is no real set and keeps its armor kind's icons. The PvP set has no belt and no
# bracers: those two keep their armor kind's icons too.

# Devout pieces: Vestments of the Devout, tier 0 (ItemSet 182).
[[set_look]]
key = "priest_uncommon"
rarity = 1
pieces = [
    [0, 31104, 1, "Crown_01"], [1, 31103, 3, "Shoulder_02"],
    [2, 30422, 20, "Chest_Cloth_11"], [3, 30425, 6, "Belt_10"],
    [4, 30424, 7, "Pants_08"], [5, 30430, 8, "Boots_05"],
    [6, 30426, 9, "Belt_31"], [7, 30427, 10, "Gauntlets_14"],
]

