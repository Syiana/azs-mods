# The druid's run sets dressed as the real sets they are named after (`[[set_look]]`,
# docs/HOWTO-CONTENT.md "A set look"): its pieces of each rarity show these displays and icons. A
# piece is (gear slot 0-7 head to hands, ItemDisplayInfo id, InventoryType, icon without INV_),
# read off the client's ItemSet.dbc, Item.dbc and ItemDisplayInfo.dbc (3.3.5a). The Common set
# ("Thicket") is no real set and keeps its armor kind's icons. The PvP set has no belt and no
# bracers: those two keep their armor kind's icons too.

# Wildheart pieces: Wildheart Raiment, tier 0 (ItemSet 185).
[[set_look]]
key = "druid_uncommon"
rarity = 1
pieces = [
    [0, 31228, 1, "Helmet_27"], [1, 30412, 3, "Shoulder_01"],
    [2, 29974, 5, "Chest_Plate06"], [3, 29976, 6, "Belt_15"],
    [4, 29975, 7, "Pants_08"], [5, 29981, 8, "Boots_08"],
    [6, 29977, 9, "Bracer_09"], [7, 29979, 10, "Gauntlets_17"],
]

