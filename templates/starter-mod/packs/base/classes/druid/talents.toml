加、被ダメージ8%減少。毎ランをシュレッドを持って始め、シュレッドとスワイプが命中したすべての敵は6秒かけてその攻撃の{v}%分出血します。", zh = "里程碑：你的毛皮变得更厚：最大生命值提高20%，受到的伤害降低8%。你在每场对局开始时拥有撕碎，被撕碎和横扫击中的目标会在6秒内流血，造成相当于该次攻击{v}%的伤害。", ko = "이정표. 가죽이 두꺼워집니다: 최대 생명력이 20% 증가하고 받는 피해가 8% 감소합니다. 모든 런을 칼날 발톱을 가지고 시작하며, 칼날 발톱과 휘둘러치기에 맞은 모든 적이 6초에 걸쳐 그 피해의 {v}%만큼 출혈 피해를 입습니다." }
