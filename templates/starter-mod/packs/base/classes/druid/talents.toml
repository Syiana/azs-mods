a kısadır. Her oyuna Gazap yerine Parçala ile başlarsın.\nKorkunç Ayı Biçimi'ni dışlar.", it = "Vertice. Combatti in Forma di gatto: 10% di danni in più, 10% di probabilità di colpo critico in più e movimento più veloce del 15%; la ricarica di Dilaniare è più breve del 20%. Inizi ogni partita con Dilaniare invece di Ira.\nEsclude Forma di orso imponente.", ja = "【キャップストーン】キャット・フォームで戦います：ダメージ10%増加、クリティカル率10%増加、移動速度15%上昇、シュレッドのクールダウン20%短縮。毎ランをラースの代わりにシュレッドを持って始めます。\nダイア・ベア・フォームとは両立できません。", zh = "终极天赋：你以猎豹形态作战：伤害提高10%，暴击几率提高10%，移动速度提高15%，撕碎的冷却时间缩短20%。你在每场对局开始时拥有撕碎而非愤怒。\n与巨熊形态互斥。", ko = "궁극 특성. 표범 변신 상태로 싸웁니다: 피해가 10%, 치명타율이 10%, 이동 속도가 15% 증가하고, 칼날 발톱의 재사용 대기시간이 20% 감소합니다. 모든 런을 천벌 대신 칼날 발톱을 가지고 시작합니다.\n광포한 곰 변신과 함께 선택할 수 없습니다." }
