# The model every client sees in the form: the night elf's, the tauren's (race 6) own.
form = { id = 8, display = 2281, races = [[6, 2289]] }
icon = "Ability_Racial_BearForm"
name = { en = "Dire Bear Form", de = "Terrorbärengestalt", fr = "Forme d'ours redoutable", es = "Forma de oso temible", pt = "Forma de Urso Atroz", ru = "Облик лютого медведя", pl = "Forma niedźwiedzia", tr = "Korkunç Ayı Biçimi", it = "Forma di orso imponente", ja = "ダイア・ベア・フォーム", zh = "巨熊形态", ko = "광포한 곰 변신" }
text = { en = "Capstone. You fight in Dire Bear Form: 25% more maximum health and 10% less damage taken. A free Swipe tears around you every 3 sec, and every enemy Swipe hits heals you for 0.3% of your maximum health. You start every run with Shred instead of Wrath.\nRules out Cat Form.", de = "Schlussstein. Du kämpfst in Terrorbärengestalt: 25% mehr maximale Gesundheit und 10% weniger erlittener Schaden. Alle 3 Sek. reißt ein kostenloser Prankenhieb um dich herum, und jeder von Prankenhieb getroffene Feind heilt dich um 0,3% deiner maximalen Gesundheit. Du beginnst jeden Lauf mit Schreddern statt Zorn.\nSchließt Katzengestalt aus.", fr = "Apogée. Tu combats en forme d'ours redoutable : 25% de santé maximale en plus et 10% de dégâts subis en moins. Un Balayage gratuit déchire autour de toi toutes les 3 s, et chaque ennemi touché par Balayage te soigne de 0,3% de ta santé maximale. Tu commences chaque partie avec Lambeau au lieu de Colère.\nExclut la forme de félin.", es = "Cúspide. Luchas en forma de oso temible: 25% más de salud máxima y 10% menos de daño recibido. Un Vapuleo gratis desgarra a tu alrededor cada 3 s, y cada enemigo alcanzado por Vapuleo te cura un 0,3% de tu salud máxima. Empiezas cada partida con Triturar en lugar de Cólera.\nExcluye la forma de felino.", pt = "Ápice. Você luta na Forma de Urso Atroz: 25% a mais de vida máxima e 10% a menos de dano sofrido. Um Golpe Giratório grátis rasga ao seu redor a cada 3 s, e cada inimigo atingido por Golpe Giratório cura você em 0,3% da sua vida máxima. Você começa cada partida com Dilacerar em vez de Ira.\nExclui a Forma de Gato.", ru = "Вершина. Ты сражаешься в облике лютого медведя: на 25% больше макс. здоровья и на 10% меньше получаемого урона. Каждые 3 сек. вокруг тебя рвет бесплатный «Взмах», а каждый враг, задетый «Взмахом», лечит тебя на 0,3% макс. здоровья. Каждый забег ты начинаешь с «Полоснуть» вместо «Гнева».\nИсключает облик кошки.", pl = "Zwieńczenie. Walczysz w formie niedźwiedzia: 25% więcej maksymalnego zdrowia i 10% mniej otrzymywanych obrażeń. Darmowe Smagnięcie rozrywa wszystko wokół ciebie co 3 s, a każde trafienie Smagnięciem leczy cię o 0,3% maksymalnego zdrowia. Każdą rozgrywkę zaczynasz z Rozszarpaniem zamiast Gniewu.\nWyklucza formę kota.", tr = "Zirve. Korkunç Ayı Biçimi'nde savaşırsın: 25% daha fazla azami can ve 10% daha az hasar. Her 3 sn'de çevrende bedava bir Pençe Darbesi savrulur ve düşmana isabet eden her Pençe Darbesi azami canının 0,3%'ü kadar iyileştirir. Her oyuna Gazap yerine Parçala ile başlarsın.\nKedi Biçimi'ni dışlar.", it = "Vertice. Combatti in Forma di orso imponente: 25% di salute massima in più e 10% di danni subiti in meno. Una Spazzata gratuita squarcia attorno a te ogni 3 s e ogni nemico colpito da Spazzata ti cura dello 0,3% della tua salute massima. Inizi ogni partita con Dilaniare invece di Ira.\nEsclude Forma di gatto.", ja = "【キャップストーン】ダイア・ベア・フォームで戦います：最大体力25%増加、被ダメージ10%減少。3秒ごとに無料のスワイプが周囲を引き裂き、スワイプが命中した敵1体ごとに最大体力の0.3%を回復します。毎ランをラースの代わりにシュレッドを持って始めます。\nキャット・フォームとは両立できません。", zh = "终极天赋：你以巨熊形态作战：最大生命值提高25%，受到的伤害降低10%。每3秒在你周围施放一次免费的横扫，横扫每击中一个敌人，为你恢复相当于最大生命值0.3%的生命值。你在每场对局开始时拥有撕碎而非愤怒。\n与猎豹形态互斥。", ko = "궁극 특성. 광포한 곰 변신 상태로 싸웁니다: 최대 생명력이 25% 증가하고 받는 피해가 10% 감소합니다. 3초마다 휘둘러치기가 무료로 주위를 할퀴며, 휘둘러치기에 맞은 적 하나마다 최대 생명력의 0.3%를 회복합니다. 모든 런을 천벌 대신 칼날 발톱을 가지고 시작합니다.\n표범 변신과 함께 선택할 수 없습니다." }
plays = [
    { v = 3.0, play = { every = "swipe" } },
    { v = 0.003, play = { hit_heal = ["swipe"] } },
]

