text = { en = "Capstone. You start every run with Backstab instead of Sinister Strike, and Backstab and Eviscerate splash {v}% of their damage onto every enemy within 5 yd of their target.", de = "Schlussstein. Du beginnst jeden Lauf mit Meucheln statt Finsterem Stoß, und Meucheln und Ausweiden verteilen {v}% ihres Schadens auf jeden Feind im Umkreis von 5 m um ihr Ziel.", fr = "Clé de voûte. Tu commences chaque partie avec Attaque dans le dos au lieu d'Attaque pernicieuse, et Attaque dans le dos et Éviscération répartissent {v}% de leurs dégâts sur chaque ennemi à moins de 5 m de leur cible.", es = "Piedra angular. Empiezas cada partida con Puñalada trapera en lugar de Golpe siniestro, y Puñalada trapera y Eviscerar reparten un {v}% de su daño entre todos los enemigos a menos de 5 m de su objetivo.", pt = "Pedra angular. Você começa cada partida com Punhalada em vez de Golpe Sinistro, e Punhalada e Estripar espalham {v}% do seu dano por cada inimigo a até 5 m do alvo.", ru = "Вершина. Ты начинаешь каждый забег с Удара в спину вместо Коварного удара, и Удар в спину и Потрошение распределяют {v}% своего урона на каждого врага в радиусе 5 м от цели.", pl = "Zwieńczenie. Każdą rozgrywkę zaczynasz z Ciosem w plecy zamiast Złowieszczego uderzenia, a Cios w plecy i Patroszenie rozchlapują {v}% swoich obrażeń na każdego przeciwnika w promieniu 5 m od celu.", tr = "Zirve. Her oyuna Uğursuz Darbe yerine Sırtından Bıçak ile başlarsın; Sırtından Bıçak ve Deşme hasarlarının {v}%'sini hedeflerinin 5 m çevresindeki her düşmana sıçratır.", it = "Vertice. Inizi ogni partita con Pugnalata alle spalle invece di Colpo sinistro, e Pugnalata alle spalle ed Eviscerazione riversano il {v}% dei loro danni su ogni nemico entro 5 m dal bersaglio.", ja = "【キャップストーン】毎ランをシニスター・ストライクの代わりにバックスタブを持って始め、バックスタブとエヴィセレートが対象の5ヤード以内のすべての敵にそのダメージの{v}%を飛び散らせます。", zh = "终极天赋：你在每场对局开始时拥有背刺而非邪恶攻击，背刺和剔骨会将其伤害的{v}%溅射到目标5码内的所有敌人身上。", ko = "궁극 특성. 모든 런을 사악한 일격 대신 기습을 가지고 시작하며, 기습과 절개가 대상 주위 5미터 안의 모든 적에게 피해의 {v}%를 튀깁니다." }
