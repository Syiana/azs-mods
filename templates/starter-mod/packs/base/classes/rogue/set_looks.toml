# The rogue's run sets dressed as the real sets they are named after (`[[set_look]]`,
# docs/HOWTO-CONTENT.md "A set look"): its pieces of each rarity show these displays and icons. A
# piece is (gear slot 0-7 head to hands, ItemDisplayInfo id, InventoryType, icon without INV_),
# read off the client's ItemSet.dbc, Item.dbc and ItemDisplayInfo.dbc (3.3.5a). The Common set
# ("Footpad's") is no real set and keeps its armor kind's icons. The PvP set has no belt and no
# bracers: those two keep their armor kind's icons too.

# Shadowcraft pieces: Shadowcraft Armor, tier 0 (ItemSet 184).
[[set_look]]
key = "rogue_uncommon"
rarity = 1
pieces = [
    [0, 28180, 1, "Helmet_41"], [1, 28179, 3, "Shoulder_07"],
    [2, 28160, 5, "Chest_Leather_07"], [3, 28177, 6, "Belt_03"],
    [4, 28161, 7, "Pants_02"], [5, 28162, 8, "Boots_08"],
    [6, 24190, 9, "Bracer_07"], [7, 28166, 10, "Gauntlets_24"],
]

