# The shaman's run sets dressed as the real sets they are named after (`[[set_look]]`,
# docs/HOWTO-CONTENT.md "A set look"): its pieces of each rarity show these displays and icons. A
# piece is (gear slot 0-7 head to hands, ItemDisplayInfo id, InventoryType, icon without INV_),
# read off the client's ItemSet.dbc, Item.dbc and ItemDisplayInfo.dbc (3.3.5a). The Common set
# ("Primal") is no real set and keeps its armor kind's icons. The PvP set has no belt and no
# bracers: those two keep their armor kind's icons too.

# Elements pieces: The Elements, tier 0 (ItemSet 187).
[[set_look]]
key = "shaman_uncommon"
rarity = 1
pieces = [
    [0, 45174, 1, "Helmet_04"], [1, 30925, 3, "Shoulder_29"],
    [2, 31416, 5, "Chest_Chain_11"], [3, 31413, 6, "Belt_16"],
    [4, 31415, 7, "Pants_03"], [5, 31412, 8, "Boots_Wolf"],
    [6, 31411, 9, "Bracer_02"], [7, 31414, 10, "Gauntlets_11"],
]

