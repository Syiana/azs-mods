name = { en = "Summon Doomguard", de = "Verdammniswache beschwören", fr = "Invocation d'un garde funeste", es = "Invocar guardia apocalíptico", pt = "Invocar Guarda da Perdição", ru = "Призыв стражника ужаса", pl = "Przyzwanie Strażnika zagłady", tr = "Kıyamet Muhafızı Çağır", it = "Evocare Guardia Fatale", ja = "サモン・ドゥームガード", zh = "召唤末日守卫", ko = "파멸의 수호병 소환" }
text = { en = "Your damaging spells have a {v}% chance to summon a Doomguard for 15 sec (max 1). Its Shadow Bolts hit 2 enemies and inherit your upgrades.\nDoom Bringer: Consecutive hits on the same boss or elite deal 20% more damage each, up to 100%.", de = "Deine schädlichen Zauber haben eine Chance von {v}%, für 15 Sek. eine Verdammniswache zu beschwören (max. 1). Ihre Schattenblitze treffen 2 Feinde und erben deine Verbesserungen.\nVerdammnisbringer: Aufeinanderfolgende Treffer auf denselben Boss oder Elitegegner verursachen je 20% mehr Schaden, bis zu 100%.", fr = "Tes sorts offensifs ont {v}% de chances d'invoquer un garde funeste pendant 15 s (max. 1). Ses traits de l'ombre touchent 2 ennemis et héritent de tes améliorations.\nPorteur de funeste : les coups consécutifs sur le même boss ou élite infligent chacun 20% de dégâts en plus, jusqu'à 100%.", es = "Tus hechizos de daño tienen un {v}% de probabilidad de invocar a un guardia apocalíptico durante 15 s (máx. 1). Sus Descargas de las Sombras golpean a 2 enemigos y heredan tus mejoras.\nPortador de la fatalidad: los golpes consecutivos al mismo jefe o élite infligen un 20% más de daño cada uno, hasta un 100%.", pt = "Seus feitiços de dano têm {v}% de chance de invocar um Guarda da Perdição por 15 s (máx. 1). Suas Setas Sombrias atingem 2 inimigos e herdam seus aprimoramentos.\nPortador da Perdição: golpes consecutivos no mesmo chefe ou elite causam 20% a mais de dano cada, até 100%.", ru = "Твои повреждающие заклинания с шансом {v}% призывают стражника ужаса на 15 сек. (макс. 1). Его Стрелы Тьмы поражают 2 врагов и наследуют твои улучшения.\nПредвестник гибели: последовательные удары по одному и тому же боссу или элите наносят на 20% больше урона каждый, до 100%.", pl = "Twoje czary zadające obrażenia mają {v}% szansy, by przyzwać Strażnika zagłady na 15 s (maks. 1). Jego Strzały cienia trafiają 2 przeciwników i dziedziczą twoje ulepszenia.\nPosłaniec zagłady: kolejne trafienia tego samego bossa lub elity zadają o 20% więcej obrażeń każde, do 100%.", tr = "Hasar veren büyülerin {v}% ihtimalle 15 sn için bir Kıyamet Muhafızı çağırır (en fazla 1). Gölge Okları 2 düşmana vurur ve yükseltmelerini devralır.\nKıyamet Getiren: Aynı boss veya elite art arda yapılan her vuruş 20% daha fazla hasar verir, en fazla 100%.", it = "I tuoi incantesimi offensivi hanno il {v}% di probabilità di evocare una Guardia Fatale per 15 s (max 1). I suoi Dardi d'ombra colpiscono 2 nemici ed ereditano i tuoi potenziamenti.\nPortatore di Rovina: i colpi consecutivi sullo stesso boss o élite infliggono il 20% di danni in più ciascuno, fino al 100%.", ja = "ダメージを与える呪文が{v}%の確率でドゥームガードを15秒間召喚します（最大1体）。そのシャドウ・ボルトは2体の敵に命中し、あなたの強化を引き継ぎます。\nドゥーム・ブリンガー：同じボスやエリートに連続で命中するたびにダメージが20%ずつ増加します（最大100%）。", zh = "你的伤害法术有{v}%的几率召唤一个末日守卫，持续15秒（最多1个）。其暗影箭击中2个敌人，并继承你的强化。\n末日使者：连续攻击同一个首领或精英时，每次伤害提高20%，最多提高100%。", ko = "피해 주문이 {v}% 확률로 파멸의 수호병을 15초 동안 소환합니다(최대 1마리). 파멸의 수호병의 어둠의 화살은 적 2명을 공격하며 당신의 강화를 물려받습니다.\n파멸의 전령: 같은 우두머리나 정예를 연달아 공격할 때마다 피해가 20%씩 증가하며, 최대 100%입니다." }
