text = { en = "Your demons' attacks have a {v}% chance to Echo for full damage. This is their only Echo source.", de = "Die Angriffe deiner Dämonen haben eine Chance von {v}%, ein Echo mit vollem Schaden auszulösen. Das ist ihre einzige Echo-Quelle.", fr = "Les attaques de tes démons ont {v}% de chances de produire un écho à dégâts complets. C'est leur seule source d'écho.", es = "Los ataques de tus demonios tienen un {v}% de probabilidad de producir un eco con el daño completo. Es su única fuente de eco.", pt = "Os ataques dos seus demônios têm {v}% de chance de ecoar com dano total. Essa é a única fonte de eco deles.", ru = "Атаки твоих демонов с шансом {v}% порождают эхо с полным уроном. Это их единственный источник эха.", pl = "Ataki twoich demonów mają {v}% szansy na Echo z pełnymi obrażeniami. To ich jedyne źródło Echa.", tr = "Şeytanlarının saldırıları {v}% ihtimalle tam hasarla Yankılanır. Bu onların tek Yankı kaynağıdır.", it = "Gli attacchi dei tuoi demoni hanno il {v}% di probabilità di fare Eco con danni pieni. Questa è la loro unica fonte di Eco.", ja = "デーモンの攻撃が{v}%の確率でエコーし、全ダメージを与えます。これがデーモン唯一のエコー源です。", zh = "你的恶魔的攻击有{v}%的几率触发回响，造成全额伤害。这是它们唯一的回响来源。", ko = "악마의 공격이 {v}% 확률로 메아리쳐 전체 피해를 한 번 더 줍니다. 악마가 메아리를 얻는 유일한 방법입니다." }
menu_v = 0.05

