text = { en = "Milestone. Permanently summons a Felhunter. Its bites hit 2 enemies, prioritizing bosses and guardians, and deal {v}% more damage per 1% missing enemy health.\nConsume Magic: Consumes 10% of your highest-ranked DoT's remaining duration, dealing 150% of the consumed damage.\nRules out Soul Link.", de = "Meilenstein. Beschwört dauerhaft einen Teufelsjäger. Seine Bisse treffen 2 Feinde, bevorzugt Bosse und Wächter, und verursachen {v}% mehr Schaden pro 1% fehlender Gesundheit des Feindes.\nMagie verschlingen: Verbraucht 10% der verbleibenden Dauer deines höchstrangigen Schadens-über-Zeit-Effekts und verursacht 150% des verbrauchten Schadens.\nSchließt Seelenverbindung aus.", fr = "Étape. Invoque en permanence un chasseur corrompu. Ses morsures touchent 2 ennemis, en priorité les boss et les gardiens, et infligent {v}% de dégâts en plus par tranche de 1% de points de vie manquants de l'ennemi.\nDévorer la magie : consomme 10% de la durée restante de ton DoT de plus haut rang et inflige 150% des dégâts consommés.\nExclut Lien spirituel.", es = "Hito. Invoca de forma permanente a un manáfago. Sus mordiscos golpean a 2 enemigos, priorizando jefes y guardianes, e infligen un {v}% más de daño por cada 1% de salud que le falte al enemigo.\nConsumir magia: consume un 10% de la duración restante de tu DoT de mayor rango e inflige un 150% del daño consumido.\nExcluye Enlace de alma.", pt = "Marco. Invoca permanentemente um Caçador Vil. Suas mordidas atingem 2 inimigos, priorizando chefes e guardiões, e causam {v}% a mais de dano por 1% de vida faltante do inimigo.\nConsumir Magia: consome 10% da duração restante do seu DoT de maior nível, causando 150% do dano consumido.\nExclui Elo de Alma.", ru = "Веха. Навсегда призывает охотника Скверны. Его укусы поражают 2 врагов, в первую очередь боссов и стражей, и наносят на {v}% больше урона за каждый 1% недостающего здоровья врага.\nПоглощение магии: поглощает 10% оставшейся длительности твоего DoT высшего ранга, нанося 150% поглощённого урона.\nИсключает Родство душ.", pl = "Kamień milowy. Przyzywa na stałe Łowcę Zła. Jego ugryzienia trafiają 2 przeciwników, w pierwszej kolejności bossów i strażników, i zadają o {v}% więcej obrażeń za każdy 1% brakującego zdrowia przeciwnika.\nPochłonięcie magii: zużywa 10% pozostałego czasu twojego najsilniejszego efektu obrażeń w czasie i zadaje 150% zużytych obrażeń.\nWyklucza Więź dusz.", tr = "Dönüm noktası. Kalıcı olarak bir Fel Avcısı çağırır. Isırıkları 2 düşmana vurur, boss'lara ve muhafızlara öncelik verir ve düşmanın eksik her 1% canı için {v}% daha fazla hasar verir.\nBüyü Tüket: En yüksek rütbeli zamanla hasarın kalan süresinin 10%'unu tüketir ve tüketilen hasarın 150%'sini verir.\nRuh Bağı'nı dışlar.", it = "Traguardo. Evoca per sempre un Vilcacciatore. I suoi morsi colpiscono 2 nemici, dando priorità a boss e guardiani, e infliggono il {v}% di danni in più per ogni 1% di salute mancante del nemico.\nConsumare magia: consuma il 10% della durata rimanente del tuo DoT di grado più alto, infliggendo il 150% dei danni consumati.\nEsclude Legame dell'anima.", ja = "【マイルストーン】フェルハンターを常時召喚します。その噛みつきは2体の敵に命中し（ボスとガーディアンを優先）、敵の失われた体力1%ごとにダメージが{v}%増加します。\nコンシューム・マジック：最もランクの高い継続ダメージの残り時間の10%を消費し、消費したダメージの150%を与えます。\nソウル・リンクとは両立できません。", zh = "里程碑：永久召唤一只地狱猎犬。其撕咬击中2个敌人，优先攻击首领和守护者，敌人每损失1%的生命值，造成的伤害提高{v}%。\n吞噬魔法：消耗你等级最高的持续伤害效果10%的剩余持续时间，造成相当于被消耗伤害150%的伤害。\n与灵魂链接互斥。", ko = "이정표. 지옥사냥개를 영구히 소환합니다. 지옥사냥개의 물기는 우두머리와 수호자를 우선하여 적 2명을 공격하며, 적의 잃은 생명력 1%당 피해가 {v}% 증가합니다.\n마법 삼키기: 가장 높은 단계의 지속 피해 효과의 남은 지속시간 10%를 소모하여, 소모한 피해의 150%를 줍니다.\n영혼의 고리와 함께 선택할 수 없습니다." }
menu_v = 0.005
plays = [
    # `{v}`: more damage per 1% of the target's health missing. Ours. `TUNE`
    { v = 0.005, play = { pet = { pet = "felhunter", cleave = false } } },
]

