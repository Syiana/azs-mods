text = { en = "Capstone. Summons a Felguard for {v} sec every 30 sec, reduced by CDR (min 13 sec). Up to 2 active.\nCleaves up to 10 enemies within 15 yd. Every third swing deals double damage. Deals 50% more damage below 30% enemy health.\nExclusive with Pact of the Nathrezim.", de = "Schlussstein. Beschwört alle 30 Sek. eine Teufelswache für {v} Sek., verkürzt durch Abklingzeitverringerung (min. 13 Sek.). Bis zu 2 aktiv.\nSpaltet bis zu 10 Feinde im Umkreis von 15 m. Jeder dritte Hieb verursacht doppelten Schaden. Verursacht 50% mehr Schaden gegen Feinde unter 30% Gesundheit.\nSchließt Pakt der Nathrezim aus.", fr = "Apogée. Invoque un gangregarde pendant {v} s toutes les 30 s, réduit par la RTR (min. 13 s). Jusqu'à 2 actifs.\nFend jusqu'à 10 ennemis à moins de 15 m. Un coup sur trois inflige des dégâts doublés. Inflige 50% de dégâts en plus sous 30% de points de vie de l'ennemi.\nExclusif avec Pacte des Nathrezim.", es = "Cúspide. Invoca a un guardia vil durante {v} s cada 30 s, reducido por la RTR (mín. 13 s). Hasta 2 activos.\nHiende hasta a 10 enemigos a 15 m. Cada tercer golpe inflige el doble de daño. Inflige un 50% más de daño por debajo del 30% de salud del enemigo.\nExclusivo con Pacto de los Nathrezim.", pt = "Ápice. Invoca um Guarda Vil por {v} s a cada 30 s, reduzido pela RTR (mín. 13 s). Até 2 ativos.\nFende até 10 inimigos num raio de 15 m. Todo terceiro golpe causa dano dobrado. Causa 50% a mais de dano abaixo de 30% da vida do inimigo.\nExclusivo com Pacto dos Nathrezim.", ru = "Вершина. Каждые 30 сек. призывает стража Скверны на {v} сек., сокращается снижением перезарядки (мин. 13 сек.). До 2 одновременно.\nРассекает до 10 врагов в радиусе 15 м. Каждый третий удар наносит двойной урон. Наносит на 50% больше урона врагам с здоровьем ниже 30%.\nНесовместима с Договором с Нафрезимами.", pl = "Zwieńczenie. Co 30 s przyzywa Straż Zła na {v} s, skracane przez redukcję odnowień (min. 13 s). Do 2 naraz.\nCięciem trafia do 10 przeciwników w promieniu 15 m. Co trzeci zamach zadaje podwójne obrażenia. Zadaje o 50% więcej obrażeń przeciwnikom poniżej 30% zdrowia.\nWyklucza Pakt z Nathrezimami.", tr = "Zirve. Her 30 sn'de {v} sn için bir Fel Muhafız çağırır, bekleme azaltımıyla kısalır (en az 13 sn). En fazla 2 aktif.\n15 m içindeki en fazla 10 düşmanı yarar. Her üçüncü savuruş çift hasar verir. Düşmanın canı 30%'un altındayken 50% daha fazla hasar verir.\nNathrezim Paktı ile birlikte alınamaz.", it = "Vertice. Evoca una Vilguardia per {v} s ogni 30 s, ridotti dalla riduzione delle ricariche (min 13 s). Fino a 2 attive.\nSpazza fino a 10 nemici entro 15 m. Ogni terzo fendente infligge il doppio dei danni. Infligge il 50% di danni in più sotto il 30% di salute del nemico.\nIncompatibile con Patto dei Nathrezim.", ja = "【キャップストーン】30秒ごとにフェルガードを{v}秒間召喚します（クールダウン短縮で短くなり、最短13秒）。最大2体まで同時に存在します。\n15ヤード以内の最大10体の敵をなぎ払います。3回目の攻撃ごとにダメージが2倍になります。体力30%未満の敵へのダメージが50%増加します。\nパクト・オブ・ザ・ナスレズィムとは両立できません。", zh = "终极天赋：每30秒召唤一个恶魔卫士，持续{v}秒，间隔受冷却缩减影响（最少13秒）。最多同时存在2个。\n顺劈15码内最多10个敌人。每第三次挥砍造成双倍伤害。对生命值低于30%的敌人造成的伤害提高50%。\n与纳斯雷兹姆之约互斥。", ko = "궁극 특성. 30초마다 지옥수호병을 {v}초 동안 소환합니다. 재사용 대기시간 감소가 적용됩니다(최소 13초). 최대 2마리까지 활동합니다.\n15미터 안의 적을 최대 10명까지 베어 냅니다. 세 번째 휘두르기마다 두 배의 피해를 줍니다. 생명력이 30% 미만인 적에게 50% 더 많은 피해를 줍니다.\n나스레짐의 서약과 함께 선택할 수 없습니다." }
