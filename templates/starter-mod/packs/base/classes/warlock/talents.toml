text = { en = "Milestone. Every 4 sec, summon 4 random lesser demons for 12–16 sec (max 12).\nSuccubi stun Corrupted enemies. Their kills trigger a Death Coil at 50% damage.", de = "Meilenstein. Alle 4 Sek. beschwörst du 4 zufällige niedere Dämonen für 12–16 Sek. (max. 12).\nSukkuben betäuben Feinde unter deiner Verderbnis. Ihre Tötungen lösen einen Todesmantel mit 50% Schaden aus.", fr = "Étape. Toutes les 4 s, invoque 4 démons mineurs aléatoires pendant 12–16 s (max. 12).\nLes succubes étourdissent les ennemis sous Corruption. Leurs victimes déclenchent un Voile mortel à 50% des dégâts.", es = "Hito. Cada 4 s, invocas 4 demonios menores aleatorios durante 12–16 s (máx. 12).\nLos súcubos aturden a los enemigos con Corrupción. Sus bajas desencadenan una Espiral de la muerte con un 50% de daño.", pt = "Marco. A cada 4 s, invoca 4 demônios menores aleatórios por 12–16 s (máx. 12).\nSúcubos atordoam inimigos sob Corrupção. Suas mortes disparam uma Espiral da Morte com 50% do dano.", ru = "Веха. Каждые 4 сек. призывает 4 случайных младших демона на 12–16 сек. (макс. 12).\nСуккубы оглушают врагов под Порчей. Их убийства вызывают Лик смерти с 50% урона.", pl = "Kamień milowy. Co 4 s przyzywa 4 losowe pomniejsze demony na 12–16 s (maks. 12).\nSukuby ogłuszają Zepsutych przeciwników. Ich zabójstwa wywołują Splot śmierci za 50% obrażeń.", tr = "Dönüm noktası. Her 4 sn'de 12–16 sn için 4 rastgele küçük şeytan çağır (en fazla 12).\nSuccubus'lar Yozlaşmış düşmanları sersemletir. Öldürmeleri 50% hasarlı bir Ölüm Sarmalı tetikler.", it = "Traguardo. Ogni 4 s, evoca 4 demoni minori casuali per 12–16 s (max 12).\nI Succubi stordiscono i nemici corrotti. Le loro uccisioni innescano una Spira della morte al 50% dei danni.", ja = "【マイルストーン】4秒ごとにランダムな下級デーモン4体を12～16秒間召喚します（最大12体）。\nサキュバスはコラプション状態の敵をスタンさせます。下級デーモンが敵を倒すと、50%ダメージのデス・コイルが発動します。", zh = "里程碑：每4秒召唤4个随机的低阶恶魔，持续12–16秒（最多12个）。\n魅魔会使被腐蚀的敌人昏迷。它们的击杀会触发一次伤害为50%的死亡缠绕。", ko = "이정표. 4초마다 무작위 하급 악마 4마리를 12–16초 동안 소환합니다(최대 12마리).\n서큐버스는 부패에 걸린 적을 기절시킵니다. 서큐버스가 처치하면 50% 피해의 죽음의 고리가 발동합니다." }
menu_v = 4
