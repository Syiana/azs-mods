text = { en = "Milestone. Permanently summons a Voidwalker that hits 2 enemies. Gains 3% damage per 1% Damage Reduction and 2% per 1% bonus max health.\nYour Voidwalkers shield you for {v}% of their damage, up to 10% of your max health.\nRules out Soul Devourer.", de = "Meilenstein. Beschwört dauerhaft einen Leerwandler, der 2 Feinde trifft. Er erhält 3% Schaden pro 1% Schadensverringerung und 2% pro 1% zusätzlicher maximaler Gesundheit.\nDeine Leerwandler schirmen dich mit {v}% ihres Schadens ab, bis zu 10% deiner maximalen Gesundheit.\nSchließt Seelenverschlinger aus.", fr = "Étape. Invoque en permanence un marcheur du Vide qui touche 2 ennemis. Gagne 3% de dégâts par tranche de 1% de réduction des dégâts et 2% par tranche de 1% de points de vie max bonus.\nTes marcheurs du Vide te protègent à hauteur de {v}% de leurs dégâts, jusqu'à 10% de tes points de vie max.\nExclut Dévoreur d'âmes.", es = "Hito. Invoca de forma permanente a un abisario que golpea a 2 enemigos. Gana un 3% de daño por cada 1% de reducción de daño y un 2% por cada 1% de salud máxima adicional.\nTus abisarios te protegen con un {v}% de su daño, hasta un 10% de tu salud máxima.\nExcluye Devoraalmas.", pt = "Marco. Invoca permanentemente um Caminhante do Vácuo que atinge 2 inimigos. Ganha 3% de dano por 1% de Redução de Dano e 2% por 1% de vida máxima adicional.\nSeus Caminhantes do Vácuo protegem você com {v}% do dano deles, até 10% da sua vida máxima.\nExclui Devorador de Almas.", ru = "Веха. Навсегда призывает демона Бездны, поражающего 2 врагов. Получает 3% урона за каждый 1% снижения урона и 2% за каждый 1% бонусного максимума здоровья.\nТвои демоны Бездны защищают тебя щитом в {v}% своего урона, до 10% твоего максимума здоровья.\nИсключает Пожирателя душ.", pl = "Kamień milowy. Przyzywa na stałe Wędrowca Pustki, który trafia 2 przeciwników. Zyskuje 3% obrażeń za każdy 1% redukcji obrażeń i 2% za każdy 1% dodatkowego maks. zdrowia.\nTwoi Wędrowcy Pustki chronią cię tarczą o wartości {v}% ich obrażeń, do 10% twojego maks. zdrowia.\nWyklucza Pożeracza dusz.", tr = "Dönüm noktası. Kalıcı olarak 2 düşmana vuran bir Boşluk Yürüyeni çağırır. Her 1% Hasar Azaltma için 3%, her 1% bonus azami can için 2% hasar kazanır.\nBoşluk Yürüyenlerin hasarlarının {v}%'si kadar seni korur, azami canının 10%'una kadar.\nRuh Yiyen'i dışlar.", it = "Traguardo. Evoca per sempre un Vuotante che colpisce 2 nemici. Ottiene il 3% di danni per ogni 1% di riduzione dei danni e il 2% per ogni 1% di salute massima bonus.\nI tuoi Vuotanti ti proteggono con uno scudo pari al {v}% dei loro danni, fino al 10% della tua salute massima.\nEsclude Divoratore di anime.", ja = "【マイルストーン】2体の敵に命中するヴォイドウォーカーを常時召喚します。被ダメージ軽減1%ごとにダメージ+3%、最大体力ボーナス1%ごとに+2%。\nヴォイドウォーカーがそのダメージの{v}%分のシールドをあなたに張ります（最大体力の10%まで）。\nソウル・ディヴァウラーとは両立できません。", zh = "里程碑：永久召唤一个击中2个敌人的虚空行者。你每有1%的伤害减免，它的伤害提高3%；每有1%的额外最大生命值，它的伤害提高2%。\n你的虚空行者会为你提供相当于其伤害{v}%的护盾，最多为你最大生命值的10%。\n与灵魂吞噬者互斥。", ko = "이정표. 적 2명을 공격하는 보이드워커를 영구히 소환합니다. 피해 감소 1%당 피해가 3%, 최대 생명력 보너스 1%당 2% 증가합니다.\n보이드워커가 자신이 준 피해의 {v}%만큼 당신에게 보호막을 씌웁니다. 최대 생명력의 10%까지입니다.\n영혼 포식자와 함께 선택할 수 없습니다." }
menu_v = 0.05
behaviors = [
