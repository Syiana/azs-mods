name = { en = "Seed of Corruption", de = "Saat der Verderbnis", fr = "Graine de corruption", es = "Semilla de corrupción", pt = "Semente da Corrupção", ru = "Семя порчи", pl = "Ziarno zepsucia", tr = "Yozlaşma Tohumu", it = "Seme della corruzione", ja = "シード・オブ・コラプション", zh = "腐蚀之种", ko = "부패의 씨앗" }
text = { en = "Capstone. You start every run with Corruption, and enemies that die afflicted by your damage-over-time effects burst for {v}% of their maximum health on everything within 6 yd.", de = "Schlussstein. Du beginnst jeden Lauf mit Verderbnis, und Feinde, die unter deinen Effekten für Schaden über Zeit sterben, zerbersten für {v}% ihrer maximalen Gesundheit auf alles im Umkreis von 6 m.", fr = "Apogée. Tu commences chaque partie avec Corruption, et les ennemis qui meurent sous tes effets de dégâts sur la durée explosent pour {v}% de leurs points de vie maximum sur tout ce qui se trouve à moins de 6 m.", es = "Cúspide. Empiezas cada partida con Corrupción, y los enemigos que mueren afectados por tus efectos de daño con el tiempo estallan por un {v}% de su salud máxima sobre todo lo que haya a 6 m.", pt = "Ápice. Você começa cada partida com Corrupção, e inimigos que morrem afligidos pelos seus efeitos de dano ao longo do tempo explodem causando {v}% da própria vida máxima em tudo num raio de 6 m.", ru = "Вершина. Ты начинаешь каждый забег с Порчей, а враги, умирающие под твоими эффектами периодического урона, взрываются, нанося {v}% своего максимального здоровья всем в радиусе 6 м.", pl = "Zwieńczenie. Każdą rozgrywkę zaczynasz ze Zepsuciem, a przeciwnicy, którzy umierają dotknięci twoimi efektami obrażeń w czasie, wybuchają za {v}% swojego maksymalnego zdrowia, raniąc wszystko w promieniu 6 m.", tr = "Zirve. Her oyuna Yozlaştırma ile başlarsın ve zamanla hasar efektlerinle dertli halde ölen düşmanlar patlar, 6 m içindeki her şeye azami canlarının {v}%'si kadar hasar verir.", it = "Vertice. Inizi ogni partita con Corruzione e i nemici che muoiono afflitti dai tuoi effetti di danno nel tempo esplodono per il {v}% della loro salute massima su tutto entro 6 m.", ja = "【キャップストーン】毎ランをコラプションを持って始め、継続ダメージ効果を受けたまま死んだ敵が炸裂して6ヤード以内のすべてに最大体力の{v}%のダメージを与えます。", zh = "终极天赋：你在每场对局开始时拥有腐蚀术，受到你的持续伤害效果影响而死亡的敌人会爆发，对6码内的所有目标造成相当于其最大生命值{v}%的伤害。", ko = "궁극 특성. 모든 런을 부패를 가지고 시작하며, 지속 피해 효과에 걸린 채 죽은 적이 터져서 6미터 안의 모든 대상에게 그 적의 최대 생명력의 {v}%만큼 피해를 줍니다." }
