name = { en = "Demonic Familiar", de = "Dämonischer Vertrauter", fr = "Familier démoniaque", es = "Familiar demoníaco", pt = "Familiar Demoníaco", ru = "Демонический спутник", pl = "Demoniczny chowaniec", tr = "Şeytani Yoldaş", it = "Famiglio demoniaco", ja = "デモニック・ファミリア", zh = "恶魔仆从", ko = "악마 친구" }
text = { en = "An Imp fights at your side for good, its Firebolts {v}% stronger. Each one also strikes every enemy burning with your Immolate.", de = "Ein Wichtel kämpft dauerhaft an deiner Seite, seine Feuerblitze sind {v}% stärker. Jeder trifft zudem alle Feinde, die unter deinem Feuerbrand brennen.", fr = "Un diablotin combat à tes côtés en permanence, ses éclairs de feu étant {v}% plus puissants. Chacun frappe aussi tous les ennemis qui brûlent sous ton Immolation.", es = "Un diablillo lucha a tu lado de forma permanente, con sus Descargas de fuego un {v}% más fuertes. Cada una también golpea a todos los enemigos que arden con tu Inmolar.", pt = "Um Diabrete luta ao seu lado para sempre, com Setas de Fogo {v}% mais fortes. Cada uma também atinge todo inimigo que queima com sua Imolação.", ru = "Бес навсегда сражается на твоей стороне, его Огненные стрелы на {v}% сильнее. Каждая также поражает всех врагов, горящих от твоего Жертвенного огня.", pl = "Chochlik walczy u twego boku na stałe, a jego Ogniste strzały są silniejsze o {v}%. Każda uderza też każdego przeciwnika płonącego od twojego Podpalenia.", tr = "Bir İmp kalıcı olarak yanında savaşır, Ateş Okları {v}% daha güçlüdür. Her ok ayrıca senin Yak'ınla yanan her düşmana da vurur.", it = "Un Imp combatte per sempre al tuo fianco, con i suoi Dardi di fuoco più forti del {v}%. Ognuno colpisce anche ogni nemico che brucia per la tua Immolazione.", ja = "インプが常に共に戦い、そのファイアボルトが{v}%強化されます。各ファイアボルトはイモレートで燃えているすべての敵にも命中します。", zh = "一个小鬼永久在你身边作战，其火焰箭的威力提高{v}%。每支火焰箭还会击中所有正在被你的献祭灼烧的敌人。", ko = "임프가 영구히 곁에서 싸우며, 임프의 화염 화살이 {v}% 강해집니다. 화염 화살은 당신의 제물에 불타는 모든 적에게도 피해를 줍니다." }
