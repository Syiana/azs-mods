text = { en = "Milestone. Your Shadow Bolts carry the night: each one that lands corrupts its target for {v}% of the bolt over 12 sec, and every tick of Corruption has a 2% chance to fire a free Shadow Bolt, at most twice a second.", de = "Meilenstein. Deine Schattenblitze tragen die Nacht: Jeder treffende verdirbt sein Ziel für {v}% des Blitzes über 12 Sek., und jeder Tick von Verderbnis hat eine Chance von 2%, einen kostenlosen Schattenblitz abzufeuern, höchstens zweimal pro Sekunde.", fr = "Étape. Tes traits de l'ombre portent la nuit : chacun qui touche corrompt sa cible pour {v}% du trait sur 12 s, et chaque tick de Corruption a 2% de chances de lancer un trait de l'ombre gratuit, deux fois par seconde au maximum.", es = "Hito. Tus Descargas de las Sombras traen la noche: cada una que impacta corrompe a su objetivo por un {v}% de la descarga durante 12 s, y cada pulso de Corrupción tiene un 2% de probabilidad de lanzar una Descarga de las Sombras gratuita, como máximo dos veces por segundo.", pt = "Marco. Suas Setas Sombrias trazem a noite: cada uma que acerta corrompe o alvo por {v}% da seta ao longo de 12 s, e cada pulso de Corrupção tem 2% de chance de disparar uma Seta Sombria grátis, no máximo duas vezes por segundo.", ru = "Веха. Твои Стрелы Тьмы несут ночь: каждая попавшая стрела отравляет цель на {v}% урона стрелы в течение 12 сек., а каждый тик Порчи с шансом 2% выпускает бесплатную Стрелу Тьмы, не чаще двух раз в секунду.", pl = "Kamień milowy. Twoje Strzały cienia niosą noc: każda trafiona psuje cel za {v}% pocisku przez 12 s, a każde tyknięcie Zepsucia ma 2% szansy na darmową Strzałę cienia, najwyżej dwa razy na sekundę.", tr = "Dönüm noktası. Gölge Okların geceyi taşır: isabet eden her ok hedefi 12 sn içinde okun {v}%'si kadar yozlaştırır ve Yozlaştırma'nın her vuruşu 2% ihtimalle bedava bir Gölge Oku atar, saniyede en fazla iki kez.", it = "Traguardo. I tuoi Dardi d'ombra portano la notte: ognuno che va a segno corrompe il bersaglio per il {v}% del dardo in 12 s e ogni tick di Corruzione ha il 2% di probabilità di lanciare un Dardo d'ombra gratuito, al massimo due volte al secondo.", ja = "【マイルストーン】シャドウ・ボルトが夜をまといます：命中するたびに対象を蝕み、12秒かけてボルトの{v}%のダメージを与えます。さらにコラプションの各ティックが2%の確率で無料のシャドウ・ボルトを放ちます（1秒に2回まで）。", zh = "里程碑：你的暗影箭携带黑夜：每支命中的暗影箭都会腐蚀目标，在12秒内造成相当于该箭伤害{v}%的伤害，并且腐蚀术每跳有2%的几率免费发射一支暗影箭，每秒最多两次。", ko = "이정표. 어둠의 화살이 밤을 실어 나릅니다: 적중한 화살마다 대상을 부패시켜 12초에 걸쳐 화살 피해의 {v}%를 주며, 부패가 피해를 줄 때마다 2% 확률로 어둠의 화살을 무료로 발사합니다. 초당 최대 2번입니다." }
