name = { en = "Soul Devourer", de = "Seelenverschlinger", fr = "Dévoreur d'âmes", es = "Devoraalmas", pt = "Devorador de Almas", ru = "Пожиратель душ", pl = "Pożeracz dusz", tr = "Ruh Yiyen", it = "Divoratore di anime", ja = "ソウル・ディヴァウラー", zh = "灵魂吞噬者", ko = "영혼 포식자" }
