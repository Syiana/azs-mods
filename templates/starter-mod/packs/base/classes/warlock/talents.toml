text = { en = "Your Infernal and Doomguard become permanent. You can no longer summon lesser demons. Maximum one of each.", de = "Deine Höllenbestie und Verdammniswache werden dauerhaft. Du kannst keine niederen Dämonen mehr beschwören. Höchstens einer von jedem.", fr = "Ton infernal et ton garde funeste deviennent permanents. Tu ne peux plus invoquer de démons mineurs. Un seul de chaque au maximum.", es = "Tu infernal y tu guardia apocalíptico se vuelven permanentes. Ya no puedes invocar demonios menores. Máximo uno de cada.", pt = "Seu Infernal e seu Guarda da Perdição se tornam permanentes. Você não pode mais invocar demônios menores. No máximo um de cada.", ru = "Твои Инфернал и Стражник ужаса становятся постоянными. Ты больше не можешь призывать младших демонов. Не более одного каждого.", pl = "Twój Piekielnik i Strażnik zagłady stają się stali. Nie możesz już przyzywać pomniejszych demonów. Maksymalnie po jednym z każdego.", tr = "Cehennem Yaratığın ve Kıyamet Muhafızın kalıcı olur. Artık küçük şeytan çağıramazsın. Her birinden en fazla bir tane.", it = "Il tuo Infernale e la tua Guardia Fatale diventano permanenti. Non puoi più evocare demoni minori. Massimo uno per tipo.", ja = "インファーナルとドゥームガードが常駐するようになります。下級デーモンは召喚できなくなります。それぞれ最大1体。", zh = "你的地狱火和末日守卫变为永久存在。你无法再召唤低阶恶魔。每种最多一个。", ko = "지옥불정령과 파멸의 수호병이 영구히 남습니다. 더 이상 하급 악마를 소환할 수 없습니다. 각각 최대 1마리입니다." }
