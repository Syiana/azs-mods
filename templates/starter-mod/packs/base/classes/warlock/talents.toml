name = { en = "Pact of the Nathrezim", de = "Pakt der Nathrezim", fr = "Pacte des Nathrezim", es = "Pacto de los Nathrezim", pt = "Pacto dos Nathrezim", ru = "Договор с Нафрезимами", pl = "Pakt z Nathrezimami", tr = "Nathrezim Paktı", it = "Patto dei Nathrezim", ja = "パクト・オブ・ザ・ナスレズィム", zh = "纳斯雷兹姆之约", ko = "나스레짐의 서약" }
text = { en = "Capstone. Summons a Dread Lord for {v} sec every 30 sec, reduced by CDR (min 13 sec). Up to 2 active.\nFelseeker inherits your Searing Pain upgrades and deals 25% more damage to its primary target. It hits up to 6 enemies.\nExclusive with Butcher.", de = "Schlussstein. Beschwört alle 30 Sek. einen Schreckenslord für {v} Sek., verkürzt durch Abklingzeitverringerung (min. 13 Sek.). Bis zu 2 aktiv.\nTeufelssucher erbt die Verbesserungen deines Sengenden Schmerzes und verursacht an seinem Hauptziel 25% mehr Schaden. Er trifft bis zu 6 Feinde.\nSchließt Schlächter aus.", fr = "Apogée. Invoque un seigneur de l'effroi pendant {v} s toutes les 30 s, réduit par la RTR (min. 13 s). Jusqu'à 2 actifs.\nGangrechercheur hérite de tes améliorations de Douleur brûlante et inflige 25% de dégâts en plus à sa cible principale. Il touche jusqu'à 6 ennemis.\nExclusif avec Boucher.", es = "Cúspide. Invoca a un señor del terror durante {v} s cada 30 s, reducido por la RTR (mín. 13 s). Hasta 2 activos.\nBuscavil hereda tus mejoras de Dolor abrasador e inflige un 25% más de daño a su objetivo principal. Golpea hasta a 6 enemigos.\nExclusivo con Carnicero.", pt = "Ápice. Invoca um Senhor do Terror por {v} s a cada 30 s, reduzido pela RTR (mín. 13 s). Até 2 ativos.\nBuscavil herda seus aprimoramentos de Dor Escaldante e causa 25% a mais de dano ao alvo principal. Atinge até 6 inimigos.\nExclusivo com Açougueiro.", ru = "Вершина. Каждые 30 сек. призывает повелителя ужаса на {v} сек., сокращается снижением перезарядки (мин. 13 сек.). До 2 одновременно.\nИскатель Скверны наследует твои улучшения Жгучей боли и наносит на 25% больше урона основной цели. Поражает до 6 врагов.\nНесовместима с Мясником.", pl = "Zwieńczenie. Co 30 s przyzywa Władcę Grozy na {v} s, skracane przez redukcję odnowień (min. 13 s). Do 2 naraz.\nPoszukiwacz Zła dziedziczy ulepszenia twojego Palącego bólu i zadaje o 25% więcej obrażeń głównemu celowi. Trafia do 6 przeciwników.\nWyklucza Rzeźnika.", tr = "Zirve. Her 30 sn'de {v} sn için bir Dehşet Lordu çağırır, bekleme azaltımıyla kısalır (en az 13 sn). En fazla 2 aktif.\nFel Arayan, Kavurucu Acı yükseltmelerini devralır ve ana hedefine 25% daha fazla hasar verir. En fazla 6 düşmana vurur.\nKasap ile birlikte alınamaz.", it = "Vertice. Evoca un Signore del terrore per {v} s ogni 30 s, ridotti dalla riduzione delle ricariche (min 13 s). Fino a 2 attivi.\nFelseeker eredita i tuoi potenziamenti di Dolore bruciante e infligge il 25% di danni in più al bersaglio principale. Colpisce fino a 6 nemici.\nIncompatibile con Macellaio.", ja = "【キャップストーン】30秒ごとにドレッドロードを{v}秒間召喚します（クールダウン短縮で短くなり、最短13秒）。最大2体まで同時に存在します。\nフェルシーカーはあなたのシアリング・ペインの強化を引き継ぎ、主目標に与えるダメージが25%増加します。最大6体の敵に命中します。\nブッチャーとは両立できません。", zh = "终极天赋：每30秒召唤一个恐惧魔王，持续{v}秒，间隔受冷却缩减影响（最少13秒）。最多同时存在2个。\n邪能追猎者继承你的灼热之痛的强化，对其主要目标造成的伤害提高25%。它最多击中6个敌人。\n与屠夫互斥。", ko = "궁극 특성. 30초마다 공포의 군주를 {v}초 동안 소환합니다. 재사용 대기시간 감소가 적용됩니다(최소 13초). 최대 2마리까지 활동합니다.\n지옥추적자는 당신의 불타는 고통 강화를 물려받으며, 주 대상에게 25% 더 많은 피해를 줍니다. 적을 최대 6명까지 공격합니다.\n도살자와 함께 선택할 수 없습니다." }
