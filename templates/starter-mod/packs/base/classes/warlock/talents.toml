text = { en = "Your damaging spells have a {v}% chance to summon an Infernal for 15 sec (max 1). Its Meteor stuns enemies on impact, and it burns nearby enemies with Hellfire.", de = "Deine schädlichen Zauber haben eine Chance von {v}%, für 15 Sek. eine Höllenbestie zu beschwören (max. 1). Ihr Meteor betäubt Feinde beim Aufprall, und sie verbrennt Feinde in der Nähe mit Höllenfeuer.", fr = "Tes sorts offensifs ont {v}% de chances d'invoquer un infernal pendant 15 s (max. 1). Son météore étourdit les ennemis à l'impact, et il brûle les ennemis proches avec les Flammes infernales.", es = "Tus hechizos de daño tienen un {v}% de probabilidad de invocar a un infernal durante 15 s (máx. 1). Su Meteoro aturde a los enemigos al impactar, y quema a los enemigos cercanos con Fuego infernal.", pt = "Seus feitiços de dano têm {v}% de chance de invocar um Infernal por 15 s (máx. 1). Seu Meteoro atordoa inimigos no impacto, e ele queima inimigos próximos com Fogo Infernal.", ru = "Твои повреждающие заклинания с шансом {v}% призывают инфернала на 15 сек. (макс. 1). Его Метеор оглушает врагов при падении, а Адским пламенем он обжигает врагов рядом.", pl = "Twoje czary zadające obrażenia mają {v}% szansy, by przyzwać Piekielnika na 15 s (maks. 1). Jego Meteor ogłusza przeciwników przy uderzeniu, a on sam pali pobliskich przeciwników Piekielnym ogniem.", tr = "Hasar veren büyülerin {v}% ihtimalle 15 sn için bir Cehennem Yaratığı çağırır (en fazla 1). Göktaşı çarpınca düşmanları sersemletir ve yakındaki düşmanları Cehennem Ateşi ile yakar.", it = "I tuoi incantesimi offensivi hanno il {v}% di probabilità di evocare un Infernale per 15 s (max 1). La sua Meteora stordisce i nemici all'impatto e brucia i nemici vicini con Fuoco infernale.", ja = "ダメージを与える呪文が{v}%の確率でインファーナルを15秒間召喚します（最大1体）。そのメテオは着弾時に敵をスタンさせ、ヘルファイアで周囲の敵を焼きます。", zh = "你的伤害法术有{v}%的几率召唤一个地狱火，持续15秒（最多1个）。其陨石落地时会使敌人昏迷，并以地狱烈焰灼烧附近的敌人。", ko = "피해 주문이 {v}% 확률로 지옥불정령을 15초 동안 소환합니다(최대 1마리). 지옥불정령의 유성은 떨어질 때 적을 기절시키며, 지옥의 불길로 주위의 적을 불태웁니다." }
