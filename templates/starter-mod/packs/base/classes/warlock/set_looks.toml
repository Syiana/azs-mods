# The warlock's run sets dressed as the real sets they are named after (`[[set_look]]`,
# docs/HOWTO-CONTENT.md "A set look"): its pieces of each rarity show these displays and icons. A
# piece is (gear slot 0-7 head to hands, ItemDisplayInfo id, InventoryType, icon without INV_),
# read off the client's ItemSet.dbc, Item.dbc and ItemDisplayInfo.dbc (3.3.5a). The Common set
# ("Novice's") is no real set and keeps its armor kind's icons. The PvP set has no belt and no
# bracers: those two keep their armor kind's icons too.

# Dreadmist pieces: Dreadmist Raiment, tier 0 (ItemSet 183).
[[set_look]]
key = "warlock_uncommon"
rarity = 1
pieces = [
    [0, 31263, 1, "Helmet_29"], [1, 29798, 3, "Misc_Bone_TaurenSkull_01"],
    [2, 29792, 20, "Chest_Cloth_49"], [3, 29793, 6, "Belt_12"],
    [4, 29797, 7, "Pants_08"], [5, 29799, 8, "Boots_05"],
    [6, 29795, 9, "Bracer_13"], [7, 29800, 10, "Gauntlets_32"],
]

