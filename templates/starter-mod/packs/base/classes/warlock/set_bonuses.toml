rdisci, immobilizzi, rallenti o terrorizzi.", ja = "デス・コイルが追加で{v}体の敵に命中し、ダメージが50%増加し、敵を3秒間恐慌させ、40%早く再使用できるようになります。さらに、スタン・移動不能・スロー・恐怖状態の敵に与えるダメージが{v2}%増加します。", zh = "死亡缠绕额外击中{v}个敌人，造成的伤害提高50%，使其惊骇3秒，冷却速度加快40%，并且你对被昏迷、定身、减速或恐惧的敌人造成的伤害提高{v2}%。", ko = "죽음의 고리가 적을 {v}명 더 공격하고, 피해가 50% 증가하며, 3초 동안 적을 공포에 빠뜨리고, 40% 더 빨리 돌아옵니다. 또한 기절, 속박, 감속, 공포 상태인 적에게 주는 피해가 {v2}% 증가합니다." }

