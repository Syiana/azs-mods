name = { en = "Last Stand", de = "Letztes Gefecht", fr = "Dernier rempart", es = "Hasta el final", pt = "Última Resistência", ru = "Ни шагу назад", pl = "Ostatni bastion", tr = "Son Direniş", it = "Ultima difesa", ja = "ラスト・スタンド", zh = "破釜沉舟", ko = "최후의 저항" }
text = { en = "A blow that would kill you leaves you at 40% health instead, then you answer with a free Shield Slam and a shield of 10% of your maximum health. Once every 90 sec.", de = "Ein Hieb, der dich töten würde, lässt dich stattdessen mit 40% Gesundheit zurück, dann antwortest du mit einem kostenlosen Schildschlag und einem Schild von 10% deiner maximalen Gesundheit. Einmal alle 90 Sek.", fr = "Un coup qui te tuerait te laisse à 40% de points de vie à la place, puis tu ripostes avec un Heurt de bouclier gratuit et un bouclier de 10% de tes points de vie maximum. Une fois toutes les 90 s.", es = "Un golpe que te mataría te deja con un 40% de salud en su lugar, y respondes con un Embate de escudo gratuito y un escudo del 10% de tu salud máxima. Una vez cada 90 s.", pt = "Um golpe que mataria você deixa você com 40% de vida, e então você responde com uma Pancada de Escudo grátis e um escudo de 10% da sua vida máxima. Uma vez a cada 90 s.", ru = "Удар, который убил бы тебя, оставляет тебе 40% здоровья, после чего ты отвечаешь бесплатным Мощным ударом щитом и щитом в 10% твоего максимального здоровья. Раз в 90 сек.", pl = "Cios, który by cię zabił, zostawia cię przy 40% zdrowia, a ty odpowiadasz darmowym Uderzeniem tarczą i tarczą o wartości 10% twojego maksymalnego zdrowia. Raz na 90 s.", tr = "Seni öldürecek bir darbe seni 40% canla bırakır, ardından bedava bir Kalkan Çarpması ve azami canının 10%'u kadar bir kalkanla karşılık verirsin. 90 sn'de bir.", it = "Un colpo che ti ucciderebbe ti lascia invece al 40% di salute, poi rispondi con un Colpo di scudo gratuito e uno scudo pari al 10% della tua salute massima. Una volta ogni 90 s.", ja = "致命的な一撃を受けると代わりに体力40%で踏みとどまり、無料のシールド・スラムと最大体力10%のシールドで反撃します。90秒に1回まで。", zh = "致命的一击会使你保留40%的生命值，随后你会以一次免费的盾牌猛击还击，并获得一个吸收相当于你最大生命值10%伤害的护盾。每90秒一次。", ko = "치명적인 일격을 받으면 대신 생명력 40%로 남고, 방패 밀쳐내기를 무료로 반격하며 최대 생명력 10%의 보호막을 얻습니다. 90초에 한 번 발동합니다." }
