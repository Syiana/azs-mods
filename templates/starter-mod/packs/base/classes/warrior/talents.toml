text = { en = "Milestone. Every Shield Slam raises a shield of {v}% of your maximum health, stacking up to 30% (42% with Shield Mastery), and while a shield holds, you deal 20% more damage.", de = "Meilenstein. Jeder Schildschlag errichtet einen Schild von {v}% deiner maximalen Gesundheit, stapelbar bis 30% (42% mit Schildbeherrschung), und solange ein Schild hält, verursachst du 20% mehr Schaden.", fr = "Étape. Chaque Heurt de bouclier dresse un bouclier de {v}% de tes points de vie maximum, cumulable jusqu'à 30% (42% avec Maîtrise du bouclier), et tant qu'un bouclier tient, tu infliges 20% de dégâts en plus.", es = "Hito. Cada Embate de escudo levanta un escudo del {v}% de tu salud máxima, acumulable hasta un 30% (42% con Maestría con escudo), y mientras un escudo aguante, infliges un 20% más de daño.", pt = "Marco. Cada Pancada de Escudo ergue um escudo de {v}% da sua vida máxima, acumulável até 30% (42% com Maestria em Escudo), e enquanto um escudo resistir, você causa 20% a mais de dano.", ru = "Веха. Каждый Мощный удар щитом возводит щит в {v}% твоего максимального здоровья, суммируясь до 30% (42% с Мастерством обращения со щитом), и пока щит держится, ты наносишь на 20% больше урона.", pl = "Kamień milowy. Każde Uderzenie tarczą wznosi tarczę o wartości {v}% twojego maksymalnego zdrowia, kumulującą się do 30% (42% z Mistrzostwem tarczy), a gdy tarcza trzyma, zadajesz o 20% więcej obrażeń.", tr = "Dönüm noktası. Her Kalkan Çarpması azami canının {v}%'si kadar bir kalkan kaldırır, en fazla 30%'a kadar birikir (Kalkan Ustalığı ile 42%) ve kalkan dururken 20% daha fazla hasar verirsin.", it = "Traguardo. Ogni Colpo di scudo erige uno scudo pari al {v}% della tua salute massima, cumulabile fino al 30% (42% con Maestria con lo scudo), e finché uno scudo regge infliggi il 20% di danni in più.", ja = "【マイルストーン】シールド・スラムのたびに最大体力の{v}%のシールドが張られ、30%まで重ねられます（シールド・マスタリーがあれば42%）。シールドがある間、与えるダメージが20%増加します。", zh = "里程碑：每次盾牌猛击都会生成一个吸收相当于你最大生命值{v}%伤害的护盾，最多叠加至30%（拥有盾牌掌握时为42%），护盾存在期间，你造成的伤害提高20%。", ko = "이정표. 방패 밀쳐내기마다 최대 생명력의 {v}%에 해당하는 보호막이 생기며 최대 30%(방패 숙련이 있으면 42%)까지 중첩됩니다. 보호막이 유지되는 동안 주는 피해가 20% 증가합니다." }
menu_v = 0.1
plays = [
    { v = 0.1, play = { shield_stack = { keys = ["shield_slam"], cap = 0.3 } } },
]

