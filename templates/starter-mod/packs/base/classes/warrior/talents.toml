text = { en = "Damage reduction past the cap is not wasted: each 1% of it becomes {v}% more damage.", de = "Schadensverringerung über der Obergrenze geht nicht verloren: Jedes 1% davon wird zu {v}% mehr Schaden.", fr = "La réduction des dégâts au-delà du plafond n'est pas perdue : chaque 1% devient {v}% de dégâts en plus.", es = "La reducción de daño por encima del límite no se desperdicia: cada 1% se convierte en un {v}% más de daño.", pt = "A redução de dano além do limite não se perde: cada 1% dela vira {v}% a mais de dano.", ru = "Снижение урона сверх предела не пропадает: каждый 1% превращается в {v}% дополнительного урона.", pl = "Redukcja obrażeń ponad limit nie przepada: każdy 1% z niej zamienia się w {v}% więcej obrażeń.", tr = "Sınırı aşan hasar azaltma boşa gitmez: her 1%'i {v}% daha fazla hasara dönüşür.", it = "La riduzione dei danni oltre il limite non va sprecata: ogni 1% diventa il {v}% di danni in più.", ja = "上限を超えた被ダメージ軽減も無駄になりません：超過分1%ごとにダメージが{v}%増加します。", zh = "超出上限的伤害减免不会浪费：每超出1%，造成的伤害提高{v}%。", ko = "상한을 넘은 피해 감소가 낭비되지 않습니다: 그 1%마다 피해가 {v}% 증가합니다." }
