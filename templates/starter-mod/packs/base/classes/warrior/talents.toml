text = { en = "Capstone. You start every run with Shield Slam, your damage reduction can reach 70% instead of 60%, and every spell you cast deals an extra 1.5% of your maximum health, and Shield Slam also strikes for 2% of its target's maximum health.", de = "Schlussstein. Du beginnst jeden Lauf mit Schildschlag, deine Schadensverringerung kann 70% statt 60% erreichen, jeder Zauber, den du wirkst, verursacht zusätzlich 1,5% deiner maximalen Gesundheit, und Schildschlag trifft zudem für 2% der maximalen Gesundheit seines Ziels.", fr = "Apogée. Tu commences chaque partie avec Heurt de bouclier, ta réduction des dégâts peut atteindre 70% au lieu de 60%, chaque sort que tu lances inflige en plus 1,5% de tes points de vie maximum, et Heurt de bouclier frappe aussi pour 2% des points de vie maximum de sa cible.", es = "Cúspide. Empiezas cada partida con Embate de escudo, tu reducción de daño puede llegar al 70% en lugar del 60%, cada hechizo que lanzas inflige adicionalmente un 1,5% de tu salud máxima, y Embate de escudo también golpea por un 2% de la salud máxima de su objetivo.", pt = "Ápice. Você começa cada partida com Pancada de Escudo, sua redução de dano pode chegar a 70% em vez de 60%, cada feitiço que você lança causa 1,5% extra da sua vida máxima, e Pancada de Escudo também atinge com 2% da vida máxima do alvo.", ru = "Вершина. Ты начинаешь каждый забег с Мощным ударом щитом, снижение урона может достигать 70% вместо 60%, каждое твоё заклинание дополнительно наносит 1,5% твоего максимального здоровья, а Мощный удар щитом также бьёт на 2% максимального здоровья цели.", pl = "Zwieńczenie. Każdą rozgrywkę zaczynasz z Uderzeniem tarczą, twoja redukcja obrażeń może sięgnąć 70% zamiast 60%, każdy rzucony czar zadaje dodatkowo 1,5% twojego maksymalnego zdrowia, a Uderzenie tarczą uderza też za 2% maksymalnego zdrowia celu.", tr = "Zirve. Her oyuna Kalkan Çarpması ile başlarsın, hasar azaltman 60% yerine 70%'e çıkabilir, yaptığın her büyü azami canının fazladan 1,5%'i kadar hasar verir ve Kalkan Çarpması ayrıca hedefinin azami canının 2%'si kadar vurur.", it = "Vertice. Inizi ogni partita con Colpo di scudo, la tua riduzione dei danni può arrivare al 70% invece del 60%, ogni incantesimo che lanci infligge un ulteriore 1,5% della tua salute massima e Colpo di scudo colpisce anche per il 2% della salute massima del bersaglio.", ja = "【キャップストーン】毎ランをシールド・スラムを持って始め、被ダメージ軽減の上限が60%から70%になります。呪文を唱えるたびに最大体力の1.5%の追加ダメージを与え、シールド・スラムは対象の最大体力の2%のダメージも与えます。", zh = "终极天赋：你在每场对局开始时拥有盾牌猛击，你的伤害减免上限从60%提高到70%，你施放的每个法术额外造成相当于你最大生命值1.5%的伤害，盾牌猛击还会造成相当于目标最大生命值2%的伤害。", ko = "궁극 특성. 모든 런을 방패 밀쳐내기를 가지고 시작하며, 피해 감소 상한이 60% 대신 70%가 됩니다. 주문을 시전할 때마다 최대 생명력의 1.5%만큼 추가 피해를 주며, 방패 밀쳐내기가 대상의 최대 생명력의 2%만큼 추가 피해를 줍니다." }
