# The pool in AS's order (`ability.*` in its texts); the first is the spell every run starts
# with. Spell ids are 3.3.5a's own ranks, so the client shows their icons, names and visuals.
# Numbers of AS's spells are AS's table (0x147106510, `re/NUMBERS.md` 18): the hit is its
# damage times AS's form factor (half for novas and ground spells); riders and buff strengths
# are ours. The WotLK spells' hits are ours, scaled with their class's AS spells. `TUNE` for
# those. A hit is one hit before the hero's and the cards' factors: a tick for ground and
# totem spells, the whole for a damage over time.

