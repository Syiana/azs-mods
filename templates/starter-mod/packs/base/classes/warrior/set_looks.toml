# The warrior's run sets dressed as the real sets they are named after (`[[set_look]]`,
# docs/HOWTO-CONTENT.md "A set look"): its pieces of each rarity show these displays and icons. A
# piece is (gear slot 0-7 head to hands, ItemDisplayInfo id, InventoryType, icon without INV_),
# read off the client's ItemSet.dbc, Item.dbc and ItemDisplayInfo.dbc (3.3.5a). The Common set
# ("Recruit's") is no real set and keeps its armor kind's icons. The PvP set has no belt and no
# bracers: those two keep their armor kind's icons too.

# Valor pieces: Battlegear of Valor, tier 0 (ItemSet 189).
[[set_look]]
key = "warrior_uncommon"
rarity = 1
pieces = [
    [0, 42241, 1, "Helmet_02"], [1, 29964, 3, "Shoulder_30"],
    [2, 29958, 5, "Chest_Plate03"], [3, 29959, 6, "Belt_34"],
    [4, 29963, 7, "Pants_04"], [5, 29960, 8, "Boots_Plate_03"],
    [6, 29961, 9, "Bracer_18"], [7, 29962, 10, "Gauntlets_26"],
]

