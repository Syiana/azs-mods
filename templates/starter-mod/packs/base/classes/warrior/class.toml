dash_legend = { en = "Heroic Leap cracks the ground: three aftershocks follow the landing, each half as strong.", de = "Heldenhafter Sprung spaltet den Boden: Drei Nachbeben folgen der Landung, jedes halb so stark.", fr = "Bond héroïque fissure le sol : trois répliques suivent l'atterrissage, chacune deux fois moins forte.", es = "Salto heroico resquebraja el suelo: tres réplicas siguen al aterrizaje, cada una con la mitad de fuerza.", pt = "Salto Heroico racha o chão: três tremores secundários seguem o pouso, cada um com metade da força.", ru = "Героический прыжок раскалывает землю: за приземлением следуют три подземных толчка, каждый вдвое слабее.", pl = "Heroiczny skok rozłupuje ziemię: po lądowaniu następują trzy wstrząsy wtórne, każdy o połowę słabszy.", tr = "Kahramanca Atlayış zemini çatlatır: inişi üç artçı sarsıntı izler, her biri yarı güçte.", it = "Balzo eroico spacca il terreno: tre scosse di assestamento seguono l'atterraggio, ciascuna forte la metà.", ja = "ヒロイック・リープが大地を割ります：着地後に半分の威力の余震が3回続きます。", zh = "英勇飞跃震裂大地：落地后会接连产生三次余震，每次强度减半。", ko = "영웅의 도약이 땅을 가릅니다: 착지 후 여진이 세 번 이어지며, 각각 절반의 위력입니다." }
