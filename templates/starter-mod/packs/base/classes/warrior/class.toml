# Balance (2026-11-08): a little more damage and a little tougher. 6 % less taken is 6 % more
# effective health (1 / 0.94 = 1.06).
damage_pct = 6
taken_pct = -6
power = "rage"
starter = "cleave"
# As 3.3.5a's character creation allows them; the worgen (12) and the goblins (9) as Cataclysm's,
