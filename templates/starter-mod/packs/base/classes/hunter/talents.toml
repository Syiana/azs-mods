text = { en = "Capstone. You start every run with Frost Trap, and an Explosive Trap sets itself at your feet every 5 sec.", de = "Schlussstein. Du beginnst jeden Lauf mit Eiskältefalle, und alle 5 Sek. legt sich eine Sprengfalle zu deinen Füßen.", fr = "Apogée. Tu commences chaque partie avec Piège de givre, et un Piège explosif se pose à tes pieds toutes les 5 s.", es = "Cúspide. Empiezas cada partida con Trampa de escarcha, y una Trampa explosiva se coloca a tus pies cada 5 s.", pt = "Ápice. Você começa cada partida com Armadilha de Gelo, e uma Armadilha Explosiva se arma aos seus pés a cada 5 s.", ru = "Вершина. Каждый забег ты начинаешь с «Ледяной ловушки», а «Взрывная ловушка» сама ставится у твоих ног каждые 5 сек.", pl = "Zwieńczenie. Każdą rozgrywkę zaczynasz z Mroźną pułapką, a Pułapka wybuchowa zakłada się sama pod twoimi stopami co 5 s.", tr = "Zirve. Her oyuna Buz Tuzağı ile başlarsın ve her 5 sn'de ayaklarının dibinde bir Patlayıcı Tuzak kurulur.", it = "Vertice. Inizi ogni partita con Trappola di ghiaccio e una Trappola esplosiva si piazza ai tuoi piedi ogni 5 s.", ja = "【キャップストーン】毎ランをフロスト・トラップを持って始め、5秒ごとにエクスプローシブ・トラップが足元に自動で仕掛けられます。", zh = "终极天赋：你在每场对局开始时拥有冰霜陷阱，并且每5秒会在你脚下自动布置一个爆炸陷阱。", ko = "궁극 특성. 모든 런을 냉기의 덫을 가지고 시작하며, 5초마다 발밑에 폭발의 덫이 저절로 설치됩니다." }
