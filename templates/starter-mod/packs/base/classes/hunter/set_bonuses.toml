# Original: play nth_cast [auto_shot] -> multi_shot every v
[[set_bonus]]
key = "hunter_common_8"
tier = "common"
pieces = 8
text = { en = "Every {v} Auto Shots fire a free Multi-Shot.", de = "Jeder {v}. Automatische Schuss feuert einen kostenlosen Mehrfachschuss ab.", fr = "Tous les {v} Tirs automatiques, des Flèches multiples gratuites partent.", es = "Cada {v} Disparos automáticos lanzan un Disparo múltiple gratuito.", pt = "A cada {v} Disparos Automáticos, um Tiro Múltiplo grátis é disparado.", ru = "Каждый {v}-й выстрел «Автоматической стрельбы» даёт бесплатный «Залп».", pl = "Co {v}. Automatyczny Strzał odpala darmowy Wielostrzał.", tr = "Her {v} Auto Shot'ta bir bedava Multi-Shot atılır.", it = "Ogni {v} Spari automatici lanciano uno Sparo multiplo gratuito.", ja = "オート・ショットを{v}回放つごとに、無料のマルチショットを放ちます。", zh = "每{v}次自动射击会免费发射一次多重射击。", ko = "자동 사격을 {v}번 할 때마다 일제 사격을 무료로 발사합니다." }

[[set_bonus.part]]
