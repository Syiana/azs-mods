# The hunter's run sets dressed as the real sets they are named after (`[[set_look]]`,
# docs/HOWTO-CONTENT.md "A set look"): its pieces of each rarity show these displays and icons. A
# piece is (gear slot 0-7 head to hands, ItemDisplayInfo id, InventoryType, icon without INV_),
# read off the client's ItemSet.dbc, Item.dbc and ItemDisplayInfo.dbc (3.3.5a). The Common set
# ("Tracker's") is no real set and keeps its armor kind's icons. The PvP set has no belt and no
# bracers: those two keep their armor kind's icons too.

# Beaststalker's pieces: Beaststalker Armor, tier 0 (ItemSet 186).
[[set_look]]
key = "hunter_uncommon"
rarity = 1
pieces = [
    [0, 31410, 1, "Helmet_24"], [1, 31409, 3, "Shoulder_10"],
    [2, 31402, 5, "Chest_Chain_03"], [3, 31404, 6, "Belt_28"],
    [4, 31403, 7, "Pants_03"], [5, 31408, 8, "Boots_Plate_07"],
    [6, 31405, 9, "Bracer_17"], [7, 31406, 10, "Gauntlets_10"],
]

