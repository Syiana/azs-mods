# The mage's run sets dressed as the real sets they are named after (`[[set_look]]`,
# docs/HOWTO-CONTENT.md "A set look"): its pieces of each rarity show these displays and icons. A
# piece is (gear slot 0-7 head to hands, ItemDisplayInfo id, InventoryType, icon without INV_),
# read off the client's ItemSet.dbc, Item.dbc and ItemDisplayInfo.dbc (3.3.5a). The Common set
# ("Apprentice's") is no real set and keeps its armor kind's icons. The PvP set has no belt and no
# bracers: those two keep their armor kind's icons too.

# Magister's pieces: Magister's Regalia, tier 0 (ItemSet 181).
[[set_look]]
key = "mage_uncommon"
rarity = 1
pieces = [
    [0, 31087, 1, "Crown_02"], [1, 30211, 3, "Shoulder_23"],
    [2, 29591, 20, "Chest_Cloth_25"], [3, 29596, 6, "Belt_08"],
    [4, 29273, 7, "Pants_06"], [5, 29594, 8, "Boots_02"],
    [6, 29597, 9, "Jewelry_Ring_23"], [7, 29593, 10, "Gauntlets_17"],
]

