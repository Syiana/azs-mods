text = { en = "Capstone. You start every run with Arcane Missiles instead of Fireball, and your spells strike twice {v}% more often. Your echoes cascade: a spell that strikes twice rolls again to strike once more, up to 3 more times in a row.", de = "Schlussstein. Du beginnst jeden Lauf mit Arkanen Geschossen statt Feuerball, und deine Zauber treffen {v}% öfter doppelt. Deine Echos kaskadieren: Ein Zauber, der doppelt trifft, würfelt erneut, um noch einmal zu treffen, bis zu 3 weitere Male in Folge.", fr = "Apogée. Tu commences chaque partie avec Projectiles des arcanes au lieu de Boule de feu, et tes sorts frappent deux fois {v}% plus souvent. Tes échos se propagent : un sort qui frappe deux fois retente sa chance de frapper une fois de plus, jusqu'à 3 fois de suite.", es = "Cúspide. Empiezas cada partida con Misiles Arcanos en lugar de Bola de fuego, y tus hechizos golpean dos veces un {v}% más a menudo. Tus ecos se propagan: un hechizo que golpea dos veces tira de nuevo para golpear una vez más, hasta 3 veces seguidas.", pt = "Ápice. Você começa cada partida com Mísseis Arcanos em vez de Bola de Fogo, e seus feitiços atingem duas vezes {v}% mais vezes. Seus ecos se propagam: um feitiço que atinge duas vezes rola de novo para atingir mais uma vez, até 3 vezes seguidas.", ru = "Вершина. Каждый забег ты начинаешь с «Чародейских стрел» вместо «Огненного шара», а твои заклинания бьют дважды на {v}% чаще. Твое эхо каскадом: заклинание, ударившее дважды, снова бросает кость и может ударить еще раз, до 3 раз подряд.", pl = "Zwieńczenie. Każdą rozgrywkę zaczynasz z Magicznymi pociskami zamiast Kuli ognia, a twoje czary uderzają dwukrotnie o {v}% częściej. Echa kaskadują: czar, który uderza dwa razy, losuje ponownie i może uderzyć jeszcze raz, do 3 razy z rzędu.", tr = "Zirve. Her oyuna Ateş Topu yerine Gizemli Füzeler ile başlarsın ve büyülerin {v}% daha sık iki kez vurur. Yankıların çağlar: iki kez vuran büyü bir kez daha vurmak için yeniden zar atar, arka arkaya en fazla 3 kez daha.", it = "Vertice. Inizi ogni partita con Dardi arcani invece di Palla di fuoco e i tuoi incantesimi colpiscono due volte il {v}% più spesso. I tuoi echi si propagano: un incantesimo che colpisce due volte tira di nuovo per colpire ancora, fino a 3 volte di fila.", ja = "【キャップストーン】毎ランをファイアボールの代わりにアーケイン・ミサイルを持って始め、呪文が2度命中する確率が{v}%増加します。エコーが連鎖します：2度命中した呪文はさらにもう1度命中する判定を行い、最大3回まで続きます。", zh = "终极天赋：你在每场对局开始时拥有奥术飞弹而非火球术，你的法术打击两次的几率提高{v}%。回响会连锁：打击两次的法术会再次判定是否再打击一次，最多连续3次。", ko = "궁극 특성. 모든 런을 화염구 대신 신비한 화살을 가지고 시작하며, 주문이 두 번 적중할 확률이 {v}% 증가합니다. 메아리가 연쇄됩니다: 두 번 적중한 주문은 다시 판정하여 한 번 더 적중할 수 있으며, 최대 3번까지 연속됩니다." }
menu_v = 0.2
plays = [
    { v = 1.0, play = { cascade = 3 } },
]

