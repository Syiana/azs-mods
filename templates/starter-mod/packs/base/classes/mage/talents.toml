# Ours (2026-11-10, tester feedback): the elemental's casts copy the hero's Frostbolt (`blow_cast`), so it
# scales with the run's upgrades; its own bolt alone did not.
[[talent]]
key = "water_elemental"
tree = 2
row = 6
col = 1
ranks = 1
effects = [{ start_instead = "frostbolt" }]
icon = "Spell_Frost_SummonWaterElemental"
name = { en = "Summon Water Elemental", de = "Wasserelementar beschwören", fr = "Invocation d'un élémentaire d'eau", es = "Invocar elemental de agua", pt = "Invocar Elemental da Água", ru = "Призыв элементаля воды", pl = "Przyzwanie żywiołaka wody", tr = "Su Elementali Çağır", it = "Evocare elementale dell'acqua", ja = "サモン・ウォーター・エレメンタル", zh = "召唤水元素", ko = "물의 정령 소환" }
text = { en = "Capstone. You start every run with Frostbolt instead of Fireball. A Water Elemental fights at your side, hurling Frostbolts, and each of its casts also fires a free copy of your Frostbolt with all your upgrades, Splitting Ice included. A free Frost Nova bursts from you every 8 sec.", de = "Schlussstein. Du beginnst jeden Lauf mit Frostblitz statt Feuerball. Ein Wasserelementar kämpft an deiner Seite und schleudert Frostblitze, und mit jedem Zauber feuert er zusätzlich eine kostenlose Kopie deines Frostblitzes mit allen deinen Verbesserungen, Splitterndes Eis eingeschlossen. Alle 8 Sek. bricht eine kostenlose Frostnova aus dir hervor.", fr = "Clé de voûte. Tu commences chaque partie avec Éclair de givre au lieu de Boule de feu. Un élémentaire d'eau combat à tes côtés en lançant des Éclairs de givre, et chacun de ses sorts tire aussi une copie gratuite de ton Éclair de givre avec toutes tes améliorations, Glace fendante comprise. Une Nova de givre gratuite jaillit de toi toutes les 8 s.", es = "Piedra angular. Empiezas cada partida con Descarga de escarcha en lugar de Bola de fuego. Un elemental de agua lucha a tu lado lanzando Descargas de escarcha, y cada uno de sus lanzamientos dispara además una copia gratis de tu Descarga de escarcha con todas tus mejoras, incluido Hielo astillante. Una Nova de escarcha gratis estalla de ti cada 8 s.", pt = "Pedra angular. Você começa cada partida com Seta de Gelo em vez de Bola de Fogo. Um Elemental da Água luta ao seu lado lançando Setas de Gelo, e cada lançamento dele também dispara uma cópia grátis da sua Seta de Gelo com todos os seus aprimoramentos, Gelo Fendente incluído. Uma Nova de Gelo grátis explode de você a cada 8 s.", ru = "Вершина. Ты начинаешь каждый забег с Ледяной стрелы вместо Огненного шара. Элементаль воды сражается рядом с тобой, метая Ледяные стрелы, и каждый его бросок выпускает еще и бесплатную копию твоей Ледяной стрелы со всеми твоими улучшениями, включая «Раскалывающийся лед». Бесплатное Кольцо льда вырывается из тебя каждые 8 сек.", pl = "Zwieńczenie. Każdą rozgrywkę zaczynasz z Lodowym pociskiem zamiast Kuli ognia. Żywiołak wody walczy u twego boku i ciska Lodowe pociski, a każdy jego rzut wypuszcza też darmową kopię twojego Lodowego pocisku ze wszystkimi twoimi ulepszeniami, w tym z Pękającym lodem. Darmowa Lodowa nova wybucha z ciebie co 8 s.", tr = "Zirve. Her oyuna Ateş Topu yerine Buz Oku ile başlarsın. Bir Su Elementali yanında savaşıp Buz Okları fırlatır ve her atışında ayrıca Buz Okunun bedava bir kopyasını, tüm geliştirmelerin ve Bölünen Buz dahil, fırlatır. Her 8 sn'de senden bedava bir Buz Nova patlar.", it = "Vertice. Inizi ogni partita con Dardo di ghiaccio invece di Palla di fuoco. Un elementale dell'acqua combatte al tuo fianco lanciando Dardi di ghiaccio e ogni suo lancio spara anche una copia gratuita del tuo Dardo di ghiaccio con tutti i tuoi potenziamenti, Ghiaccio divisore incluso. Una Nova di ghiaccio gratuita esplode da te ogni 8 s.", ja = "【キャップストーン】毎ランをファイアボールの代わりにフロストボルトを持って始めます。ウォーター・エレメンタルが共に戦ってフロストボルトを放ち、その詠唱のたびにあなたのすべての強化（スプリッティング・アイスを含む）を備えたフロストボルトの複製も無料で放たれます。8秒ごとに無料のフロスト・ノヴァが炸裂します。", zh = "终极天赋：你在每场对局开始时拥有寒冰箭而非火球术。一个水元素在你身边作战，投掷寒冰箭，它每次施法还会免费发射一枚你的寒冰箭复制品，带有你的所有强化，包括分裂寒冰。每8秒会从你身上爆发一次免费的冰霜新星。", ko = "궁극 특성. 모든 런을 화염구 대신 얼음화살을 가지고 시작합니다. 물의 정령이 곁에서 싸우며 얼음화살을 던지고, 시전할 때마다 당신의 모든 강화가 적용된 얼음화살을 무료로 하나 더 발사합니다. 갈라지는 얼음도 포함됩니다. 8초마다 얼음 회오리가 무료로 터져 나옵니다." }
plays = [
    { v = 0.0, play = { pet = { pet = "water_elemental", cleave = false } } },
    { v = 8.0, play = { every = "frost_nova" } },
]
behaviors = [
    { behavior = "blow_cast", pet = "water_elemental", spell = "frostbolt" },
]
