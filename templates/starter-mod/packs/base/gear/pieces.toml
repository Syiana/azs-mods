# What a piece of each slot adds, and the eight class profiles (re/NUMBERS.md 14.7).
# Imported from the original game by tools/set-bonus-pack.js; this file is the source now:
# edit the numbers here, the importer does not overwrite it without --force.

# Shares are fractions (0.012 is 1.2%); health and regen are flat. The weapons' slots (8 main
# hand, 9 off hand, 10 ranged) take no class profile.

