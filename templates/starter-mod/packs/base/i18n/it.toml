# How a set tail and a noun join: `noun_set` after one of the `noun_first` prefixes (`|`-split;
# none for most languages), `set_noun` otherwise. A pack's own sets use the same formats.
[gear.format]
noun_set = "{noun} {set}"
set_noun = "{noun} {set}"
noun_first = ""

[spell]
talent_row = "{name} (talento)"
