# The holidays (survivors-sim events.rs). The schedule that runs them is web/events.json; `when` is
# WoW's own dates, a hint for it. `looks` dress part of the waves (creature_type: 1 beast, 2 dragonkin,
# 4 elemental, 7 humanoid, 9 mechanical, 10 not specified, 6 undead); `elite` comes every few minutes;
# `token` is the currency pile (GameObjectDisplayInfo.dbc id, scale); `shop` sells (item, price in the
# holiday's currency). `TUNE` the prices.
#
# Every holiday. Their order makes the creature entries of their looks (`ENTRY_BASE`) and the
# currency piles' object entries (`TOKEN_ENTRY`): new ones go at the end. The displays are the
# stock 3.3.5a `CreatureDisplayInfo.dbc`'s (their models in the comments).

