# The Game Pass seasons (survivors-sim pass.rs): each with its two 30-tier tracks, tier 1 first.
# `duplicate_cap` is the most an owned cosmetic of its premium track pays instead (none: half price).
#
# Every season written, the first first. A season past the last is an encore of
# `SEASONS[(season - 1) % len]` (`season_info`): rotate, not repeat the latest, so every theme
# comes round again.
#
# Season 1: the free track, tier 1 first. Left as it shipped for the accounts in it. `TUNE`
#
# Season 1: the premium track, tier 1 first; it ends in the two sets only the pass gives. `TUNE`
#
# Season 2, Secrets of Ulduar: the free track. Its gold is season 1's, tier for tier (16 600 in
# all), its cosmetics the shop's, in Titan gold, Ulduar's runes and Yogg-Saron's void. `TUNE`
#
# Season 2, Secrets of Ulduar: the premium track. Five rewards only this pass gives: the
# Starcaller title (tier 14, Algalon's), the Void Dancing Steel (20), the Herald of the Titans
# name (25), the Deadly Gladiator's Frost Wyrm (29) and Conqueror's Siegebreaker Battlegear (30).
# Its gold and every other cosmetic at `DUPLICATE_CAP` stay under
# `PREMIUM_PRICE` (`payback`). `TUNE`

