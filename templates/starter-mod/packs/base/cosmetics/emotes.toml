# The emotes (survivors-sim emotes.rs), starters (price 0) first. `anim` is the Emotes.dbc id: 2 bow, 3 wave,
# 4 cheer, 10 dance (a state), 11 laugh, 15 roar, 17 kiss, 23 flex, 66 salute, 253 applaud (state),
# 391 roar (state), 392 laugh (state); 600-604 are patch-J's own dances (disco, rock, jig, shanty, party),
# which a model without them plays as the stock Dance. `kit` is the SpellVisualKit.dbc kit on the hero:
# 2084-2088 the fireworks' (11540-11544), 860 Party Fever's impact, 5034 Tag: Hearts' state.
# A looping one's `aura` is a spell held on the hero while it lasts, its state kit the look: 44016
# Has Pumpkin Head, 61292 Has a Borrowed Broom (stock 3.3.5a), or patch-~'s for an admin emote.
# `staff` makes it an admin emote (the staff's alone, never sold, last).
#
# Every emote, starters first. `TUNE` the prices; the addon's `Emotes.lua` names the same keys.

