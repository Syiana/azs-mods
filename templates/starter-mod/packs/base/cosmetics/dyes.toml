# The shop's gear dyes (survivors-sim dyes.rs, docs/PLAN-RECOLOR.md): a hero's armour and weapons
# recoloured slot by slot, bought in packs with the account's gold, owned for every hero.
#
# dye: the palette, in wire order: the first 32 use place plus one; later entries skip reserved glow
# indices 33-46 (0 none), so new ones go at the end. Each: the hue in degrees (0 red, 120 green, 240
# blue), the saturation 0-1, the luminance gain, and the pack that holds it. The canonical table
# for code is `benilla_formats::dye::DYES`; a survivors-sim test checks the two agree.
#
# dye_pack: the packs and their prices in gold; `basic` costs nothing and every account owns it.
# The pack with `glow = true` holds no gear dye: it unlocks the glow colours (wire index 33 on,
# benilla_formats::dye::GLOW_DYES) that paint the wings, and the shop sells it beside them.

