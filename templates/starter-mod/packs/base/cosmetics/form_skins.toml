# The shop's form skins (survivors-sim formskins.rs): another look for a shapeshift form, worn by
# every hero that takes it. `form` is the form's id (the talent's `form.id`: 1 Cat Form, 8 Dire Bear
# Form), `display` a CreatureDisplayInfo.dbc id of the model it shows in the form's place, `races`
# a race's own model of it ([[race id, display]]; the others show `display`). `TUNE` the prices.
#
# Cat Form: the druid cat's own colours (the night elf cat and the tauren cat, a pair of the
# same colour each) first, then the big cats of the stock client at their natural size (display
# scale 1.0 to 1.15, the druid cat's own is 0.9 to 1.0).

# Creature\DruidCat (display 29408) and Creature\DruidCatTauren (29409), white.
[[form_skin]]
key = "snow"
name = { en = "Snow Cat", de = "Schneekatze", fr = "Félin des neiges", es = "Felino de las nieves", pt = "Felino da Neve", ru = "Снежная кошка", pl = "Śnieżny kot", tr = "Kar Kedisi", it = "Felino delle nevi", ja = "スノーキャット", zh = "雪豹", ko = "설원 표범" }
price = 4000
form = 1
display = 29408
races = [[6, 29409]]

