# The wardrobe's transmog sets (survivors-sim wardrobe.rs). A set's place is its number on the wire (`w<index>`):
# new sets go at the end. `pieces` are (gear slot, ItemDisplayInfo id, InventoryType).
#
# Every set. The index is the set's number on the wire (`w<index>` in a look), so new sets go
# at the end. The client's table (SurvivorsWardrobe.lua) is in this order. `TUNE` the prices.
# `class` is the class whose tier set it is (any hero may wear it): the shop sells at least one
# set of every class (test the_shop_sells_a_wardrobe_set_of_every_class). `admin = true` makes it an
