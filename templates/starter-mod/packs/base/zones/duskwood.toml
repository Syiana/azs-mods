# As in Elwynn: a little inside AS's 120, widening past it.
radius = 100.0
# WorldMapArea 34, "Duskwood".
map_bounds = [833.3333, -1866.6666, -9716.666, -11516.666]
health_factor = 0.97
gold_factor = 1.11
late_factor = 0.0
# AS keeps Duskwood at midnight (0). Use early evening so the battlefield is easier to read. `TUNE`
