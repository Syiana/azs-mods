# Scarlet Monastery, "The Crusade's Last Stand".
#
# AS's enemies, elites and bosses with its sizes (`re/NUMBERS.md` 1.2); the place is ours
# where AS's arena lies in an instance.
#
# Entries, names, creature types and display ids are AS's own where AS has the zone; health,
# damage, speeds, spawn costs, minutes and the place are first guesses until read from the game.
# `TUNE`

[[zone]]
key = "sm"
order = 7
name = { en = "Scarlet Monastery", de = "Scharlachrotes Kloster", fr = "Monastère écarlate", es = "Monasterio Escarlata", pt = "Mosteiro Escarlate", ru = "Монастырь Алого ордена", pl = "Szkarłatny Klasztor", tr = "Kızıl Manastır", it = "Monastero Scarlatto", ja = "スカーレット・モナステリー", zh = "血色修道院", ko = "붉은십자군 수도원" }
subtitle = { en = "The Crusade's Last Stand", de = "Das letzte Gefecht des Kreuzzugs", fr = "Le dernier combat de la Croisade", es = "La última batalla de la Cruzada", pt = "A Última Batalha da Cruzada", ru = "Последний бой Алого похода", pl = "Ostatni bastion Krucjaty", tr = "Seferin Son Direnişi", it = "L'ultima resistenza della Crociata", ja = "聖戦士団の最後の砦", zh = "十字军的最后防线", ko = "십자군의 최후 저항" }
# The menu's zone button (`Interface\Icons\...`).
icon = "Achievement_Zone_Tirisfalglades_01"
# Inside the instance, in the Graveyard's walled cemetery between the crypts (map 189,
# `monestary_cemetery.wmo`). Like Naxxramas it is a WMO over flat placeholder tiles, so the arena
# stands on its floor (`floor` below, `places::floor`) and the void past its walls is
# blocked (`places::floor_only`).
map = 189
map_name = "MonasteryInstances"
area = 796
# The cemetery's middle: its walls stand at x 1736 to 1860, y 1234 to 1366.
center = [1798.0, 1300.0]
# Wall to wall some 60 yd from the middle, the crypts inside it. `TUNE`
radius = 50.0
# DungeonMap 137, the Monastery's floor 1 (the Graveyard): the cemetery's WMO group draws on it
# (`DungeonMapChunk`), so it is the rect the client reads the hero's map position against here,
# and the minimap's pins fall where the chests stand.
map_bounds = [1567.97, 947.986, 2030.1814, 1616.8586]
health_factor = 2.33
gold_factor = 1.77
late_factor = 0.12
hour = 12
weather = { fine = 85, rain = 15 }
# The cemetery's floor, read off its WMO: the grass and the path lie at 18 to 19.
floor = 18.5

# The hero menu's 3D map preview of this zone, as the Menu Designer saved it.
[zone.menu_view]
focus = [1963.2422, 1480.355]
turn = 0
