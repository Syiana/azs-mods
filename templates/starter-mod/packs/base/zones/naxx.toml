# Naxxramas, "The Scourge Invasion": inside the necropolis, in Kel'Thuzad's chamber.
#
# AS's enemies, elites and bosses with its sizes (`re/NUMBERS.md` 1.2); the place is ours
# where AS's arena lies in an instance.
#
# Entries, names, creature types and display ids are AS's own where AS has the zone; health,
# damage, speeds, spawn costs, minutes and the place are first guesses until read from the game.
# `TUNE`

[[zone]]
key = "naxx"
order = 11
name = { en = "Naxxramas", de = "Naxxramas", fr = "Naxxramas", es = "Naxxramas", pt = "Naxxramas", ru = "Наксрамас", pl = "Naxxramas", tr = "Naxxramas", it = "Naxxramas", ja = "ナクスラーマス", zh = "纳克萨玛斯", ko = "낙스라마스" }
subtitle = { en = "The Scourge Invasion", de = "Die Invasion der Geißel", fr = "L'invasion du Fléau", es = "La invasión de la Plaga", pt = "A Invasão do Flagelo", ru = "Вторжение Плети", pl = "Inwazja Plagi", tr = "Yıkım Ordusu İstilası", it = "L'invasione del Flagello", ja = "スカージの侵攻", zh = "天灾入侵", ko = "스컬지 침공" }
# The menu's zone button (`Interface\Icons\...`).
icon = "Achievement_Zone_EasternPlaguelands"
# Inside the necropolis, in Kel'Thuzad's chamber of the Naxxramas instance (map 533), where
# TrinityCore seats Kel'Thuzad (3716.4, -5106.4, 141.3). Its halls are WMOs over map 533's ADT
# ground, so the arena stands on their floor (`floor` below, `places::floor`) and the
# void past the walls is blocked (`places::floor_only`).
map = 533
map_name = "Stratholme Raid"
area = 3456
center = [3716.4, -5106.4]
# The chamber is open floor some 44 yd out from its middle, walled past that. `TUNE`
radius = 40.0
# DungeonMap 73, Naxxramas's floor 6 (the Frostwyrm Lair and Kel'Thuzad's chamber), the rect the
# client's own map position is read against inside the instance.
map_bounds = [-4866.35, -5522.29, 3816.54, 3379.25]
health_factor = 6.25
gold_factor = 2.21
late_factor = 0.4
hour = 12
# Noon, not night: at night the night dimming (Night Darkness) made the run almost black. The edge
# stays the night's, as it was (`dark_sky`).
dark_sky = true
weather = { fine = 85, rain = 15 }
# The floor of Kel'Thuzad's chamber, where TrinityCore seats Kel'Thuzad (z 141.3).
floor = 141.3

# The hero menu's 3D map preview of this zone, as the Menu Designer saved it.
[zone.menu_view]
turn = 0
