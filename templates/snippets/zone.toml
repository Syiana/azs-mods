icon = "INV_Misc_Head_Gnoll_01"
health = 3600
damage = 22
speed = 5.6
minute = 8
final = true
yell = { en = "Leave my glade!", de = "Verlasst meine Lichtung!", fr = "Quittez ma clairière !", es = "¡Fuera de mi claro!", pt = "Saiam da minha clareira!", ru = "Прочь с моей поляны!", pl = "Precz z mojej polany!", tr = "Açıklığımdan defolun!", it = "Andatevene dalla mia radura!", ja = "わしの空き地から出ていけ！", zh = "离开我的林地！", ko = "내 빈터에서 나가라!" }
kit = "yourname.example:glade_warden"
