name = { en = "Glade Warden", de = "Lichtungswächter", fr = "Gardien de la clairière", es = "Guardián del claro", pt = "Guardião da Clareira", ru = "Страж поляны", pl = "Strażnik polany", tr = "Açıklık Bekçisi", it = "Guardiano della radura", ja = "空き地の番人", zh = "林地守望者", ko = "빈터 수호자" }
type = "humanoid"
