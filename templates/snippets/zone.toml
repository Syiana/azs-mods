# Snippet: a zone of your own: where it is, what comes, and the boss at the end.
#
# Goes in:  packs/<your package>/zones/glade.toml
# Needs:    boss-kit.toml (the kit its boss names), in the same package.
# Lock:     nothing to declare: a new entry is no override.
# Rules:    - Keys carry your package's name: "<your package>:<name>".
#           - `name`, `subtitle`, every enemy's `name` and the boss's `yell` carry all twelve
#             languages: en de fr es pt ru it pl tr ja zh ko.
#           - `map`, `area`, `center`, `radius` and `map_bounds` are a place of the player's own
#             client (this one is the meadow south of Goldshire, Elwynn Forest, as the game's
#             Elwynn zone uses it). The zone reads its ground from the player's client; the
#             package carries no map files.
#           - `display` numbers are CreatureDisplayInfo ids of the player's client (the model),
#             `icon` an icon name of it.
#           - `entry` numbers name the creatures: unique in its zone (a number no other zone uses
#             avoids confusion).
#           - Your package's zone joins every game mode that loads the packs your package
#             requires (pack.toml `requires`), so it needs no mode of its own.
#           - More enemies: snippets/enemy.toml. Every field of a zone: the content reference,
#             "A zone".
# Checked:  together with boss-kit.toml, in a copy of templates/starter-mod with
#           `azs-content profile-check`. Not played in a run.

[[zone]]
key = "yourname.example:glade"
order = 100
name = { en = "Whispering Glade", de = "Flüsternde Lichtung", fr = "Clairière murmurante", es = "Claro susurrante", pt = "Clareira Sussurrante", ru = "Шепчущая поляна", pl = "Szepcząca polana", tr = "Fısıldayan Açıklık", it = "Radura sussurrante", ja = "ささやきの空き地", zh = "低语林地", ko = "속삭이는 빈터" }
subtitle = { en = "A starter zone", de = "Eine Einsteigerzone", fr = "Une zone de départ", es = "Una zona inicial", pt = "Uma zona inicial", ru = "Начальная зона", pl = "Strefa startowa", tr = "Bir başlangıç bölgesi", it = "Una zona iniziale", ja = "はじまりのゾーン", zh = "新手区域", ko = "시작 지역" }
icon = "Achievement_Zone_ElwynnForest"
map = 0
map_name = "Azeroth"
area = 12
center = [-9530.0, 40.0]
radius = 100.0
map_bounds = [1535.4166, -1935.4166, -7939.583, -10254.166]
health_factor = 0.82
gold_factor = 1.0
late_factor = 0.0
hour = 10
weather = { fine = 85, rain = 15 }

[[zone.enemy]]
entry = 990001
name = { en = "Glade Wolf", de = "Lichtungswolf", fr = "Loup de la clairière", es = "Lobo del claro", pt = "Lobo da Clareira", ru = "Полянный волк", pl = "Wilk z polany", tr = "Açıklık Kurdu", it = "Lupo della radura", ja = "空き地のオオカミ", zh = "林地之狼", ko = "빈터 늑대" }
type = "beast"
display = 165
icon = "Ability_Hunter_Pet_Wolf"
health = 18
damage = 3
swing = 1.3
speed = 7.4
cost = 1.0
from = 0.0

[[zone.enemy]]
entry = 990002
name = { en = "Glade Poacher", de = "Lichtungswilderer", fr = "Braconnier de la clairière", es = "Cazador furtivo del claro", pt = "Caçador Furtivo da Clareira", ru = "Браконьер с поляны", pl = "Kłusownik z polany", tr = "Açıklık Kaçak Avcısı", it = "Bracconiere della radura", ja = "空き地の密猟者", zh = "林地偷猎者", ko = "빈터 밀렵꾼" }
