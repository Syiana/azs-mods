# Snippet: a game mode of your own, on top of the standard campaign.
#
# Goes in:  modes/<your package>/frail_horde.toml (at the top of the profile, beside packs/;
#           not inside your package's folder). Its key is then "<your package>:frail_horde".
# Lock:     profile.json, in your package's "objects": this file with "kind": "mode".
#           `azs-release profile-lock` hashes it; it does not add it to the lock for you.
# Rules:    - `extends = "standard"` takes every setting of the game's Campaign; write down only
#             what you change ([horde], [hero], [coop], ...). Every setting and its range: the
#             game's modes/standard.toml and the content reference, "A mode".
#           - `[card]` makes the mode show in the Game Modes window; `[i18n.<language>]` gives its
#             texts in the eleven other languages (de fr es pt ru it pl tr ja zh ko).
#           - A mode that changes the numbers keeps its runs off the leaderboards; a mod's runs
#             are Modded anyway. Say so in its rules.
#           - To replace a game mode whole, write `replaces = "<key>"` instead and declare
#             { "dependency": "base", "entity": "mode:<key>" } in your package's "overrides".
# Checked:  in a copy of templates/starter-mod with `azs-content profile-check`, which reads the
#           sources; it does not validate a mode's settings (its JSON says
#           "runtime_modes_validated": false). The game's full mode check was not run.

name = "Frail Horde"
extends = "standard"

[card]
order = 10
icon = "Ability_Hunter_Pet_Wasp"
color = [0.45, 0.7, 0.2]
tag = "SOLO · CO-OP"
text = "The campaign's zones with a horde that falls fast."
rules = ["Enemies have 40% less health"]
rewards = [["INV_Misc_Coin_01", "Gold"]]

