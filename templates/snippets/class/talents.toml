# Snippet: the new class's talent trees and talents (see class.toml in this folder).
#
# Goes in:  packs/<your package>/classes/frost_knight/talents.toml
# Rules:    - A class has three trees (`index` 0, 1, 2) of seven rows (`row` 0 to 6).
#           - Every tree and talent names its class by the class's whole key.
#           - Keys carry your package's name. Names and texts carry all twelve languages.
#           - The build string reads a tree talent by talent in file order: add new talents at
#             the end of their tree, or saved builds shift.
#           - `background` names the stock talent window's art and the hero menu does not read
#             it; the hero menu draws class.toml's `talent_art`, else the dark ground alone.
#           - A talent whose English `text` starts with "Milestone." or "Capstone." is drawn as
#             one; the run's capstone is a one-rank talent of row 6.
#           - Every talent field (effects, mods, plays, behaviors, exclusive, req): the content
#             reference, "A talent".

[[talent_tree]]
key = "yourname.example:frost_knight_rime"
class = "yourname.example:frost_knight"
index = 0
icon = "Spell_Frost_FrostArmor02"
background = "DeathKnightFrost"
