# Snippet: a new class, from content alone (class.toml, spells.toml, talents.toml in one folder).
#
# Goes in:  packs/<your package>/classes/frost_knight/class.toml
#           with spells.toml and talents.toml of this folder beside it.
# Lock:     nothing to declare: a new class is no override.
# Rules:    - The key carries your package's name: "<your package>:<name>". Its token (the
#             upper-cased part after the colon, here FROST_KNIGHT) must be one no other class has.
#           - `id` is a free ChrClasses id, 1 to 31. Taken today: 1 to 9 and 11 to 13; official
#             classes take new ids upward from 14, mods by convention downward from 31. A taken id
#             or token fails the check.
#           - `starter` names the class's first spell, defined in its spells.toml.
#           - `races` are ChrRaces ids of the player's client; `starter_weapons` item entries of it.
#           - Every `name` and set or weapon word carries all twelve languages:
#             en de fr es pt ru it pl tr ja zh ko.
#           - Optional: `spell_tone = 1..15` draws all its spells in one hue of the game's palette;
#             `talent_art` names a PNG of your package as its talent window's painting (see the
#             content reference, "A class"; a package with a picture plays in no browser).
#           - A class without talents.toml plays with no talents.
#           - The class joins every game mode that loads the packs your package requires.
# Checked:  the three files together, in a copy of templates/starter-mod with
#           `azs-content profile-check`. Not played in a run. Derived from the game's own test
#           fixture for a mod class, which a run does play.

