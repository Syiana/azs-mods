# Snippet: more enemies for your zone: a ranged enemy and a second elite with a kit of its own.
#
# Goes in:  the end of your zone's file, packs/<your package>/zones/glade.toml (zone.toml). An
#           enemy belongs to the [[zone]] above it; it is no entry of its own.
# Lock:     nothing to declare.
# Rules:    - `name` carries all twelve languages: en de fr es pt ru it pl tr ja zh ko.
#           - `entry` names the creature: unique in its zone (a number no other zone uses avoids
#             confusion).
#           - `display` is a CreatureDisplayInfo id of the player's client, `spell` a spell id of it.
#           - `cost` is what it takes of the wave director's budget, `from` the minute it starts
#             to come.
#           - `role` (normal enemies only): `ranged` stops `range` yards off and throws `spell`;
#             `exploder` walks up and bursts. An elite takes no `role`.
#           - An elite's kit cannot call a Lua script; only boss kits and phases do.
# Checked:  appended to zone.toml, with boss-kit.toml, in a copy of templates/starter-mod with
#           `azs-content profile-check`. Not played in a run.

